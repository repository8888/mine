<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="robots" content="noindex, nofollow" />
<title>Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf8;
    --ink:#1c1b19;
    --ink-soft:#6b6862;
    --ink-faint:#9c9891;
    --line:#e5e2dc;
    --accent:#8a6f4e;
    --accent-soft:#f0e9df;
    --panel:#ffffff;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --col:720px;
    --read:19px;
    --tap:32px;
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
    overscroll-behavior-y:none;
  }
  ::selection{background:#e7dcc9;}

  /* ---------- header ---------- */
  #topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(251,250,248,.94);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-left:var(--safe-l);padding-right:var(--safe-r);
  }
  .bar{max-width:var(--col);margin:0 auto;padding:0 24px;height:54px;display:flex;align-items:center;gap:10px;}
  .brand{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}

  .search{position:relative;display:flex;align-items:center;flex:0 0 auto;}
  .search input{
    font-family:var(--sans);font-size:12px;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:0 32px 0 13px;height:var(--tap);width:150px;outline:none;
    -webkit-appearance:none;appearance:none;
    transition:border-color .15s,width .2s,background .15s;
  }
  .search input:focus{border-color:var(--accent);width:210px;background:var(--panel);}
  .search input::placeholder{color:var(--ink-faint);}
  .search button{
    position:absolute;right:3px;width:26px;height:26px;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    border-radius:50%;padding:0;
  }
  .search button svg{width:14px;height:14px;fill:currentColor;}

  .btn{
    font-family:var(--sans);font-size:12px;line-height:1;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:999px;
    height:var(--tap);padding:0 13px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
    display:inline-flex;align-items:center;
    transition:background .15s,color .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--ink-faint);color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);}
  .btn.icon{padding:0;width:var(--tap);justify-content:center;}
  .btn.icon svg{width:15px;height:15px;fill:currentColor;}

  /* ---------- player ---------- */
  #player{max-width:var(--col);margin:0 auto;padding:0 24px 6px;display:flex;align-items:center;gap:7px;}
  .pbtn{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:50%;flex:0 0 auto;
    transition:background .15s,color .15s;}
  .pbtn:hover{background:var(--accent-soft);color:var(--accent);}
  .pbtn svg{width:16px;height:16px;fill:currentColor;}
  .pbtn.main svg{width:18px;height:18px;}
  .pmeta{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:var(--ink-faint);
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pmeta b{color:var(--ink-soft);font-weight:500;}
  .pmeta.err{color:#a4443a;}
  select.sel{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;height:var(--tap);padding:0 8px;cursor:pointer;flex:0 0 auto;
    -webkit-appearance:none;appearance:none;text-align:center;}
  select.sel.voice{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft);
    letter-spacing:.02em;padding:0 10px;width:132px;}
  .spin{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;
    border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ---------- bookmarks ---------- */
  #panel{position:fixed;z-index:50;right:calc(16px + var(--safe-r));top:108px;
    width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 40px rgba(28,27,25,.12);padding:8px;display:none;
    max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch;}
  #panel.open{display:block;}
  .prow{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;}
  .prow:hover{background:var(--accent-soft);}
  .prow .n{font-family:var(--sans);font-size:10px;color:var(--accent);padding-top:3px;min-width:26px;}
  .prow .t{font-size:14px;line-height:1.45;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .prow .x{margin-left:auto;font-family:var(--sans);font-size:17px;color:var(--ink-faint);
    padding:0 6px;line-height:1;}
  .pempty{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);padding:16px 10px;text-align:center;}
  .padd{width:100%;font-family:var(--sans);font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    border:none;border-radius:8px;padding:12px;cursor:pointer;margin-bottom:6px;}
  .phead{font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);padding:12px 12px 5px;}
  .prow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;margin-top:4px;}
  .prow .sw.y{background:#fbeeae;} .prow .sw.g{background:#d8ecd2;}
  .prow .sw.p{background:#f8d9e6;} .prow .sw.b{background:#d5e6f5;}
  .pwarn{font-family:var(--sans);font-size:11.5px;line-height:1.5;color:#8a6230;background:#faf1e2;
    border-radius:8px;padding:10px 12px;margin:6px 0;}
  .pbak{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;width:100%;margin-top:6px;}
  #bak{display:none;padding:4px 2px 2px;}
  #bak.open{display:block;}
  #bak textarea{width:100%;height:88px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.45;color:var(--ink-soft);background:#f7f5f1;border:1px solid var(--line);
    border-radius:8px;padding:9px;resize:vertical;outline:none;-webkit-appearance:none;}
  #bak .brow{display:flex;gap:6px;margin-top:6px;}
  #bak .brow button{flex:1 1 0;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;}
  #bak .brow button:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- article ---------- */
  #app{max-width:var(--col);margin:0 auto;
    padding:56px calc(24px + var(--safe-l)) 40vh calc(24px + var(--safe-r));}
  .kicker{font-size:12px;font-family:var(--sans);color:var(--ink-faint);letter-spacing:.08em;
    text-transform:uppercase;margin:0 0 10px;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,42px);
    line-height:1.18;letter-spacing:-.01em;margin:0 0 46px;}
  p.para{font-size:var(--read);line-height:1.8;margin:0 0 26px;}
  p.para em,.epi em,.note em,.fnote em,blockquote.quote em{font-style:italic;}

  /* ---------- printed-page furniture ---------- */
  .pgbrk{display:flex;align-items:baseline;gap:14px;margin:44px 0 30px;
    border-top:1px solid var(--line);padding-top:9px;}
  .pgbrk.verso{flex-direction:row-reverse;}
  .pgbrk .rh{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pgbrk.verso .rh{text-align:right;}
  .pgbrk .folio{font-family:var(--serif);font-size:13px;color:var(--accent);
    flex:0 0 auto;font-variant-numeric:oldstyle-nums;}
  .pgbrk.first{border-top:none;margin-top:0;padding-top:0;}
  .pgbrk.first .rh{display:none;}

  .epi{margin:0 auto 34px;padding:0 0 0 34px;max-width:88%;
    font-size:calc(var(--read) - 2.5px);line-height:1.72;color:var(--ink-soft);}
  .epi .cite{display:block;margin-top:10px;text-align:right;font-style:italic;
    font-size:calc(var(--read) - 4px);color:var(--ink-faint);}

  .secno{font-family:var(--serif);font-size:calc(var(--read) + 1px);text-align:center;
    letter-spacing:.14em;color:var(--ink-soft);margin:38px 0 26px;}

  .fnote{font-size:calc(var(--read) - 5px);line-height:1.62;color:var(--ink-soft);
    margin:30px 0 26px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;gap:9px;align-items:flex-start;}
  .fnote .mk{flex:0 0 auto;color:var(--accent);}
  .fnote .bd{flex:1 1 auto;min-width:0;}
  blockquote.quote{margin:0 0 26px;padding:2px 0 2px 22px;border-left:2px solid var(--line);
    font-size:calc(var(--read) - 1.5px);line-height:1.74;color:var(--ink-soft);}
  .note{font-size:calc(var(--read) - 4px);line-height:1.7;color:var(--ink-soft);margin:0 0 26px;
    padding:18px 20px;background:#f5f3ef;border-radius:8px;}
  .note::before{content:attr(data-label);display:block;font-family:var(--sans);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
  table.ab{width:100%;border-collapse:collapse;margin:0 0 26px;
    font-size:calc(var(--read) - 3px);line-height:1.62;}
  table.ab th{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:500;text-align:left;padding:0 14px 8px 0;border-bottom:1px solid var(--line);}
  table.ab td{padding:13px 14px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;width:50%;}
  table.ab tr:last-child td{border-bottom:none;}

  /* ---------- reading units ---------- */
  .s{border-radius:3px;transition:background .3s;}
  .s.reading{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);}
  .s.found{background:#e7dcc9;box-shadow:0 0 0 3px #e7dcc9;}
  .w{cursor:default;}
  body.dict .w{cursor:help;}
  body.dict .w:hover,.w.on{background:#e7dcc9;border-radius:3px;box-shadow:0 0 0 2px #e7dcc9;}

  /* ---------- highlighter ---------- */
  mark.hl{background:transparent;color:inherit;border-radius:2px;
    padding:.12em 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  mark.hl.y{background:#fbeeae;}
  mark.hl.g{background:#d8ecd2;}
  mark.hl.p{background:#f8d9e6;}
  mark.hl.b{background:#d5e6f5;}

  /* ---------- selection bar ---------- */
  #selbar{position:fixed;z-index:65;display:none;gap:2px;padding:4px;align-items:center;
    background:var(--ink);border-radius:99px;box-shadow:0 8px 26px rgba(28,27,25,.28);}
  #selbar.open{display:flex;}
  #selbar button{font-family:var(--sans);font-size:12px;color:#f4f1ec;background:transparent;
    border:none;border-radius:99px;padding:9px 14px;cursor:pointer;white-space:nowrap;}
  #selbar button:hover{background:rgba(255,255,255,.14);}
  #selbar .dot{width:22px;height:22px;border-radius:50%;padding:0;margin:0 1px;flex:0 0 auto;
    border:1.5px solid rgba(255,255,255,.28);}
  #selbar .dot:hover{border-color:#fff;transform:scale(1.12);}
  #selbar .dot.y{background:#fbeeae;}
  #selbar .dot.g{background:#d8ecd2;}
  #selbar .dot.p{background:#f8d9e6;}
  #selbar .dot.b{background:#d5e6f5;}
  #selbar .erase{padding:9px 11px;font-size:14px;line-height:1;}
  #selbar .sep{width:1px;background:rgba(255,255,255,.16);margin:6px 1px;}

  /* ---------- explain tooltip ---------- */
  #tip{position:fixed;z-index:60;width:min(360px,calc(100vw - 24px));
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 34px rgba(28,27,25,.14);padding:14px 16px;display:none;font-family:var(--sans);}
  #tip.open{display:block;}
  #tip .hw{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:2px;}
  #tip .infl{font-size:11.5px;color:var(--ink-faint);margin-bottom:9px;}
  #tip .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:11px;}
  #tip .chip{display:inline-block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;}
  #tip .chip.gram{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em;
    text-transform:none;color:var(--ink-soft);background:#f1efeb;}
  #tip .chip.reg{text-transform:none;letter-spacing:.02em;color:#7a5d7a;background:#f2ecf2;}
  #tip .freq{display:inline-flex;gap:3px;align-items:center;margin-left:auto;}
  #tip .freq i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;}
  #tip .freq i.on{background:var(--accent);}
  #tip .sec{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  #tip .sec.first{border-top:none;padding-top:0;margin-top:0;}
  #tip .lbl{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:5px;}
  #tip .en{font-size:14px;line-height:1.55;color:var(--ink);}
  #tip .ex{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink-soft);
    margin-top:8px;padding-left:11px;border-left:2px solid var(--accent-soft);}
  #tip .why{font-size:13.5px;line-height:1.55;color:var(--ink);}
  #tip .load{font-size:12.5px;color:var(--ink-faint);}
  #tip .err{font-size:12.5px;line-height:1.5;color:#a4443a;}
  #tip .acts{display:flex;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  #tip .acts button{font-family:var(--sans);font-size:12px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap;}
  #tip .acts button:hover{border-color:var(--accent);color:var(--accent);}

  noscript{display:block;max-width:var(--col);margin:60px auto;padding:0 24px;
    font-size:16px;line-height:1.7;color:var(--ink-soft);}

  /* ================= TABLET  (iPad portrait & landscape) ================= */
  @media (min-width:768px){
    :root{--read:20px;--tap:38px;}
    .bar{height:60px;}
    #app{padding-top:64px;}
  }
  @media (min-width:1024px){
    :root{--col:760px;--read:20.5px;}
  }
  /* Touch devices: no hover lookup, bigger targets, roomier popovers */
  @media (hover:none),(pointer:coarse){
    :root{--tap:42px;}
    .w{-webkit-tap-highlight-color:transparent;}
    #tip{width:min(400px,calc(100vw - 24px));padding:16px 18px;}
    #tip .acts button{padding:11px 16px;font-size:13px;}
    #selbar button{padding:12px 18px;font-size:13px;}
    .prow{padding:14px 12px;}
    .prow .x{padding:0 10px;font-size:19px;}
    .search input{font-size:16px;}      /* 16px stops iOS from zooming on focus */
    .search input:focus{width:240px;}
  }

  /* ---------- phone ---------- */
  @media (max-width:640px){
    :root{--read:17.5px;}
    .brand{display:none;}
    .bar{padding:0 16px;gap:7px;}
    #player{padding:0 16px 6px;gap:5px;}
    #app{padding:36px 16px 40vh;}
    .search{flex:1 1 auto;}
    .search input{width:100%;}
    .search input:focus{width:100%;}
    select.sel.voice{width:72px;padding:0 6px;}
  }

  /* ---------- API key ---------- */
  .pkey{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:4px 12px 8px;}
  .pkey .t{flex:1 1 100%;font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--ink-soft);}
  .pkey button{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;}
  .pkey button:hover{border-color:var(--accent);color:var(--accent);}
  #keybox{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(28,27,25,.28);padding:16px;}
  #keybox.open{display:flex;}
  .kcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 40px rgba(28,27,25,.18);padding:18px;font-family:var(--sans);margin:0;}
  .khead{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:6px;}
  .khint{font-size:12px;line-height:1.55;color:var(--ink-soft);margin:0 0 12px;}
  #keyInput{width:100%;height:38px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;
    color:var(--ink);background:#f7f5f1;border:1px solid var(--line);border-radius:8px;padding:0 10px;
    outline:none;-webkit-appearance:none;appearance:none;}
  #keyInput:focus{border-color:var(--accent);}
  .kerr{min-height:18px;font-size:11.5px;line-height:1.5;color:#a4443a;margin:6px 0 4px;}
  .kbtns{display:flex;gap:6px;justify-content:flex-end;}
  .kbtns button{font-family:var(--sans);font-size:12px;border-radius:8px;padding:9px 14px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);}
  .kbtns button[type="submit"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);}
</style>
</head>
<body>

<header id="topbar">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <form class="search" id="searchForm">
      <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button type="submit" id="qBtn">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </form>
    <button class="btn" id="dictBtn" data-action="dict" aria-pressed="false"></button>
    <button class="btn icon" data-action="panel" id="bmBtn">
      <svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>
    </button>
  </div>
  <div id="player">
    <button class="pbtn" data-action="prev"><svg viewBox="0 0 24 24"><path d="M7 5h2v14H7zM20 5l-9 7 9 7z"/></svg></button>
    <button class="pbtn main" id="playBtn" data-action="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="pbtn" data-action="next"><svg viewBox="0 0 24 24"><path d="M15 5h2v14h-2zM4 5l9 7-9 7z"/></svg></button>
    <span class="pmeta" id="pmeta"></span>
    <select class="sel" data-action="gran" id="granSel"></select>
    <select class="sel" data-action="model" id="modelSel"></select>
    <select class="sel voice" data-action="voice" id="voiceSel"></select>
  </div>
</header>

<div id="panel"></div>
<div id="selbar">
  <button data-action="sel-explain" id="selExplain"></button>
  <span class="sep"></span>
  <button data-action="sel-play" id="selPlay"></button>
  <span class="sep"></span>
  <button class="dot y" data-action="hl" data-c="y"></button>
  <button class="dot g" data-action="hl" data-c="g"></button>
  <button class="dot p" data-action="hl" data-c="p"></button>

var ARTICLE = {
  id: 'wu-2018-tyranny-of-convenience',
  kicker: 'The New York Times — Opinion · Tim Wu · February 16, 2018',
  title: 'The Tyranny of Convenience',
  blocks: [

{t:'p',x:`Convenience is the most underestimated and least understood force in the world today. As a driver of human decisions, it may not offer the illicit thrill of Freud’s unconscious sexual desires or the mathematical elegance of the economist’s incentives. Convenience is boring. But boring is not the same thing as trivial.`},

{t:'p',x:`In the developed nations of the 21st century, convenience — that is, more efficient and easier ways of doing personal tasks — has emerged as perhaps the most powerful force shaping our individual lives and our economies. This is particularly true in America, where, despite all the paeans to freedom and individuality, one sometimes wonders whether convenience is in fact the supreme value.`},

{t:'p',x:`As Evan Williams, a co-founder of Twitter, recently put it, “Convenience decides everything.” Convenience seems to make our decisions for us, trumping what we like to imagine are our true preferences. (I prefer to brew my coffee, but Starbucks instant is so convenient I hardly ever do what I “prefer.”) Easy is better, easiest is best.`},

{t:'p',x:`Convenience has the ability to make other options unthinkable. Once you have used a washing machine, laundering clothes by hand seems irrational, even if it might be cheaper. After you have experienced streaming television, waiting to see a show at a prescribed hour seems silly, even a little undignified. To resist convenience — not to own a cellphone, not to use Google — has come to require a special kind of dedication that is often taken for eccentricity, if not fanaticism.`},

{t:'p',x:`For all its influence as a shaper of individual decisions, the greater power of convenience may arise from decisions made in aggregate, where it is doing so much to structure the modern economy. Particularly in tech-related industries, the battle for convenience is the battle for industry dominance.`},

{t:'p',x:`Americans say they prize competition, a proliferation of choices, the little guy. Yet our taste for convenience begets more convenience, through a combination of the economics of scale and the power of habit. The easier it is to use Amazon, the more powerful Amazon becomes — and thus the easier it becomes to use Amazon. Convenience and monopoly seem to be natural bedfellows.`},

{t:'p',x:`Given the growth of convenience — as an ideal, as a value, as a way of life — it is worth asking what our fixation with it is doing to us and to our country. I don’t want to suggest that convenience is a force for evil. Making things easier isn’t wicked. On the contrary, it often opens up possibilities that once seemed too onerous to contemplate, and it typically makes life less arduous, especially for those most vulnerable to life’s drudgeries.`},

{t:'p',x:`But we err in presuming convenience is always good, for it has a complex relationship with other ideals that we hold dear. Though understood and promoted as an instrument of liberation, convenience has a dark side. With its promise of smooth, effortless efficiency, it threatens to erase the sort of struggles and challenges that help give meaning to life. Created to free us, it can become a constraint on what we are willing to do, and thus in a subtle way it can enslave us.`},

{t:'p',x:`It would be perverse to embrace inconvenience as a general rule. But when we let convenience decide everything, we surrender too much.`},

{t:'p',x:`Convenience as we now know it is a product of the late 19th and early 20th centuries, when labor-saving devices for the home were invented and marketed. Milestones include the invention of the first “convenience foods,” such as canned pork and beans and Quaker Quick Oats; the first electric clothes-washing machines; cleaning products like Old Dutch scouring powder; and other marvels including the electric vacuum cleaner, instant cake mix and the microwave oven.`},

{t:'p',x:`Convenience was the household version of another late-19th-century idea, industrial efficiency, and its accompanying “scientific management.” It represented the adaptation of the ethos of the factory to domestic life.`},

{t:'p',x:`However mundane it seems now, convenience, the great liberator of humankind from labor, was a utopian ideal. By saving time and eliminating drudgery, it would create the possibility of leisure. And with leisure would come the possibility of devoting time to learning, hobbies or whatever else might really matter to us. Convenience would make available to the general population the kind of freedom for self-cultivation once available only to the aristocracy. In this way convenience would also be the great leveler.`},

{t:'p',x:`This idea — convenience as liberation — could be intoxicating. Its headiest depictions are in the science fiction and futurist imaginings of the mid-20th century. From serious magazines like Popular Mechanics and from goofy entertainments like “The Jetsons” we learned that life in the future would be perfectly convenient. Food would be prepared with the push of a button. Moving sidewalks would do away with the annoyance of walking. Clothes would clean themselves or perhaps self-destruct after a day’s wearing. The end of the struggle for existence could at last be contemplated.`},

{t:'p',x:`The dream of convenience is premised on the nightmare of physical work. But is physical work always a nightmare? Do we really want to be emancipated from all of it? Perhaps our humanity is sometimes expressed in inconvenient actions and time-consuming pursuits. Perhaps this is why, with every advance of convenience, there have always been those who resist it. They resist out of stubbornness, yes (and because they have the luxury to do so), but also because they see a threat to their sense of who they are, to their feeling of control over things that matter to them.`},

{t:'p',x:`By the late 1960s, the first convenience revolution had begun to sputter. The prospect of total convenience no longer seemed like society’s greatest aspiration. Convenience meant conformity. The counterculture was about people’s need to express themselves, to fulfill their individual potential, to live in harmony with nature rather than constantly seeking to overcome its nuisances. Playing the guitar was not convenient. Neither was growing one’s own vegetables or fixing one’s own motorcycle. But such things were seen to have value nevertheless — or rather, as a result. People were looking for individuality again.`},

{t:'p',x:`Perhaps it was inevitable, then, that the second wave of convenience technologies — the period we are living in — would co-opt this ideal. It would conveniencize individuality.`},

{t:'p',x:`You might date the beginning of this period to the advent of the Sony Walkman in 1979. With the Walkman we can see a subtle but fundamental shift in the ideology of convenience. If the first convenience revolution promised to make life and work easier for you, the second promised to make it easier to be you. The new technologies were catalysts of selfhood. They conferred efficiency on self-expression.`},

{t:'p',x:`Consider the man of the early 1980s, strolling down the street with his Walkman and earphones. He is enclosed in an acoustic environment of his choosing. He is enjoying, out in public, the kind of self-expression he once could experience only in his private den. A new technology is making it easier for him to show who he is, if only to himself. He struts around the world, the star of his own movie.`},

{t:'p',x:`So alluring is this vision that it has come to dominate our existence. Most of the powerful and important technologies created over the past few decades deliver convenience in the service of personalization and individuality. Think of the VCR, the playlist, the Facebook page, the Instagram account. This kind of convenience is no longer about saving physical labor — many of us don’t do much of that anyway. It is about minimizing the mental resources, the mental exertion, required to choose among the options that express ourselves. Convenience is one-click, one-stop shopping, the seamless experience of “plug and play.” The ideal is personal preference with no effort.`},

{t:'p',x:`We are willing to pay a premium for convenience, of course — more than we often realize we are willing to pay. During the late 1990s, for example, technologies of music distribution like Napster made it possible to get music online at no cost, and lots of people availed themselves of the option. But though it remains easy to get music free, no one really does it anymore. Why? Because the introduction of the iTunes store in 2003 made buying music even more convenient than illegally downloading it. Convenient beat out free.`},

{t:'p',x:`As task after task becomes easier, the growing expectation of convenience exerts a pressure on everything else to be easy or get left behind. We are spoiled by immediacy and become annoyed by tasks that remain at the old level of effort and time. When you can skip the line and buy concert tickets on your phone, waiting in line to vote in an election is irritating. This is especially true for those who have never had to wait in lines (which may help explain the low rate at which young people vote).`},

{t:'p',x:`The paradoxical truth I’m driving at is that today’s technologies of individualization are technologies of mass individualization. Customization can be surprisingly homogenizing. Everyone, or nearly everyone, is on Facebook: It is the most convenient way to keep track of your friends and family, who in theory should represent what is unique about you and your life. Yet Facebook seems to make us all the same. Its format and conventions strip us of all but the most superficial expressions of individuality, such as which particular photo of a beach or mountain range we select as our background image.`},

{t:'p',x:`I do not want to deny that making things easier can serve us in important ways, giving us many choices (of restaurants, taxi services, open-source encyclopedias) where we used to have only a few or none. But being a person is only partly about having and exercising choices. It is also about how we face up to situations that are thrust upon us, about overcoming worthy challenges and finishing difficult tasks — the struggles that help make us who we are. What happens to human experience when so many obstacles and impediments and requirements and preparations have been removed?`},

{t:'p',x:`Today’s cult of convenience fails to acknowledge that difficulty is a constitutive feature of human experience. Convenience is all destination and no journey. But climbing a mountain is different from taking the tram to the top, even if you end up at the same place. We are becoming people who care mainly or only about outcomes. We are at risk of making most of our life experiences a series of trolley rides.`},

{t:'p',x:`Convenience has to serve something greater than itself, lest it lead only to more convenience. In her 1963 classic, “The Feminine Mystique,” Betty Friedan looked at what household technologies had done for women and concluded that they had just created more demands. “Even with all the new labor-saving appliances,” she wrote, “the modern American housewife probably spends more time on housework than her grandmother.” When things become easier, we can seek to fill our time with more “easy” tasks. At some point, life’s defining struggle becomes the tyranny of tiny chores and petty decisions.`},

{t:'p',x:`An unwelcome consequence of living in a world where everything is “easy” is that the only skill that matters is the ability to multitask. At the extreme, we don’t actually do anything; we only arrange what will be done, which is a flimsy basis for a life.`},

{t:'p',x:`We need to consciously embrace the inconvenient — not always, but more of the time. Nowadays individuality has come to reside in making at least some inconvenient choices. You need not churn your own butter or hunt your own meat, but if you want to be someone, you cannot allow convenience to be the value that transcends all others. Struggle is not always a problem. Sometimes struggle is a solution. It can be the solution to the question of who you are.`},

{t:'p',x:`Embracing inconvenience may sound odd, but we already do it without thinking of it as such. As if to mask the issue, we give other names to our inconvenient choices: We call them hobbies, avocations, callings, passions. These are the noninstrumental activities that help to define us. They reward us with character because they involve an encounter with meaningful resistance — with nature’s laws, with the limits of our own bodies — as in carving wood, melding raw ingredients, fixing a broken appliance, writing code, timing waves or facing the point when the runner’s legs and lungs begin to rebel against him.`},

{t:'p',x:`Such activities take time, but they also give us time back. They expose us to the risk of frustration and failure, but they also can teach us something about the world and our place in it.`},

{t:'p',x:`So let’s reflect on the tyranny of convenience, try more often to resist its stupefying power, and see what happens. We must never forget the joy of doing something slow and something difficult, the satisfaction of not doing what is easiest. The constellation of inconvenient choices may be all that stands between us and a life of total, efficient conformity.`},

{t:'n',x:`Tim Wu is a law professor at Columbia, the author of “The Attention Merchants: The Epic Struggle to Get Inside Our Heads” and a contributing opinion writer.`}

  ]
};

  its.forEach(function(r){ cuts.push(r[0], r[1]); });

             .sort(function(a, b){ return a - b; })
             .filter(function(v, i, a){ return i === 0 || v !== a[i - 1]; });

    for (var j = 0; j < hs.length; j++) if (hs[j].a <= p && hs[j].z >= q) { color = hs[j].c; break; }
    var ital = false;
    for (var k = 0; k < its.length; k++) if (its[k][0] <= p && its[k][1] >= q) { ital = true; break; }
    var piece = bodyHtml(text.slice(p, q));

/* With a key: sent in the x-goog-api-key header, so it never sits in a URL.

  if (mustAskFirst()) return askKey('').then(again);
  var list = MODEL_OK[role] ? [MODEL_OK[role]] : candidates.slice();

    '    verb   → "If you abandon a place or person, you leave them permanently."\n' +
    '    noun   → "A vine is a plant that grows up or over things."\n' +

    '• Keep the wording within the ordinary defining vocabulary — plain, common words only (CEFR A2-B1).\n' +
    '• Write in English only. No other language anywhere in the output.\n\n' +

    '             technical, old-fashioned, disapproval, emphasis. Otherwise empty.\n' +
    'general    — For a word or phrase: the full-sentence COBUILD definition of the sense used here.\n' +
    '             For a clause or sentence: a plain-English paraphrase of the whole thing.\n' +
    '             Max 35 words.\n' +
    'example    — One natural sentence of your own showing typical everyday usage, in the style of a\n' +
    '             corpus citation. It must NOT be copied from the passage above. Empty for a sentence.\n' +

    contents:[{ parts:[{ text: prompt }] }],

function pcmToWav(pcm, rate){
  var len = pcm.length, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
  function s(o, str){ for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
  s(0,'RIFF');  v.setUint32(4, 36 + len, true);  s(8,'WAVE');
  s(12,'fmt '); v.setUint32(16, 16, true);       v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);                      v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true);               v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);                     s(36,'data');
  v.setUint32(40, len, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type:'audio/wav' });
}
function fetchAudio(text){
  var voice = state.voice, key = state.ttsModel + '|' + voice + '|' + text;
  if (audioCache.has(key)) return audioCache.get(key);
  var p = callModel('tts-' + state.ttsModel, TTS_MODELS[state.ttsModel], function(model){
    var legacy = /preview/.test(model);
    return {
      contents:[{ parts:[ legacy ? { text: TTS_STYLE_LEGACY + text }
                                 : { text: text, speech_metadata:{ style: TTS_STYLE } } ] }],
      generationConfig:{
        responseModalities:['AUDIO'],
        speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName: voice } } }
      }
    };
  }).then(function(json){
    var part;
    try { part = json.candidates[0].content.parts[0].inlineData; } catch (e) { part = null; }
    if (!part || !part.data) throw new Error('No audio returned');
    /* 3.8+ returns a complete WAV (RIFF header); older models return raw PCM. */
    var bytes = b64ToBytes(part.data);
    var isWav = /wav/i.test(part.mimeType || '') ||
                (bytes.length > 4 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46);
    var rm = /rate=(\d+)/.exec(part.mimeType || '');
    var blob = isWav ? new Blob([bytes], { type:'audio/wav' })
                     : pcmToWav(bytes, rm ? parseInt(rm[1], 10) : 24000);
    return URL.createObjectURL(blob);
  }).catch(function(err){ audioCache.delete(key); throw err; });
  audioCache.set(key, p);
  return p;
}

/* ---------------- playback ---------------- */
function scrollToUnit(u){
  var el = appEl.querySelector('.s[data-b="' + u.b + '"][data-s="' + u.s0 + '"]');
  if (!el) return;
  var r = el.getBoundingClientRect();
  if (r.top < 130 || r.bottom > window.innerHeight - 40) {
    window.scrollTo({ top: window.scrollY + r.top - 180, behavior:'smooth' });
  }
}
function fail(err){
  state.status = 'error'; state.playing = false;
  state.message = String(err && err.message ? err.message : err).slice(0, 90);
  paintPlayer();
}
function playUnit(i){
  if (i < 0) i = 0;
  if (i >= UNITS.length) { audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer(); return; }
  state.mode = 'article'; state.unit = i; state.status = 'loading'; state.playing = true;
  paintPlayer(); paintHighlight();
  fetchAudio(UNITS[i].text).then(function(url){
    if (state.unit !== i || state.mode !== 'article' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){
      state.status = 'playing'; paintPlayer(); scrollToUnit(UNITS[i]);
      if (i + 1 < UNITS.length) fetchAudio(UNITS[i + 1].text).catch(function(){});
    });
  }).catch(fail);
}
function speak(text){
  text = cleanTts(text).slice(0, SEL_MAX);
  if (!text) return;
  audioEl.pause();
  state.mode = 'sel'; state.playing = true; state.status = 'loading';
  paintPlayer(); paintHighlight();
  fetchAudio(text).then(function(url){
    if (state.mode !== 'sel' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); });
  }).catch(fail);
}
function togglePlay(){
  if (state.playing) { audioEl.pause(); state.playing = false; state.status = 'paused'; paintPlayer(); return; }
  if (audioEl.src && audioEl.currentTime > 0 && !audioEl.ended) {
    state.playing = true;
    audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); })
                  .catch(function(){ state.playing = false; state.status = 'ready'; paintPlayer(); });
    return;
  }
  playUnit(state.unit < 0 ? 0 : state.unit);
}
audioEl.addEventListener('ended', function(){
  if (!state.playing) return;
  if (state.mode === 'sel') { state.playing = false; state.mode = 'article'; state.status = 'ready'; paintPlayer(); paintHighlight(); }
  else playUnit(state.unit + 1);
});

/* ---------------- popovers ---------------- */
function place(el, rect){
  el.style.left = '0px'; el.style.top = '0px';
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  var top  = rect.top - h - 12;
  if (top < 112) top = rect.bottom + 12;
  if (top + h > window.innerHeight - 8) top = Math.max(112, window.innerHeight - h - 8);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function hideSelbar(){ selbar.classList.remove('open'); }
function hideTip(){
  tipEl.classList.remove('open'); state.tip = null;
  if (activeWord) { activeWord.classList.remove('on'); activeWord = null; }
}
function findBlockOf(term){
  var t = term.toLowerCase();
  for (var i = 0; i < ARTICLE.blocks.length; i++) {
    if (blockText(i).toLowerCase().indexOf(t) > -1) return i;
  }
  return -1;
}
function actsHtml(hasFind){
  return '<div class="acts"><button data-action="tip-play">' + esc(UI.listen) + '</button>' +
    (hasFind ? '<button data-action="tip-find">' + esc(UI.findInText) + '</button>' : '') + '</div>';
}
function freqHtml(n){
  if (!n) return '';
  var out = '<span class="freq" title="' + esc(UI.freqLabel) + '">';
  for (var i = 1; i <= 5; i++) out += '<i' + (i <= n ? ' class="on"' : '') + '></i>';
  return out + '</span>';
}

/* headword → inflection → tags → ① dictionary meaning (+ usage example)
   → ② meaning in this passage → actions */
function entryHtml(head, d, hasFind){
  var isLong = d.type === 'clause' || d.type === 'sentence';
  var title  = (!isLong && d.headword) ? d.headword : head;

  var tags = '';
  if (d.type)     tags += '<span class="chip">' + esc(d.type) + '</span>';
  if (d.grammar)  tags += '<span class="chip gram">' + esc(d.grammar) + '</span>';
  if (d.register) tags += '<span class="chip reg">' + esc(d.register) + '</span>';
  tags += freqHtml(d.frequency);

  var h = '<div class="hw">' + esc(title) + '</div>';
  if (!isLong && d.headword && d.headword.toLowerCase() !== head.toLowerCase()) {
    h += '<div class="infl">' + esc(head) + (d.inflection ? ' · ' + esc(d.inflection) : '') + '</div>';
  } else if (d.inflection) {
    h += '<div class="infl">' + esc(d.inflection) + '</div>';
  }
  if (tags) h += '<div class="tags">' + tags + '</div>';

  if (d.general) {
    h += '<div class="sec first"><div class="lbl">' +
         esc(isLong ? UI.dictParaphrase : UI.dictGeneral) + '</div>' +
         '<div class="en">' + esc(d.general) + '</div>' +
         (d.example ? '<div class="ex">' + esc(d.example) + '</div>' : '') + '</div>';
  }
  if (d.contextual) {
    h += '<div class="sec' + (d.general ? '' : ' first') + '"><div class="lbl">' +
         esc(UI.dictContextual) + '</div><div class="why">' + esc(d.contextual) + '</div></div>';
  }
  return h + actsHtml(hasFind);
}

function showTip(target, context, rect, anchorEl){
  if (activeWord && activeWord !== anchorEl) activeWord.classList.remove('on');
  activeWord = anchorEl || null;
  if (activeWord) activeWord.classList.add('on');

  var hit = findBlockOf(target);
  state.tip = { text:target, block:hit, rect:rect };
  anchorY = window.scrollY;

  var head = target.length > 90 ? target.slice(0, 90) + '…' : target;
  tipEl.classList.add('open');
  tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="load">' + esc(UI.explaining) + '</div>';
  place(tipEl, rect);

  /* Prefer the block the reader actually touched. `hit` is only the FIRST
     occurrence in the text, so it is a fallback for search-box lookups. */
  var ctx = context || (hit > -1 ? blockText(hit) : '');

  explain(target, ctx).then(function(d){
    if (!tipEl.classList.contains('open') || !state.tip || state.tip.text !== target) return;
    tipEl.innerHTML = entryHtml(head, d, hit > -1);
    place(tipEl, rect);
  }).catch(function(err){
    if (!tipEl.classList.contains('open') || !state.tip || state.tip.text !== target) return;
    tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="err">' +
      esc(String(err.message || err).slice(0, 140)) + '</div>' + actsHtml(hit > -1);
    place(tipEl, rect);
  });
}
function flashFind(bi, term){
  var t = term.toLowerCase(), target = null;
  var spans = appEl.querySelectorAll('.s[data-b="' + bi + '"]');
  for (var i = 0; i < spans.length; i++) {
    if (spans[i].textContent.toLowerCase().indexOf(t) > -1) { target = spans[i]; break; }
  }
  if (!target) target = spans[0];
  if (!target) return;
  window.scrollTo({ top: window.scrollY + target.getBoundingClientRect().top - 170, behavior:'smooth' });
  clearTimeout(foundTimer);
  var old = appEl.querySelectorAll('.s.found');
  for (var j = 0; j < old.length; j++) old[j].classList.remove('found');
  target.classList.add('found');
  foundTimer = setTimeout(function(){ target.classList.remove('found'); }, 2200);
}
function evalSelection(){
  var sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelbar(); return; }
  var text = sel.toString().replace(/\s+/g, ' ').trim();
  if (!text) { hideSelbar(); return; }
  var node = sel.anchorNode, el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
  if (!el || !appEl.contains(el)) { hideSelbar(); return; }
  var blk = el.closest ? el.closest('.blk') : null;
  state.sel = { text:text, ctx: blk ? blockText(Number(blk.getAttribute('data-b'))) : '' };
  hideTip();
  anchorY = window.scrollY;
  document.getElementById('selErase').style.display = selectionHasHighlight() ? '' : 'none';
  selbar.classList.add('open');
  place(selbar, sel.getRangeAt(0).getBoundingClientRect());
}

/* ---------------- bookmarks ---------------- */
function topVisibleBlock(){
  var els = appEl.querySelectorAll('.blk');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getBoundingClientRect().bottom > 140) return Number(els[i].getAttribute('data-b'));
  }
  return 0;
}
function addBookmark(){
  var bi = (state.mode === 'article' && state.playing && state.unit >= 0) ? UNITS[state.unit].b : topVisibleBlock();
  if (state.bookmarks.indexOf(bi) === -1) {
    state.bookmarks.push(bi);
    state.bookmarks.sort(function(a, b){ return a - b; });
    saveAll();
  }
  paintPanel();
}
function jumpToBlock(bi){
  var el = appEl.querySelector('.blk[data-b="' + bi + '"]');
  if (el) window.scrollTo({ top: window.scrollY + el.getBoundingClientRect().top - 140, behavior:'smooth' });
}

/* ---------------- events (delegated once) ---------------- */
selbar.addEventListener('mousedown', function(ev){ ev.preventDefault(); }, false);
tipEl.addEventListener('mousedown', function(ev){ ev.preventDefault(); }, false);

document.getElementById('searchForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var term = (qEl.value || '').replace(/\s+/g, ' ').trim();
  if (!term) return;
  hideSelbar(); qEl.blur();
  showTip(term, '', qEl.getBoundingClientRect(), null);
}, false);

document.getElementById('keyForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  submitKey();
}, false);

document.addEventListener('click', function(ev){
  var t = ev.target, act = t.closest ? t.closest('[data-action]') : null;

  if (!act) {
    var w = t.closest ? t.closest('.w') : null;
    if (w && state.dict && appEl.contains(w)) {
      var blk = w.closest('.blk');
      showTip(w.getAttribute('data-w'), blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
              w.getBoundingClientRect(), w);
      return;
    }
    if (!tipEl.contains(t)) hideTip();
    if (!panelEl.contains(t)) { state.panelOpen = false; paintPanel(); }
    return;
  }

  var a = act.getAttribute('data-action');
  if (a === 'dict') {
    state.dict = !state.dict;
    dictEl.setAttribute('aria-pressed', state.dict ? 'true' : 'false');
    document.body.classList.toggle('dict', state.dict);
    hideTip(); renderArticle();
  }
  else if (a === 'panel')  { state.panelOpen = !state.panelOpen; paintPanel(); }
  else if (a === 'key-open')   { state.panelOpen = false; paintPanel(); openKeyBox(''); }
  else if (a === 'key-forget') { forgetKey(); }
  else if (a === 'key-cancel') { cancelKey(); }
  else if (a === 'bm-add') { addBookmark(); }
  else if (a === 'bm-del') {
    ev.stopPropagation();
    var di = Number(act.getAttribute('data-i'));
    state.bookmarks = state.bookmarks.filter(function(x){ return x !== di; });
    saveAll(); paintPanel();
  }
  else if (a === 'bm-go') {
    jumpToBlock(Number(act.getAttribute('data-i')));
    state.panelOpen = false; paintPanel();
  }
  else if (a === 'hl')       { highlightSelection(act.getAttribute('data-c')); }
  else if (a === 'hl-erase') { highlightSelection(null); }
  else if (a === 'hl-del') {
    ev.stopPropagation();
    state.highlights.splice(Number(act.getAttribute('data-i')), 1);
    saveAll(); renderArticle(); paintPanel();
  }
  else if (a === 'hl-go') {
    var hx = state.highlights[Number(act.getAttribute('data-i'))];
    if (hx) { state.panelOpen = false; paintPanel(); jumpToBlock(hx.b); }
  }
  else if (a === 'bak')      { state.bakOpen = !state.bakOpen; paintPanel(); }
  else if (a === 'bak-copy') {
    var box = document.getElementById('bakBox');
    box.value = exportText(); box.select(); box.setSelectionRange(0, box.value.length);
    var done = function(){ act.textContent = UI.copied; setTimeout(function(){ act.textContent = UI.copy; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(done, function(){ try { document.execCommand('copy'); done(); } catch (e) {} });
    } else { try { document.execCommand('copy'); done(); } catch (e) {} }
  }
  else if (a === 'bak-restore') {
    var ok = importText(document.getElementById('bakBox').value);
    act.textContent = ok ? UI.restored : UI.badBackup;
    if (ok) { renderArticle(); state.bakOpen = true; setTimeout(paintPanel, 900); }
    else setTimeout(function(){ act.textContent = UI.restore; }, 2000);
  }
  else if (a === 'play') togglePlay();
  else if (a === 'prev') playUnit(state.unit <= 0 ? 0 : state.unit - 1);
  else if (a === 'next') playUnit(state.unit + 1);
  else if (a === 'sel-explain') {
    if (!state.sel) return;
    var r = selbar.getBoundingClientRect(); hideSelbar();
    showTip(state.sel.text, state.sel.ctx, r, null);
  }
  else if (a === 'sel-play')  { hideSelbar(); if (state.sel) speak(state.sel.text); }
  else if (a === 'tip-play')  { if (state.tip) speak(state.tip.text); }
  else if (a === 'tip-find')  {
    if (state.tip && state.tip.block > -1) { var tt = state.tip; hideTip(); flashFind(tt.block, tt.text); }
  }
}, false);

document.addEventListener('change', function(ev){
  var act = ev.target.closest ? ev.target.closest('[data-action]') : null;
  if (!act) return;
  var a = act.getAttribute('data-action');
  if (a === 'voice') {
    if (!isVoice(act.value)) return;
    state.voice = act.value; saveVoice();
    audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer();
  } else if (a === 'model') {
    state.ttsModel = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer();
  } else if (a === 'gran') {
    var at = (state.unit >= 0 && UNITS[state.unit]) ? UNITS[state.unit].b : -1;
    state.gran = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready';
    buildUnits(); state.unit = -1;
    if (at >= 0) for (var i = 0; i < UNITS.length; i++) if (UNITS[i].b === at) { state.unit = i; break; }
    paintPlayer(); paintHighlight();
  }
}, false);

appEl.addEventListener('mouseover', function(ev){
  if (!state.dict || !CAN_HOVER) return;
  var el = ev.target.closest ? ev.target.closest('.w') : null;
  if (!el) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(function(){
    var s = window.getSelection ? window.getSelection() : null;
    if (s && !s.isCollapsed) return;
    var blk = el.closest('.blk');
    showTip(el.getAttribute('data-w'), blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
            el.getBoundingClientRect(), el);
  }, 340);
}, false);
appEl.addEventListener('mouseout', function(){ clearTimeout(hoverTimer); }, false);

document.addEventListener('selectionchange', function(){
  clearTimeout(selTimer);
  selTimer = setTimeout(evalSelection, 280);
}, false);

document.addEventListener('keydown', function(ev){
  if (keyBoxEl.classList.contains('open')) {
    if (ev.key === 'Escape') cancelKey();
    return;
  }
  if (ev.target && ev.target.id === 'q') {
    if (ev.key === 'Escape') { ev.target.value = ''; ev.target.blur(); hideTip(); }
    return;
  }
  if (ev.key === 'Escape') { hideTip(); hideSelbar(); state.panelOpen = false; paintPanel(); }
}, false);

/* Popovers survive the small scroll a touch drag causes. */
window.addEventListener('scroll', function(){
  if (Math.abs(window.scrollY - anchorY) < SCROLL_TOL) return;
  if (tipEl.classList.contains('open')) hideTip();
  if (selbar.classList.contains('open')) hideSelbar();
}, { passive:true });

window.addEventListener('resize', function(){ hideTip(); hideSelbar(); }, { passive:true });

/* ---------------- boot ---------------- */
function applyStrings(){
  document.title = ARTICLE.title;
  document.getElementById('brand').textContent = ARTICLE.kicker + ' · ' + ARTICLE.title;
  qEl.placeholder = UI.searchPlaceholder;
  document.getElementById('qBtn').setAttribute('aria-label', UI.searchLabel);
  dictEl.textContent = UI.dictionary;
  dictEl.title = UI.dictionaryHint;
  document.getElementById('bmBtn').setAttribute('aria-label', UI.bookmarks);
  document.getElementById('bmBtn').title = UI.bookmarks;
  document.querySelector('[data-action="prev"]').title = UI.prev;
  document.querySelector('[data-action="next"]').title = UI.next;
  document.getElementById('selExplain').textContent = UI.explain;
  document.getElementById('selPlay').textContent = UI.listen;
  document.getElementById('selErase').title = UI.eraseHighlight;
  var dots = selbar.querySelectorAll('[data-action="hl"]');
  for (var i = 0; i < dots.length; i++) dots[i].title = UI.highlight;
  var vs = document.getElementById('voiceSel');
  vs.title = UI.voiceLabel; vs.setAttribute('aria-label', UI.voiceLabel);
  vs.innerHTML = VOICES.map(function(x){
    return '<option value="' + esc(x[0]) + '">' + esc(x[0] + ' — ' + x[1]) + '</option>';
  }).join('');
  document.getElementById('ns').textContent = UI.noscript;
  document.getElementById('keyTitle').textContent = UI.keyTitle;
  document.getElementById('keyHint').textContent = UI.keyHint;
  document.getElementById('keyCancel').textContent = UI.keyCancel;
  document.getElementById('keyOk').textContent = UI.keyUse;
  keyInEl.placeholder = UI.keyPlaceholder;
  document.getElementById('granSel').innerHTML =
    '<option value="sent">' + esc(UI.unitSentence) + '</option><option value="para">' + esc(UI.unitParagraph) + '</option>';
  document.getElementById('modelSel').innerHTML =
    '<option value="flash">' + esc(UI.modelFlash) + '</option><option value="pro">' + esc(UI.modelPro) + '</option>';
}

applyStrings();
buildSents();          /* DISP must exist before saved marks are validated */
buildUnits();
STORAGE_OK = probeStorage();
loadAll();
loadVoice();
document.getElementById('voiceSel').value = state.voice;
sortHighlights();
renderArticle();
paintPlayer();
paintPanel();

})();
</script>
