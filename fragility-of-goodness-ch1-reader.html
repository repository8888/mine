/* ============================================================
   4. TEXT HELPERS
   ============================================================ */
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

var WORD_RE = /[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ'’\-]*/g;

function wordize(text){
  var out = '', last = 0, m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    out += '<span class="w" data-w="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function body(text){ return state.dict ? wordize(text) : esc(text); }

var ABBR_RE = /(?:^|[\s(])(?:cf|i\.e|e\.g|etc|Ch|Chs|n|no|nos|vs|Mr|Mrs|Ms|Dr|St|p|pp|esp|Prof|viz|al|ed|eds|trans|fig|vol)\.$/i;

function splitSentences(text){
  var out = [], start = 0, i, j, k;
  for (i = 0; i < text.length; i++) {
    var c = text.charAt(i);
    if (c !== '.' && c !== '!' && c !== '?') continue;
    j = i + 1;
    while (j < text.length && '.!?)]"\'’”'.indexOf(text.charAt(j)) > -1) j++;
    if (j >= text.length) break;
    k = j;
    while (k < text.length && /\s/.test(text.charAt(k))) k++;
    if (k === j) continue;                                   /* no space -> not a boundary */
    if (!/[A-Z"'(“‘]/.test(text.charAt(k))) continue;         /* next unit must start big */
    var cand = text.slice(start, j);
    if (ABBR_RE.test(cand)) continue;                        /* cf. / Ch. / i.e. ... */
    if (cand.trim()) out.push(cand.trim());
    start = k; i = k - 1;
  }
  var tail = text.slice(start).trim();
  if (tail) out.push(tail);
  return out.length ? out : [text];
}

function buildSents(){
  SENTS = ARTICLE.blocks.map(function(b){
    if (b.t === 't') {
      var a = [];
      b.rows.forEach(function(r){ a.push('Column A. ' + r[0] + '.'); a.push('Column B. ' + r[1] + '.'); });
      return a;
    }
    return splitSentences(b.x);
  });
}

function blockText(bi){
  var b = ARTICLE.blocks[bi];
  if (!b) return '';
  return b.t === 't' ? SENTS[bi].join(' ') : b.x;
}

function cleanTts(s){ return s.replace(/[²³¹⁰-₟]/g, '').replace(/\s+/g, ' ').trim(); }

function buildUnits(){
  UNITS = [];
  SENTS.forEach(function(sents, bi){
    if (state.gran === 'sent') {
      sents.forEach(function(s, si){ UNITS.push({ b:bi, s0:si, s1:si, text: cleanTts(s) }); });
    } else {
      var s0 = 0, buf = '';
      sents.forEach(function(s, si){
        if (buf && (buf + ' ' + s).length > PARA_MAX) {
          UNITS.push({ b:bi, s0:s0, s1:si - 1, text: cleanTts(buf) });
          s0 = si; buf = s;
        } else { buf = buf ? buf + ' ' + s : s; }
      });
      if (buf) UNITS.push({ b:bi, s0:s0, s1:sents.length - 1, text: cleanTts(buf) });
    }
  });
}

/* ============================================================
   5. RENDER
   ============================================================ */
function sentSpan(bi, si, display){
  return '<span class="s" data-b="' + bi + '" data-s="' + si + '">' + body(display) + '</span>';
}

function renderArticle(){
  var h = '<p class="title">' + esc(ARTICLE.kicker) + '</p><h1>' + esc(ARTICLE.title) + '</h1>';
  ARTICLE.blocks.forEach(function(b, bi){
    var inner;
    if (b.t === 't') {
      inner = '<table class="ab"><thead><tr><th>A</th><th>B</th></tr></thead><tbody>' +
        b.rows.map(function(r, ri){
          return '<tr><td>' + sentSpan(bi, ri * 2, r[0]) + '</td><td>' + sentSpan(bi, ri * 2 + 1, r[1]) + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      var inside = SENTS[bi].map(function(s, si){ return sentSpan(bi, si, s); }).join(' ');
      if (b.t === 'p')      inner = '<p class="para">' + inside + '</p>';
      else if (b.t === 'q') inner = '<blockquote class="quote">' + inside + '</blockquote>';
      else                  inner = '<div class="note">' + inside + '</div>';
    }
    h += '<div class="blk" data-b="' + bi + '">' + inner + '</div>';
  });
  appEl.innerHTML = h;
  paintHighlight();
}

function paintHighlight(){
  var prev = appEl.querySelectorAll('.s.reading');
  for (var i = 0; i < prev.length; i++) prev[i].classList.remove('reading');
  if (state.mode !== 'article' || state.unit < 0 || state.unit >= UNITS.length) return;
  var u = UNITS[state.unit];
  for (var si = u.s0; si <= u.s1; si++) {
    var el = appEl.querySelector('.s[data-b="' + u.b + '"][data-s="' + si + '"]');
    if (el) el.classList.add('reading');
  }
}

var ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function paintPlayer(){
  playEl.innerHTML = state.playing ? ICON_PAUSE : ICON_PLAY;
  playEl.title = state.playing ? 'Pause' : 'Play';
  metaEl.classList.toggle('err', state.status === 'error');
  var pos = state.unit >= 0 ? (state.unit + 1) + ' / ' + UNITS.length : '— / ' + UNITS.length;
  var where = state.mode === 'sel' ? 'Selection' : pos;
  if (state.status === 'loading')      metaEl.innerHTML = '<span class="spin"></span>Synthesizing · <b>' + esc(where) + '</b>';
  else if (state.status === 'error')   metaEl.textContent = state.message;
  else if (state.status === 'playing') metaEl.innerHTML = 'Narrating · <b>' + esc(where) + '</b>';
  else if (state.status === 'paused')  metaEl.innerHTML = 'Paused · <b>' + esc(where) + '</b>';
  else                                 metaEl.innerHTML = 'Aoede — ready · <b>' + esc(pos) + '</b>';
}

function paintPanel(){
  panelEl.classList.toggle('open', state.panelOpen);
  if (!state.panelOpen) return;
  var h = '<button class="padd" data-action="bm-add">Bookmark current position</button>';
  if (!state.bookmarks.length) h += '<div class="pempty">No bookmarks yet.</div>';
  else h += state.bookmarks.map(function(bi){
    return '<div class="prow" data-action="bm-go" data-i="' + bi + '">' +
           '<span class="n">' + (bi + 1) + '</span>' +
           '<span class="t">' + esc(blockText(bi).slice(0, 110)) + '…</span>' +
           '<span class="x" data-action="bm-del" data-i="' + bi + '">×</span></div>';
  }).join('');
  panelEl.innerHTML = h;
}

/* ============================================================
   6. GEMINI CALLS
   ============================================================ */
function callApi(model, payload){
  var url = API_ROOT + model + ':generateContent?key=' + API_KEY;
  var tries = 0;
  function attempt(){
    tries++;
    return fetch(url, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
    }).catch(function(e){
      /* fetch() rejects only on network-level failure: no response at all. */
      throw new Error('Network blocked (' + (e && e.message ? e.message : 'fetch failed') +
        '). Run this page inside Gemini Canvas, or set API_KEY at the top of the script.');
    }).then(function(res){
      if ((res.status === 429 || res.status >= 500) && tries < 4) {
        return new Promise(function(r){ setTimeout(r, Math.pow(2, tries) * 400); }).then(attempt);
      }
      if (!res.ok) {
        return res.text().then(function(t){ throw new Error('API ' + res.status + (t ? ' · ' + t.slice(0, 110) : '')); });
      }
      return res.json();
    });
  }
  return attempt();
}

/* ---- AI context dictionary: word / phrase / clause / sentence ---- */
function explain(target, context){
  var key = target.toLowerCase();
  if (explainCache.has(key)) return explainCache.get(key);

  var prompt =
    'You help an intermediate English learner read a difficult academic book.\n' +
    'Write ONLY in simple English that a middle-school student can read (about CEFR A2-B1).\n' +
    'Never use Korean. Never use hard or academic words in your answer. Short words, short sentences.\n\n' +
    'SELECTED TEXT:\n"""' + target.slice(0, 1200) + '"""\n\n' +
    (context ? 'IT COMES FROM THIS PASSAGE:\n"""' + context.slice(0, 1400) + '"""\n\n'
             : 'There is no surrounding passage. Explain its common meaning.\n\n') +
    'Decide if the selected text is a WORD, a PHRASE, a CLAUSE, or a SENTENCE.\n' +
    'Then answer in exactly three lines, nothing else:\n' +
    'TYPE: word | phrase | clause | sentence\n' +
    'PLAIN: <say the same thing in easy English. For a word, give an easy definition that fits this passage. Max 25 words.>\n' +
    'WHY: <one easy sentence: how it is used here, or what the writer is really saying. Max 25 words.>';

  var p = callApi(TEXT_MODEL, {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig:{ temperature:0.2, maxOutputTokens:300 }
  }).then(function(json){
    var t = '';
    try { t = json.candidates[0].content.parts.map(function(pt){ return pt.text || ''; }).join(''); } catch (e) { t = ''; }
    var out = { type:'', plain:'', why:'' };
    t.split('\n').forEach(function(line){
      var s = line.trim();
      if (/^TYPE\s*:/i.test(s))       out.type  = s.replace(/^TYPE\s*:/i, '').trim();
      else if (/^PLAIN\s*:/i.test(s)) out.plain = s.replace(/^PLAIN\s*:/i, '').trim();
      else if (/^WHY\s*:/i.test(s))   out.why   = s.replace(/^WHY\s*:/i, '').trim();
    });
    if (!out.plain && !out.why) out.plain = t.trim() || 'No explanation returned.';
    return out;
  }).catch(function(err){ explainCache.delete(key); throw err; });

  explainCache.set(key, p);
  return p;
}

function b64ToBytes(b64){
  var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
  for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function pcmToWav(pcm, rate){
  var len = pcm.length, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
  function s(o, str){ for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
  s(0,'RIFF');  v.setUint32(4, 36 + len, true);  s(8,'WAVE');
  s(12,'fmt '); v.setUint32(16, 16, true);       v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);                      v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true);               v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);                     s(36,'data');
  v.setUint32(40, len, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type:'audio/wav' });
}

function fetchAudio(text){
  var key = state.ttsModel + '|' + text;
  if (audioCache.has(key)) return audioCache.get(key);
  var p = callApi(TTS_MODELS[state.ttsModel], {
    contents:[{ parts:[{ text: TTS_STYLE + text }] }],
    generationConfig:{
      responseModalities:['AUDIO'],
      speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName: VOICE } } }
    }
  }).then(function(json){
    var part;
    try { part = json.candidates[0].content.parts[0].inlineData; } catch (e) { part = null; }
    if (!part || !part.data) throw new Error('No audio returned');
    var rm = /rate=(\d+)/.exec(part.mimeType || '');
    return URL.createObjectURL(pcmToWav(b64ToBytes(part.data), rm ? parseInt(rm[1], 10) : 24000));
  }).catch(function(err){ audioCache.delete(key); throw err; });
  audioCache.set(key, p);
  return p;
}

/* ============================================================
   7. PLAYBACK
   ============================================================ */
function scrollToUnit(u){
  var el = appEl.querySelector('.s[data-b="' + u.b + '"][data-s="' + u.s0 + '"]');
  if (!el) return;
  var r = el.getBoundingClientRect();
  if (r.top < 120 || r.bottom > window.innerHeight - 40) {
    window.scrollTo({ top: window.scrollY + r.top - 170, behavior:'smooth' });
  }
}

function fail(err){
  state.status = 'error';
  state.playing = false;
  state.message = String(err && err.message ? err.message : err).slice(0, 90);
  paintPlayer();
}

function playUnit(i){
  if (i < 0) i = 0;
  if (i >= UNITS.length) { audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer(); return; }
  state.mode = 'article';
  state.unit = i;
  state.status = 'loading';
  state.playing = true;
  paintPlayer(); paintHighlight();

  fetchAudio(UNITS[i].text).then(function(url){
    if (state.unit !== i || state.mode !== 'article' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){
      state.status = 'playing'; paintPlayer();
      scrollToUnit(UNITS[i]);
      if (i + 1 < UNITS.length) fetchAudio(UNITS[i + 1].text).catch(function(){});
    });
  }).catch(fail);
}

function playSelection(){
  if (!state.sel) return;
  var text = cleanTts(state.sel.text).slice(0, SEL_MAX);
  if (!text) return;
  audioEl.pause();
  state.mode = 'sel';
  state.playing = true;
  state.status = 'loading';
  paintPlayer(); paintHighlight();
  fetchAudio(text).then(function(url){
    if (state.mode !== 'sel' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); });
  }).catch(fail);
}

function togglePlay(){
  if (state.playing) {
    audioEl.pause(); state.playing = false; state.status = 'paused'; paintPlayer(); return;
  }
  if (audioEl.src && audioEl.currentTime > 0 && !audioEl.ended) {
    state.playing = true;
    audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); })
                  .catch(function(){ state.playing = false; state.status = 'ready'; paintPlayer(); });
    return;
  }
  playUnit(state.unit < 0 ? 0 : state.unit);
}

audioEl.addEventListener('ended', function(){
  if (!state.playing) return;
  if (state.mode === 'sel') {
    state.playing = false; state.mode = 'article'; state.status = 'ready';
    paintPlayer(); paintHighlight();
  } else {
    playUnit(state.unit + 1);
  }
});

/* ============================================================
   8. SELECTION BAR + EXPLAIN TOOLTIP
   ============================================================ */
function place(el, rect){
  el.style.left = '0px'; el.style.top = '0px';
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  var top  = rect.top - h - 10;
  if (top < 104) top = rect.bottom + 10;
  if (top + h > window.innerHeight - 8) top = Math.max(104, window.innerHeight - h - 8);
  el.style.left = left + 'px';
  el.style.top  = top + 'px';
}

function hideSelbar(){ selbar.classList.remove('open'); }

function hideTip(){
  tipEl.classList.remove('open');
  if (activeWord) { activeWord.classList.remove('on'); activeWord = null; }
}

function showTip(target, context, rect, anchorEl){
  if (activeWord && activeWord !== anchorEl) activeWord.classList.remove('on');
  activeWord = anchorEl || null;
  if (activeWord) activeWord.classList.add('on');

  var head = target.length > 90 ? target.slice(0, 90) + '…' : target;
  tipEl.classList.add('open');
  tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="load">explaining…</div>';
  place(tipEl, rect);

  var token = target;
  explain(target, context).then(function(d){
    if (!tipEl.classList.contains('open')) return;
    tipEl.innerHTML =
      '<div class="hw">' + esc(head) + '</div>' +
      (d.type  ? '<div class="chip">' + esc(d.type) + '</div>' : '') +
      (d.plain ? '<div class="en">'   + esc(d.plain) + '</div>' : '') +
      (d.why   ? '<div class="why">'  + esc(d.why)   + '</div>' : '');
    place(tipEl, rect);
  }).catch(function(err){
    if (!tipEl.classList.contains('open')) return;
    tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="load">' +
      esc(String(err.message || err).slice(0, 80)) + '</div>';
  });
  return token;
}

/* Search box: find the first block that contains the term, so the
   explanation is grounded in how this book actually uses it. */
function findContext(term){
  var t = term.toLowerCase();
  for (var i = 0; i < ARTICLE.blocks.length; i++) {
    var bt = blockText(i);
    if (bt.toLowerCase().indexOf(t) > -1) return bt;
  }
  return '';
}

function runSearch(){
  var input = document.getElementById('q');
  var term = (input.value || '').replace(/\s+/g, ' ').trim();
  if (!term) return;
  hideSelbar();
  input.blur();
  showTip(term, findContext(term), input.getBoundingClientRect(), null);
}

function evalSelection(){
  var sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelbar(); return; }
  var text = sel.toString().replace(/\s+/g, ' ').trim();
  if (!text) { hideSelbar(); return; }
  var node = sel.anchorNode;
  var el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
  if (!el || !appEl.contains(el)) { hideSelbar(); return; }
  var blk = el.closest ? el.closest('.blk') : null;
  state.sel = { text: text, ctx: blk ? blockText(Number(blk.getAttribute('data-b'))) : '' };
  hideTip();
  selbar.classList.add('open');
  place(selbar, sel.getRangeAt(0).getBoundingClientRect());
}

/* ============================================================
   9. BOOKMARKS
   ============================================================ */
function topVisibleBlock(){
  var els = appEl.querySelectorAll('.blk');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getBoundingClientRect().bottom > 130) return Number(els[i].getAttribute('data-b'));
  }
  return 0;
}

function addBookmark(){
  var bi = (state.mode === 'article' && state.playing && state.unit >= 0) ? UNITS[state.unit].b : topVisibleBlock();
  if (state.bookmarks.indexOf(bi) === -1) {
    state.bookmarks.push(bi);
    state.bookmarks.sort(function(a, b){ return a - b; });
  }
  paintPanel();
}

/* ============================================================
   10. EVENT DELEGATION  (registered once)
   ============================================================ */
selbar.addEventListener('mousedown', function(ev){ ev.preventDefault(); }, false);

document.addEventListener('click', function(ev){
  var t = ev.target;
  var act = t.closest ? t.closest('[data-action]') : null;

  if (!act) {
    var wordEl = t.closest ? t.closest('.w') : null;
    if (wordEl && state.dict && appEl.contains(wordEl)) {
      var blk = wordEl.closest('.blk');
      showTip(wordEl.getAttribute('data-w'),
              blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
              wordEl.getBoundingClientRect(), wordEl);
      return;
    }
    if (!tipEl.contains(t)) hideTip();
    if (!panelEl.contains(t)) { state.panelOpen = false; paintPanel(); }
    return;
  }

  var a = act.getAttribute('data-action');

  if (a === 'dict') {
    state.dict = !state.dict;
    dictEl.setAttribute('aria-pressed', state.dict ? 'true' : 'false');
    document.body.classList.toggle('dict', state.dict);
    hideTip();
    renderArticle();
  }
  else if (a === 'panel')  { state.panelOpen = !state.panelOpen; paintPanel(); }
  else if (a === 'bm-add') { addBookmark(); }
  else if (a === 'bm-del') {
    ev.stopPropagation();
    var di = Number(act.getAttribute('data-i'));
    state.bookmarks = state.bookmarks.filter(function(x){ return x !== di; });
    paintPanel();
  }
  else if (a === 'bm-go') {
    var gi = Number(act.getAttribute('data-i'));
    var gel = appEl.querySelector('.blk[data-b="' + gi + '"]');
    if (gel) window.scrollTo({ top: window.scrollY + gel.getBoundingClientRect().top - 130, behavior:'smooth' });
    state.panelOpen = false; paintPanel();
  }
  else if (a === 'play') { togglePlay(); }
  else if (a === 'prev') { playUnit(state.unit <= 0 ? 0 : state.unit - 1); }
  else if (a === 'next') { playUnit(state.unit + 1); }
  else if (a === 'sel-explain') {
    if (!state.sel) return;
    var r = selbar.getBoundingClientRect();
    hideSelbar();
    showTip(state.sel.text, state.sel.ctx, r, null);
  }
  else if (a === 'sel-play') { hideSelbar(); playSelection(); }
}, false);

document.addEventListener('change', function(ev){
  var act = ev.target.closest ? ev.target.closest('[data-action]') : null;
  if (!act) return;
  var a = act.getAttribute('data-action');
  if (a === 'model') {
    state.ttsModel = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer();
  } else if (a === 'gran') {
    var atBlock = (state.unit >= 0 && UNITS[state.unit]) ? UNITS[state.unit].b : -1;
    state.gran = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready';
    buildUnits();
    state.unit = -1;
    if (atBlock >= 0) {
      for (var i = 0; i < UNITS.length; i++) { if (UNITS[i].b === atBlock) { state.unit = i; break; } }
    }
    paintPlayer(); paintHighlight();
  }
}, false);

appEl.addEventListener('mouseover', function(ev){
  if (!state.dict) return;
  var el = ev.target.closest ? ev.target.closest('.w') : null;
  if (!el) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(function(){
    var s = window.getSelection ? window.getSelection() : null;
    if (s && !s.isCollapsed) return;
    var blk = el.closest('.blk');
    showTip(el.getAttribute('data-w'), blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
            el.getBoundingClientRect(), el);
  }, 340);
}, false);

appEl.addEventListener('mouseout', function(){ clearTimeout(hoverTimer); }, false);

document.addEventListener('selectionchange', function(){
  clearTimeout(selTimer);
  selTimer = setTimeout(evalSelection, 260);
}, false);

document.addEventListener('keydown', function(ev){
  if (ev.target && ev.target.id === 'q') {
    if (ev.key === 'Enter') { ev.preventDefault(); runSearch(); }
    else if (ev.key === 'Escape') { ev.target.value = ''; ev.target.blur(); hideTip(); }
    return;
  }
  if (ev.key === 'Escape') { hideTip(); hideSelbar(); state.panelOpen = false; paintPanel(); }
}, false);

window.addEventListener('scroll', function(){
  if (tipEl.classList.contains('open')) hideTip();
  if (selbar.classList.contains('open')) hideSelbar();
}, { passive:true });

/* ============================================================
   11. BOOT
   ============================================================ */
buildSents();
buildUnits();
renderArticle();
paintPlayer();
paintPanel();

})();
</script>
</body>
