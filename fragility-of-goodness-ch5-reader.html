<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf8;
    --ink:#1c1b19;
    --ink-soft:#6b6862;
    --ink-faint:#9c9891;
    --line:#e5e2dc;
    --accent:#8a6f4e;
    --accent-soft:#f0e9df;
    --panel:#ffffff;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --col:720px;
    --read:19px;
    --tap:32px;
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--serif);
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
    overscroll-behavior-y:none;
  }
  ::selection{background:#e7dcc9;}

  /* ---------- header ---------- */
  #topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(251,250,248,.94);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-left:var(--safe-l);padding-right:var(--safe-r);
  }
  .bar{max-width:var(--col);margin:0 auto;padding:0 24px;height:54px;display:flex;align-items:center;gap:10px;}
  .brand{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}

  .search{position:relative;display:flex;align-items:center;flex:0 0 auto;}
  .search input{
    font-family:var(--sans);font-size:12px;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:0 32px 0 13px;height:var(--tap);width:150px;outline:none;
    -webkit-appearance:none;appearance:none;
    transition:border-color .15s,width .2s,background .15s;
  }
  .search input:focus{border-color:var(--accent);width:210px;background:var(--panel);}
  .search input::placeholder{color:var(--ink-faint);}
  .search button{
    position:absolute;right:3px;width:26px;height:26px;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    border-radius:50%;padding:0;
  }
  .search button svg{width:14px;height:14px;fill:currentColor;}

  .btn{
    font-family:var(--sans);font-size:12px;line-height:1;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:999px;
    height:var(--tap);padding:0 13px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
    display:inline-flex;align-items:center;
    transition:background .15s,color .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--ink-faint);color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);}
  .btn.icon{padding:0;width:var(--tap);justify-content:center;}
  .btn.icon svg{width:15px;height:15px;fill:currentColor;}

  /* ---------- player ---------- */
  #player{max-width:var(--col);margin:0 auto;padding:0 24px 6px;display:flex;align-items:center;gap:7px;}
  .pbtn{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:50%;flex:0 0 auto;
    transition:background .15s,color .15s;}
  .pbtn:hover{background:var(--accent-soft);color:var(--accent);}
  .pbtn svg{width:16px;height:16px;fill:currentColor;}
  .pbtn.main svg{width:18px;height:18px;}
  .pmeta{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:var(--ink-faint);
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pmeta b{color:var(--ink-soft);font-weight:500;}
  .pmeta.err{color:#a4443a;}
  select.sel{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;height:var(--tap);padding:0 8px;cursor:pointer;flex:0 0 auto;
    -webkit-appearance:none;appearance:none;text-align:center;}
  .voicetag{font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:6px 10px;white-space:nowrap;flex:0 0 auto;}
  .spin{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;
    border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ---------- bookmarks ---------- */
  #panel{position:fixed;z-index:50;right:calc(16px + var(--safe-r));top:108px;
    width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 40px rgba(28,27,25,.12);padding:8px;display:none;
    max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch;}
  #panel.open{display:block;}
  .prow{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;}
  .prow:hover{background:var(--accent-soft);}
  .prow .n{font-family:var(--sans);font-size:10px;color:var(--accent);padding-top:3px;min-width:26px;}
  .prow .t{font-size:14px;line-height:1.45;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .prow .x{margin-left:auto;font-family:var(--sans);font-size:17px;color:var(--ink-faint);
    padding:0 6px;line-height:1;}
  .pempty{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint);padding:16px 10px;text-align:center;}
  .padd{width:100%;font-family:var(--sans);font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    border:none;border-radius:8px;padding:12px;cursor:pointer;margin-bottom:6px;}
  .phead{font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);padding:12px 12px 5px;}
  .prow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;margin-top:4px;}
  .prow .sw.y{background:#fbeeae;} .prow .sw.g{background:#d8ecd2;}
  .prow .sw.p{background:#f8d9e6;} .prow .sw.b{background:#d5e6f5;}
  .pwarn{font-family:var(--sans);font-size:11.5px;line-height:1.5;color:#8a6230;background:#faf1e2;
    border-radius:8px;padding:10px 12px;margin:6px 0;}
  .pbak{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;width:100%;margin-top:6px;}
  #bak{display:none;padding:4px 2px 2px;}
  #bak.open{display:block;}
  #bak textarea{width:100%;height:88px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.45;color:var(--ink-soft);background:#f7f5f1;border:1px solid var(--line);
    border-radius:8px;padding:9px;resize:vertical;outline:none;-webkit-appearance:none;}
  #bak .brow{display:flex;gap:6px;margin-top:6px;}
  #bak .brow button{flex:1 1 0;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;}
  #bak .brow button:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- article ---------- */
  #app{max-width:var(--col);margin:0 auto;
    padding:56px calc(24px + var(--safe-l)) 40vh calc(24px + var(--safe-r));}
  .kicker{font-size:12px;font-family:var(--sans);color:var(--ink-faint);letter-spacing:.08em;
    text-transform:uppercase;margin:0 0 10px;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,42px);
    line-height:1.18;letter-spacing:-.01em;margin:0 0 46px;}
  p.para{font-size:var(--read);line-height:1.8;margin:0 0 26px;}
  p.para em,.epi em,.note em,.fnote em,blockquote.quote em{font-style:italic;}

  /* ---------- printed-page furniture ---------- */
  .pgbrk{display:flex;align-items:baseline;gap:14px;margin:44px 0 30px;
    border-top:1px solid var(--line);padding-top:9px;}
  .pgbrk.verso{flex-direction:row-reverse;}
  .pgbrk .rh{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pgbrk.verso .rh{text-align:right;}
  .pgbrk .folio{font-family:var(--serif);font-size:13px;color:var(--accent);
    flex:0 0 auto;font-variant-numeric:oldstyle-nums;}
  .pgbrk.first{border-top:none;margin-top:0;padding-top:0;}
  .pgbrk.first .rh{display:none;}

  .epi{margin:0 auto 34px;padding:0 0 0 34px;max-width:88%;
    font-size:calc(var(--read) - 2.5px);line-height:1.72;color:var(--ink-soft);}
  .epi .cite{display:block;margin-top:10px;text-align:right;font-style:italic;
    font-size:calc(var(--read) - 4px);color:var(--ink-faint);}

  .secno{font-family:var(--serif);font-size:calc(var(--read) + 1px);text-align:center;
    letter-spacing:.14em;color:var(--ink-soft);margin:38px 0 26px;}

  .fnote{font-size:calc(var(--read) - 5px);line-height:1.62;color:var(--ink-soft);
    margin:30px 0 26px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;gap:9px;align-items:flex-start;}
  .fnote .mk{flex:0 0 auto;color:var(--accent);}
  .fnote .bd{flex:1 1 auto;min-width:0;}
  blockquote.quote{margin:0 0 26px;padding:2px 0 2px 22px;border-left:2px solid var(--line);
    font-size:calc(var(--read) - 1.5px);line-height:1.74;color:var(--ink-soft);}
  .note{font-size:calc(var(--read) - 4px);line-height:1.7;color:var(--ink-soft);margin:0 0 26px;
    padding:18px 20px;background:#f5f3ef;border-radius:8px;}
  .note::before{content:attr(data-label);display:block;font-family:var(--sans);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
  table.ab{width:100%;border-collapse:collapse;margin:0 0 26px;
    font-size:calc(var(--read) - 3px);line-height:1.62;}
  table.ab th{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:500;text-align:left;padding:0 14px 8px 0;border-bottom:1px solid var(--line);}
  table.ab td{padding:13px 14px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;width:50%;}
  table.ab tr:last-child td{border-bottom:none;}

  /* ---------- reading units ---------- */
  .s{border-radius:3px;transition:background .3s;}
  .s.reading{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);}
  .s.found{background:#e7dcc9;box-shadow:0 0 0 3px #e7dcc9;}
  .w{cursor:default;}
  body.dict .w{cursor:help;}
  body.dict .w:hover,.w.on{background:#e7dcc9;border-radius:3px;box-shadow:0 0 0 2px #e7dcc9;}

  /* ---------- highlighter ---------- */
  mark.hl{background:transparent;color:inherit;border-radius:2px;
    padding:.12em 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  mark.hl.y{background:#fbeeae;}
  mark.hl.g{background:#d8ecd2;}
  mark.hl.p{background:#f8d9e6;}
  mark.hl.b{background:#d5e6f5;}

  /* ---------- selection bar ---------- */
  #selbar{position:fixed;z-index:65;display:none;gap:2px;padding:4px;align-items:center;
    background:var(--ink);border-radius:99px;box-shadow:0 8px 26px rgba(28,27,25,.28);}
  #selbar.open{display:flex;}
  #selbar button{font-family:var(--sans);font-size:12px;color:#f4f1ec;background:transparent;
    border:none;border-radius:99px;padding:9px 14px;cursor:pointer;white-space:nowrap;}
  #selbar button:hover{background:rgba(255,255,255,.14);}
  #selbar .dot{width:22px;height:22px;border-radius:50%;padding:0;margin:0 1px;flex:0 0 auto;
    border:1.5px solid rgba(255,255,255,.28);}
  #selbar .dot:hover{border-color:#fff;transform:scale(1.12);}
  #selbar .dot.y{background:#fbeeae;}
  #selbar .dot.g{background:#d8ecd2;}
  #selbar .dot.p{background:#f8d9e6;}
  #selbar .dot.b{background:#d5e6f5;}
  #selbar .erase{padding:9px 11px;font-size:14px;line-height:1;}
  #selbar .sep{width:1px;background:rgba(255,255,255,.16);margin:6px 1px;}

  /* ---------- explain tooltip ---------- */
  #tip{position:fixed;z-index:60;width:min(360px,calc(100vw - 24px));
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 34px rgba(28,27,25,.14);padding:14px 16px;display:none;font-family:var(--sans);}
  #tip.open{display:block;}
  #tip .hw{font-family:var(--serif);font-size:19px;line-height:1.3;margin-bottom:2px;}
  #tip .infl{font-size:11.5px;color:var(--ink-faint);margin-bottom:9px;}
  #tip .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:11px;}
  #tip .chip{display:inline-block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 9px;}
  #tip .chip.gram{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.01em;
    text-transform:none;color:var(--ink-soft);background:#f1efeb;}
  #tip .chip.reg{text-transform:none;letter-spacing:.02em;color:#7a5d7a;background:#f2ecf2;}
  #tip .freq{display:inline-flex;gap:3px;align-items:center;margin-left:auto;}
  #tip .freq i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;}
  #tip .freq i.on{background:var(--accent);}
  #tip .sec{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  #tip .sec.first{border-top:none;padding-top:0;margin-top:0;}
  #tip .lbl{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:5px;}
  #tip .en{font-size:14px;line-height:1.55;color:var(--ink);}
  #tip .ex{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink-soft);
    margin-top:8px;padding-left:11px;border-left:2px solid var(--accent-soft);}
  #tip .why{font-size:13.5px;line-height:1.55;color:var(--ink);}
  #tip .load{font-size:12.5px;color:var(--ink-faint);}
  #tip .err{font-size:12.5px;line-height:1.5;color:#a4443a;}
  #tip .acts{display:flex;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  #tip .acts button{font-family:var(--sans);font-size:12px;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap;}
  #tip .acts button:hover{border-color:var(--accent);color:var(--accent);}

  noscript{display:block;max-width:var(--col);margin:60px auto;padding:0 24px;
    font-size:16px;line-height:1.7;color:var(--ink-soft);}

  /* ================= TABLET  (iPad portrait & landscape) ================= */
  @media (min-width:768px){
    :root{--read:20px;--tap:38px;}
    .bar{height:60px;}
    #app{padding-top:64px;}
  }
  @media (min-width:1024px){
    :root{--col:760px;--read:20.5px;}
  }
  /* Touch devices: no hover lookup, bigger targets, roomier popovers */
  @media (hover:none),(pointer:coarse){
    :root{--tap:42px;}
    .w{-webkit-tap-highlight-color:transparent;}
    #tip{width:min(400px,calc(100vw - 24px));padding:16px 18px;}
    #tip .acts button{padding:11px 16px;font-size:13px;}
    #selbar button{padding:12px 18px;font-size:13px;}
    .prow{padding:14px 12px;}
    .prow .x{padding:0 10px;font-size:19px;}
    .search input{font-size:16px;}      /* 16px stops iOS from zooming on focus */
    .search input:focus{width:240px;}
  }

  /* ---------- phone ---------- */
  @media (max-width:640px){
    :root{--read:17.5px;}
    .brand{display:none;}
    .bar{padding:0 16px;gap:7px;}
    #player{padding:0 16px 6px;gap:5px;}
    #app{padding:36px 16px 40vh;}
    .search{flex:1 1 auto;}
    .search input{width:100%;}
    .search input:focus{width:100%;}
    .voicetag{display:none;}
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <form class="search" id="searchForm">
      <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button type="submit" id="qBtn">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </form>
    <button class="btn" id="dictBtn" data-action="dict" aria-pressed="false"></button>
    <button class="btn icon" data-action="panel" id="bmBtn">
      <svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>
    </button>
  </div>
  <div id="player">
    <button class="pbtn" data-action="prev"><svg viewBox="0 0 24 24"><path d="M7 5h2v14H7zM20 5l-9 7 9 7z"/></svg></button>
    <button class="pbtn main" id="playBtn" data-action="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="pbtn" data-action="next"><svg viewBox="0 0 24 24"><path d="M15 5h2v14h-2zM4 5l9 7-9 7z"/></svg></button>
    <span class="pmeta" id="pmeta"></span>
    <select class="sel" data-action="gran" id="granSel"></select>
    <select class="sel" data-action="model" id="modelSel"></select>
    <span class="voicetag" id="voicetag"></span>
  </div>
</header>

<div id="panel"></div>
<div id="selbar">
  <button data-action="sel-explain" id="selExplain"></button>
  <span class="sep"></span>
  <button data-action="sel-play" id="selPlay"></button>
  <span class="sep"></span>
  <button class="dot y" data-action="hl" data-c="y"></button>
  <button class="dot g" data-action="hl" data-c="g"></button>
  <button class="dot p" data-action="hl" data-c="p"></button>
  <button class="dot b" data-action="hl" data-c="b"></button>
  <button class="erase" data-action="hl-erase" id="selErase">&#9003;</button>
</div>
<div id="tip"></div>

<main id="app"></main>

<noscript id="ns"></noscript>

<script>
'use strict';
(function () {

/* ══════════════════════════════════════════════════════════════════
   ①  CONTENT — replace this object to publish a different text.
       Nothing below section ③ needs to change.

       Block types:
         {t:'p', x:'...'}                 paragraph
         {t:'q', x:'...'}                 block quotation
         {t:'n', x:'...'}                 note / footnote box
         {t:'t', head:['A','B'], rows:[[left,right], ...]}   two-column table

       `id` keys the saved bookmarks. Change it when you change the text,
       otherwise the old bookmarks point at the wrong paragraphs.
   ══════════════════════════════════════════════════════════════════ */
var ARTICLE = {
  id: 'fragility-ch5',
  kicker: 'The Fragility of Goodness · Part II',
  title: '5 — The Republic: true value and the standpoint of perfection',
  blocks: [

{t:'pg',n:'136',h:``},
{t:'epi',x:`I am amused, I said, that you seem to be afraid of the many, in case they should think that you are prescribing useless studies. It is no trivial matter at all, but a difficult one, to realize that there is in the soul of each of us an organ or instrument that is purified and rekindled by mathematical studies, when it has been destroyed and blinded by our ordinary pursuits, an organ whose preservation is worth more than that of ten thousand eyes, for by it alone is the truth seen. Those who share this belief will think your proposal surpassingly good; those who have never had any perception of these things will probably think that you are talking nonsense - for they don't see any other advantage worth speaking of in these pursuits.`,c:`Republic 527D-E`},
{t:'p',x:`Plato's assault on the goodness of the ordinary opens on a scene of daily Athenian life. Socrates (who still believes that philosophy can be practiced as one element in the life of the democratic citizen) goes down from Athens to the Piraeus. With him is Glaucon, older brother of Plato. The year is probably 421, during the Peace of Nicias: a time of rest and relative stability. By the time of composition, about fifty years later, most of the dialogue's principal characters are dead, and few of them peacefully. Three (Polemarchus, Niceratus, and Socrates) have been executed on political charges; the first two were brutally murdered for their fortunes by an oligarchic faction led by members of the family of Plato. We watch these peaceful interactions, then, with apprehensiveness and a sense of impending violence - a violence nourished, evidently, by the desires of the appetitive part of the soul.¹`},
{t:'p',x:`They go, Socrates and Glaucon, to observe the festival of Bendis, a recently imported Thracian goddess. Socrates is at first curious, later admiring. Using repeatedly the language of seeming and appearing, he makes a value judgment: both the local procession and the one sent by the Thracian visitors were 'fine' or 'splendid' (kalē)* - or so it seems to him. Later that same evening, furthermore, there is to be a torch-race on horseback, followed by an all-night festival. And that, judges Plato's older brother Adeimantus, should be really 'worthwhile to see' (*axion theasasthai*, 328A).`},
{t:'fn',m:'*',x:`On the range of meaning of this important aesthetic-ethical term, usually rendered 'beautiful', 'noble', 'fine', see Ch. 6, p. 178, where I suggest that it comes very close to introducing a unified conception of value (both moral and aesthetic). For a discussion of Greek terms that are related to our 'value', see Ch. 1, p. 7 and n. 12.`},
{t:'pg',n:'137',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`Between the procession and the torch-race, then, these Athenian democrats find a little room for philosophical conversation. It is in this space that the entire *Republic* takes place. All the characters but Socrates seem (at first, at any rate) to consider philosophy a diversion like everything else, no more and no less valuable. In the true democratic spirit, they attach equal value to all of their interests and pleasures - each of them, like the democratic man described in Book VIII, 'handing the rule over himself to each appetite as it comes along until it is replenished, as if it had chosen the lot for that office, and then in turn to another, dishonoring none but fostering them all equally' (561B). This attitude to value is linked, clearly, with a lack in both constancy and self-sufficiency. A guardhouse kept in such a way is at the mercy of any ruler that happens along. A soul kept in such a way can all too quickly change its course in obedience to a new mastering desire. And because its desires lead it, so frequently, to attend to vulnerable things, it can all too rapidly be stripped of what it values. We know that the men who here are friends will soon be killing one another for power and property. Of all the dead, only Socrates dies without losing anything that he loves.`},
{t:'p',x:`The scene shortly shifts to the home of Cephalus (a man whose name means 'head'). This old man's bodily deficiency has brought him, as he tells us, a larger than usual measure of focus and stability. Too infirm to walk easily in the city, his bodily desires dimmed by advancing years, he lacks many of the younger men's distractions; he finds his love of argument correspondingly increased (328C-D). Most of the old men he knows, Cephalus tells Socrates, mourn the coming of old age. They think it has impoverished their lives. Since they attach worth to the bodily appetites and to the activities that satisfy them, they 'long for the absent pleasures of youth. They recall the pleasures of sex and drinking and feasting, and others that go with these, and they are angry, as if they had been deprived of important things - as if they used to live a good life and now aren't even living' (329A). The vulnerability of their good living is - we see again - directly connected with their thought about value. Change and happening are problems for them because they care about chance-governed and changing things. For Cephalus, on the other hand, the change to old age simply means the end of a problem. He reminds Socrates about the poet Sophocles, who, when asked whether he was still capable of making love to a woman, answered, 'Silence, O human being. I am extremely happy to have escaped that, like a slave who has gotten away from a mad and savage master' (329B-C). Cephalus agrees: 'For a great peace and freedom from these things comes with old age. After the tension of the appetites relaxes and ceases, it is just what Sophocles said, an escape from many mad masters' (329C).`},
{t:'p',x:`The *Republic*'s opening confronts us, then, with a question about value: what is truly worthwhile, worth doing and worth seeing, in a human life? It indicates to us (something that should be no surprise by now) that the answer to this question will be closely connected with our questions about risk and self-sufficiency. The average democratic citizen is maximally unsafe because he attaches value, in his conception of good living, to activities and subjects that are unsafe - that are,`},
{t:'pg',n:'138',h:`Plato: goodness without fragility?`},
{t:'p',x:`in fact, almost certain to fail sooner or later. Cephalus and Sophocles do better. But Cephalus is still tormented by his concern for money and by his fear of death. And we suspect that he has ascribed more importance to appetite than he himself knows: for we shall later see that it is possible, even in one's prime, to live a life much less tormented by 'mad' appetite than his, because less attentive to its objects. By the argument's end, Socrates will have defended as the best human life a life much more extreme in its detachment than Cephalus's: the life of the philosopher, whose soul the *Phaedo* describes as akin to the forms it contemplates: pure, hard, single, unchanging, unchangeable. A life, then, of goodness without fragility. We would like to understand his arguments for the superior value of this life.`},
{t:'p',x:`As we ask Plato's question about value, we must also be asking, with him, an epistemological question: how, or from what standpoint, are adequate judgments reached about the value of prospective constituents of a life? For it is plain from the dialogue's opening that ordinary people, when asked what seems fine to them, will name many activities that the philosopher's argument will in the end judge worthless; and in general, as Socrates will later observe, most people, if asked what is worthwhile, will praise the content of their own lives (581C-D). But Plato is convinced that most of these answers are misguided: the 'eye' of our human souls is 'deeply buried in some barbaric slime' (533D) and cannot see clearly. From what position, then, does this eye see well? And what is the nature of the obstacles to its true vision? Sophocles made a suggestion. With his lofty 'O human being' - words that Plato, at any rate, surely chooses deliberately - he implied that the problem lies with our distinctively human nature; that correct perception would come from a standpoint that is more than human, one that can look on the human from the outside. (*Republic* IX will speak of a 'real above' in nature.) We need to explore, then, not only the account of value but also the account of true vision that goes with it.`},
{t:'p',x:`We can now begin this search: but in a complicated way. For there is a difficult interpretative problem in our path. We need to set it out and clarify our relation to it before we can properly appreciate Plato's arguments.`},
{t:'sec',x:'I'},
{t:'p',x:`The *Republic* argues that the best life for a human being is the life of the philosopher, a life devoted to learning and the contemplation of truth. The *Republic* also argues that the best life is a life 'ruled' by reason, in which reason evaluates, ranks, and orders alternative pursuits. Both of these claims about the *Republic*'s theory of the good are generally accepted; what interpreters are less readily able to settle is how, and whether, these two Platonic claims about the good are related. It appears that the conception of 'rule' by reason articulated in the fourth book of the dialogue is a purely formal conception that makes no attempt to specify the content of the life that gets planned and ordered by reason. All that is required there is that the agent harmonize his or her soul, order his`},
{t:'pg',n:'139',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`or her life plan, in accordance with some orderly conception of the good. The reasoning part of the soul (*logistikon*) determines what has value and how much, 'taking thought for the good of the entire soul'.⁴ The difference between the reasoning or intellectual part and the other motivational elements of the person is to be found in this capacity for overall evaluation and selection. Appetites merely reach out for objects, without conceiving of them as overall goods. But there is no reason, according to Book IV's formal conception of rational valuation, why the content of a life plan should not include appetitive activities as intrinsically valuable components that get selected and arranged alongside the others. There is also no reason to suppose that reason will organize the agent's life around the activity of reasoning. In fact, it seems quite natural to suppose that the reasoning part, in taking thought for the good of the 'entire soul' of a complex human being, will accord intrinsic value to activities that satisfy natural, persisting appetitive needs. Plato does not yet say anything against this; we suppose that any well-ordered content should satisfy his requirements.`},
{t:'p',x:`And yet, by the time we reach the end of the *Republic*, Plato has said a great deal about content. He has, in fact, rejected many of the most common human activities, including all appetitive activities, as lacking in true or intrinsic value, and he has chosen the life of the philosopher as the best life. In fact, Socrates claims very precisely that this life is 729 times better than the worst life, the life of the tyrant. This move beyond Book IV's purely formal account is prefigured by Socrates' cryptic claim, in Book VI, that the earlier story was insufficient because it stopped with a merely human agreement and used as its measure of value a human, therefore an imperfect, being. The *Protagoras* has already shown us that such a measure will not do for Socrates. Such 'laziness', he now says, is a quality of mind that our city and our philosophers must reject. Similarly, in the *Phaedo*, Socrates defends as the best life a life which he calls a practice for death: a life of philosophical contemplation in which the philosopher dissociates himself or herself as much as possible from the desires and pursuits of the human body, according them no positive value at all.`},
{t:'p',x:`Recent interpreters are in agreement that Plato's final judgments of the value of lives, in the middle dialogues, cannot be adequately explained by appeal to *Republic* IV's formal argument alone. Clearly Plato has an independent interest in the components of lives; overall order is only necessary, and not sufficient, for the highest sort of value. But there is, in the recent literature on this question, a tendency to think of these claims about content as an embarrassment to Plato, and to reconstruct his argument, insofar as possible, so that it relies on the formal considerations alone. One outstanding such attempt is that of Gary Watson in his article 'Free agency', a very persuasive picture of Book IV's account of rational valuation, in which it is explicitly asserted that intrinsic value will, in this account, be attached to activities that satisfy our standing appetitive needs.¹⁰ Watson, however, is not offering an interpretation of the *Republic* as a whole; he is therefore free to ignore the additional questions raised by the later books. In *Plato's Moral Theory*, however, Terence Irwin does offer a reading of the whole *Republic* that`},
{t:'pg',n:'140',h:`Plato: goodness without fragility?`},
{t:'p',x:`develops a position similar to Watson's as an account of the entire work.¹¹ In his valuable and stimulating book, Irwin argues that Plato's primary interest is in describing a conception of the good as the harmonious adjustment of a number of separate constituents, each possessing intrinsic value. In Irwin's reading, these intrinsic ends will be the personal ideals of each human agent, discovered by the deliberative procedures of recollection (interpreted here as a kind of introspection¹²) and self-criticism. Any life content will be acceptable to Irwin's Plato, provided that it can satisfy, in an orderly way, the agent's own system of desires. In the case of certain lives that Plato rejects, the rejection can be accounted for on grounds of form.¹³ But Irwin concedes that Plato does in fact reject, on grounds of content alone, lives whose orderly form seems satisfactory. Irwin also admits that the introspective procedures by which a life content is arrived at on his account are nowhere mentioned in the *Republic* itself; in their place we find a claim that only a life dedicated to contemplation of the truth - a life not everyone can have, or perhaps even want - is fully worthwhile life. But, in Irwin's opinion, this is just a mistake on Plato's part. 'It is regrettable', he writes, 'that Plato leaves us gaps to fill here, because of his interest in contemplative rather than in practical wisdom.' And he attributes this and other 'gaps' to Plato's distance from our contemporary philosophical interests: 'He does not stress the parts of the problem we might like him to stress; but that is because his view of the problem and of the right kind of answer is not the view of some more recent moralists.'¹⁴`},
{t:'p',x:`We have turned to Plato as a thinker whose importance is closely linked to the depth and severity of his challenge against prevailing beliefs, both of his day and of our own; so this 'distance' does not, by itself, alarm us. But it would be regrettable - and on Plato's own terms - if vague prejudice and interest had indeed, at this crucial juncture, displaced philosophical argument.¹⁵ Furthermore, it is very important for our particular concerns to determine whether Plato's arguments do or do not support these judgments of content. For if Irwin is correct, only one of our central concerns, the harmonious interrelationship of values, is actually addressed in Plato's arguments; the fragility or instability of individual commit- ments is not of concern to him or is of concern only to his prejudice. But if he has arguments for his choice of the philosopher's life these will be likely to tell us why a good life should exclude or minimize our most fragile and unstable attachments, consecrating itself to the more self-sufficient intellectual pursuits. As we pursue this problem we find, as I shall argue in this chapter, that the material about content is not peripheral, but quite central to the *Republic*'s theory of the good. I shall argue that the 'gap' Irwin detects in the *Republic* argument is actually filled by a complex theory of true value and of objective valuation which, far from being built upon prejudice,¹⁶ is well worth our most serious attention. In fact, if we do not consider it, we run the risk of stripping Plato of some of his deepest and most characteristic arguments, of central importance for our own inquiry. In the end we risk turning the *Republic* into a comfortable expression of the liberal principle (mentioned in Book VIII) that it should be 'open to each person to structure an arrangement for his own life, the one that pleases him' (557B) - rather`},
{t:'pg',n:'141',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`than, what it is, a profound and unsettling attack on that principle as a basis for genuinely good living.`},
{t:'p',x:`Although the *Republic*'s move from structure to content appears abrupt and puzzling, it is less so once we see that Plato has provided an argument to support it. Towards the end of Book IX, after describing several alternative lives, Socrates introduces a two-part 'demonstration' (580C-D)¹⁷ to show Glaucon that the life of the philosopher is the best (most *eudaimōn*) human life.¹⁸ The complex argument that follows sets up a division of enjoyments or pleasant activities, activities performed with enthusiasm or alacrity, that is related to Book IV's tripartite division of the soul into appetitive, emotional, and intellectual elements. (Although considerations of pleasure appear initially to be separated off from considerations of goodness, it is clear as the argument progresses that the ranking of 'pleasures' is a ranking not of subjective feelings about activities, as to their strength or intensity, but of the activities themselves, as to their true worth or objective desirability. Thus the 'true' pleasures are those activities that are chosen in harmony with true beliefs about value or worth, as opposed to those in which agents take pleasure because they falsely believe them to have worth. The latter can and do still give rise to very intense feelings of pleasure, as Plato stresses; but they will not be ranked high as pleasures according to Plato's scheme.)¹⁹ Socrates now argues that the activities associated with the 'reasoning part' of the soul, learning and the contemplation of truth, are the best activities in a human life. He argues first epistemologically: the correct criterion of judgment is 'experience combined with wisdom and reason' (582C-583A). The philosopher alone judges with the right criterion or from the appropriate standpoint; he selects his own activities as best. Second, Socrates argues that the philosopher's activities are superior on intrinsic grounds: being concerned, as they are, 'with the unchanging and immortal and with truth', they have a higher worth than the pursuits associated with the other two parts (585Aff.).`},
{t:'p',x:`Although these two parts of the argument are formally separate, their connection is close: the epistemology of value-judgment underwrites the choice of this content for true value, and the intrinsic merits of the content dispose us to be content with the standpoint that has approved it. (We shall later ask questions about this relationship.) Epistemological considerations continue to be prominent in the second part of the argument, where the ordinary person's errors in value ranking are explained by the observation that his experience has not taken him to the place from which, alone, appropriate judgments of worth can be made. Unlike the philosopher, who has traveled to the 'real above' in nature, this person has only oscillated between the 'below' and the 'middle' (584Dff.).`},
{t:'p',x:`In this passage, if anywhere, Plato shows us the considerations that would lead a soul 'ruled by reason' in the formal sense to choose a certain specific life content, that of the life devoted to philosophy, rather than some other orderly plan of life. And here, if anywhere, he shows us the standpoint from which true rankings are made. The passage is compressed and difficult; it is not readily evident how Plato`},
{t:'pg',n:'142',h:`Plato: goodness without fragility?`},
{t:'p',x:`moves from his formal ideal to the specification of content through this ranking of activities, or how the ranking itself is produced.²⁰ Fortunately, however, the theory of activity-value that is cryptically discussed here receives a fuller development in other related dialogues, especially the *Phaedo*, *Gorgias*, and *Philebus*. If we bring related passages to bear on this one,²¹ we shall better appreciate the strength of Plato's position.`},
{t:'p',x:`In the *Gorgias*, Socrates faces an opponent who grants the importance of having a rational life plan, but wishes to specify the content of that plan in a way that is repellent to the philosopher: the best life is a life organized by reason for the maximal enjoyment of sensual pleasure. The 'naturally noble and just' man, Callicles argues, will allow his appetites to grow very great, in fact, as great as possible. But, because of his superior 'courage and practical intelligence' he will also 'be sufficient to minister to them at their greatest and to satisfy every appetite with what it craves' (492A). Here, then, is a life formally ruled and ordered by reason. But most of its episodes will be episodes of appetitive activity: eating, drinking, sexual indulgence. Socrates' reply should, then, give us some insight into the nature of his argument for the superior value of the content of the philosopher's life.`},
{t:'p',x:`It should be noticed, first, that Callicles is not at all disturbed by the large element of need in the life he describes, the extent to which reason's choices 'minister to' (*hupēretein*) the exigencies of the body.²² He seems to believe, in fact, that just because we are beings with such-and-such needs, there is a certain positive value attaching to the pursuits that satisfy those needs. He requires only that need remain within the limits of reason's power to procure satisfaction and that the whole life be not haphazard, but under the executive direction of intelligence. Furthermore, Callicles seems to attach a positive value to the very having of these appetitive needs: for Socrates' claim that those who need nothing are living well (are *eudaimōn*) fills him with distaste. 'In that case', he replies, 'stones and corpses would be living superlatively well' (492E). He evidently, then, ascribes positive intrinsic value not to the state of replenishment itself, which even a corpse might exemplify, but far more to the having and pleasant replenishing of the human appetites - and the bigger, apparently, the better: 'the maximum inflow' (494B).²³ It is Socrates' aim to attack both of these claims: both that appetitive activities have value because of the way in which they answer to our needs and that there is positive value, for a human being, in the very having of recurring appetitive needs.`},
{t:'p',x:`The strategy of Socrates' argument is to find some cases of activity bringing satisfaction of an appetitive need for which Callicles will concede that the activity in question is shameful or ridiculous, the need a need any person should wish not to have. Callicles is then pressed to see a close similarity between these cases and his own favored activities; and he is urged to concede that, in his own case as well, the activities are without positive intrinsic value, the needs whose disappearance it would be rational to want. The two text examples presented by Socrates are the pleasure of scratching an itch and the sexual enjoyment of the`},
{t:'pg',n:'143',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`passive homosexual. Callicles is, in fact, not won over by the first: he tenaciously tries to claim that scratching is a perfectly good component of the ideal life. But the second example so deeply offends his social and sexual prejudices that he is forced to rethink his entire position. 'Aren't you ashamed, Socrates,' he says, 'to lead the argument to things of that sort?'²⁴`},
{t:'p',x:`Socrates' implicit argument about these two cases seems to be as follows. Itching is a need, and scratching an activity answering to and assuaging that need. Scratching has, therefore, what we might call need-relative or replenishment value. But we can easily see, if we sever the activity from the replenishment context, that we do not ascribe any independent intrinsic value to the activity of scratching. It is nothing that a rational being would include as a component of a plan for the good life.²⁵ It is valuable as, and only as, the activity that calms a certain sort of troublesome bodily feeling. If we never had itches, we would have no reason at all to scratch. If a person thought scratching a good sort of thing to do and went around scratching whether or not he had an itch, we would think him comical or disturbed.`},
{t:'p',x:`Furthermore, it is easy to see that we wish, in general, not to be afflicted with the itching that gives rise to the desire for scratching. Perhaps this is just because itching itself is so excruciating; perhaps a further reason is that the activity that relieves it is so undignified and so embarrassing. In any case, we do not value the having of this need or pain; we do not prefer the life with more and greater itches to the life with fewer and smaller.²⁶ We would think that a person who prayed for the greatest possible itches, provided that he or she always had the power to scratch, was either a maniac or a clown.`},
{t:'p',x:`The example of the passive homosexual works in a similar way.²⁷ To take one's sexual pleasure in this manner is, for some people, to satisfy a need. But the activities involved are not, just on account of their need-relative value, intrinsically good or valuable activities. They do not make for *eudaimonia*: a life made up of such episodes as components is not a valuable human life (494E). In fact (assuming for the moment the point of view of a Greek of Callicles' class and background²⁸), we agree that it is a ridiculous and loathsome way to behave. Callicles would laugh at people who do that, even if he knew they were satisfying a need. And nobody, he assumes, would choose to do that if he did not have that need already. The need, furthermore, is a need that Callicles hopes and prays never to feel. He wishes that no child or friend of his will ever feel it. In this case, the wish not to have the need cannot be explained by the unusual pain of the need itself; this sexual need is, by itself, no more painful than the sexual needs which Callicles values and fosters. The need is wished away, presumably, because it leads to activities that are antecedently and independently classified as disgraceful. The life composed of them is 'terrible and shameful and wretched' (494E). Callicles wishes not to need to do shameful and wretched things.`},
{t:'p',x:`The examples, then, force Callicles to concede that no activity has positive intrinsic value merely because it replenishes a lack or answers to a need. And some needs are themselves hateful just because the activities they prompt are`},
{t:'pg',n:'144',h:`Plato: goodness without fragility?`},
{t:'p',x:`independently judged to be bad, silly, or unmanly. We cannot, then, settle issues of life-content simply by looking at what will satisfy the various needs that we happen antecedently to have, or by asking people in the grip of those needs what they think they want. We must look independently at the activities themselves, and ask whether they are noble.`},
{t:'p',x:`But Socrates does not introduce these two examples as isolated or exceptional cases. He uses them as particularly clear cases that display features shared by all cases of appetitive, or, more generally, need-satisfying activity; and he intends to attack the claim of all these activities to be component parts of the good life. The examples are introduced via a general consideration of the structure of the appetitive element of the soul (493A3, B1); eating to satisfy hunger and drinking to satisfy thirst are agreed to be paradigmatic examples of the type of activity under discussion (494B-C); and the homosexual case is said to be a 'summary' of this entire group (494E3-4). Finally, at the conclusion of the discussion of the examples, Socrates gets Callicles to concede explicitly that 'every need and appetite' has a similarly pain-relative structure (496D, cf. 497C7). The suggestion clearly is that the appetitive pursuits valued by Callicles are all really like itching and scratching: attractive to someone already afflicted with a certain sort of pain, but of no value in themselves. If we can get ourselves to view these common pursuits from outside, not from the distorting perspective of felt need, but objectively, we will, he suggests, find them as ridiculous, as valueless, or perhaps even as loathsome, as we now find the pursuits of the homosexual or the scratcher. We will therefore wish not to have such needs, so that our lives need not be spent in repeated and somewhat absurd attempts to satisfy them. Socrates' stories of the leaky jars and of the 'torrent-bird' told in this same passage, tried to get us to see the futility and squalor of appetitive pursuits. All of us, insofar as we live an appetitive life, are like vessels full of holes, vainly pouring into ourselves, again and again, a satisfaction that as promptly deserts us. Or, worse, we are like an especially loathsome sort of bird that excretes as rapidly as it eats, and is constantly doing both.²⁹ Overall rational order is not enough: the constituents of a rational life must also be intrinsically choiceworthy.`},
{t:'p',x:`Socrates' arguments leave us with a number of troublesome questions. It is not clear that Callicles should be so quickly impressed by Socrates' attempted assimilation of his 'naturally noble' person to types that he himself despises. Even if there are some activities that have need-relative value without having any separate intrinsic value, it is not clear why we should take the very presence of need-relative value to be evidence of the absence of intrinsic value. Socrates clearly implies this - but clearly his argument will not take him this far. Considerations that would help to fill out the argument - considerations, for example, of the instability and impermanence of appetitive activity - are barely alluded to and not developed. But we will return to these issues later, and turn now to the evidence for a similar theory of value within the *Republic* itself.`},
{t:'p',x:`Early in the *Republic*'s second book Glaucon presents a tripartite classification of activities with reference to the kind of value or worth they possess. It does not`},
{t:'pg',n:'145',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`exploit precisely the same distinction that we found in the *Gorgias* and shall find again in the *Republic* IX argument about enjoyings. But it is a related distinction, and one which Plato tends to run together with the one that we have seen; and, equally important, we shall encounter here a number of examples that play a central role in the value-theories of *Republic* IX and the *Philebus*. There are, Glaucon tells us, three kinds of goods (*agatha*), or things we would choose to have. (Although this might look like the introduction to a list of possessions, the members of his lists are all, in fact, activities that we think good and choose to pursue.³⁰ Glaucon's 'We would choose to have' suggests that what is in question is not the content of all actual pursuits, but only the content of rational choices, or choices made in certain conditions. It invites us to think about good and bad conditions for choice, pointing forward to the epistemological questions of *Republic* IX.) The first group contains activities that are chosen not for their consequences, but for their own sake alone: 'enjoying oneself, and all the harmless pleasures which have no further consequences besides the joy one finds in them' (357B). Second are activities that we choose both for their own sake and for the sake of independently desirable consequences: reasoning, seeing, the healthy functioning of the body. Third are things valuable only for their independently desirable consequences, and not choiceworthy in themselves: exercising, under- going treatment when one is sick, making money.`},
{t:'p',x:`Here again, we see that certain pursuits in which we engage have no intrinsic value. We rationally choose them because we have certain needs, pains, or interests, and the pursuits are efficient instrumental means to the desired consequences. A healthy person who took bad-tasting medicine would be irrational. Even exercising, which answers to a standing need of any creature with a bodily nature similar to ours, is held to be one of the things you go through just to be in a state you otherwise want to be in; it has no merit just as an activity. All of these activities look worthwhile in relation to a contingent context; take away the context and the reasons for selecting them will be gone. Contrasted with these cases are the intrinsically valuable components of a life: the good functioning of mind and body that is at once both valuable and useful, the useless but valuable enjoyments. (The latter, to judge from examples in other passages, would include certain aesthetic and sensory pleasures.)`},
{t:'p',x:`This distinction is not exactly the same one as the *Gorgias*'s distinction between merely need-relative and non-need-relative value. There might be pursuits undertaken as instrumental means to a desired end that were not prompted by any felt pain or lack. Exercise is not always undertaken because bad condition is felt as painful. And it could be argued that not every pursuit that has its value merely, or solely, in relation to some antecedent pain that it assuages is chosen as an instrument to the resulting state of relief or replenishment.³¹ But the two contrasts are very closely related. Both contrast merely context-relative value with value that would be value in any circumstances whatever; and, more important, they contrast deficiency-relative activities with activities that would be valuable even had we no deficiencies at all. Their 'right-hand' side, the side of intrinsic, non-relative value, is the same in the two cases, and Plato appears to treat the`},
{t:'pg',n:'146',h:`Plato: goodness without fragility?`},
{t:'p',x:`two contrasts as interchangeable for the purposes in which he is interested. This is not, I think, a particularly grave problem for his argument. What is still unanswered in this classification, however, is the question of the *Gorgias*: are we to suppose that every activity whose value derives primarily from its relation to our needs is just for this reason entirely lacking in intrinsic value? *Republic* II does not clearly make this claim; indeed, some valuable activities are also useful, though their value does not derive from usefulness. But the stronger claim is explicitly advanced, in connection with a similar instrumental/intrinsic contrast illustrated by similar examples, in an early argument of the *Gorgias*. There Socrates and Polus agree that if someone does something for the sake of something else, he does not truly want that which he does, but only that for the sake of which he does it; and that this is true whenever someone wants something of instrumental value (467D-468A).³² Why should we think this? For a deeper understanding of such claims and their consequences for the status of appetitive activity, we must now return to the argument in *Republic* IX with which we began, supplementing it with material drawn from the *Phaedo*, and from the classification of enjoyings in the *Philebus*.`},
{t:'p',x:`The Book IX argument defends the content of the philosopher's life over the available alternatives by developing a theory of the value of activities whose elements should by now look familiar to us. There are, says Socrates, some activities that people value only because they provide relief from an antecedent pain or lack. The activities are accorded value either (1) because they seem good and pleasant by contrast with the pain that preceded, or (2) because they are means to a pain-free end state that itself seems good by contrast with the preceding pain; or sometimes for both reasons (583C-584A). But, Socrates continues, we can see that neither the activities nor their resultant end states are intrinsically valuable. They are not 'truly pleasant' at all: the judgment that they are worth something is thoroughly based on illusion. For no rational creature would choose to engage in such activities were he or she not in need or pain. Nor is the state of null pain in which these activities culminate anything more valuable than a neutral or zero state (583C-D). It has in itself no positive value; indeed, contrasted with some activity that is intrinsically good or pleasant, this state would look like a state of deficiency, since it is inactive. It is valued highly only by those human beings who have never experienced real intrinsically good enjoyings, people, as Socrates puts it, who have never traveled to the 'above' in nature, but have only oscillated between the 'below' and the 'middle'. The view such people take of the good is a distorted one because of the limitations of their perspective. 'None of these views is healthy with regard to the truth about pleasure - there is a kind of bewitchment' (584A). Socrates' claim (if we now combine these observations with the epistemological claims of the earlier part of the argument) is that a human being who has had the right sort of experience, viz. the philosopher, and who judges from the appropriate standpoint or using the correct criteria, will be in a position to detect the error of the many and to make correct value-ascriptions.`},
{t:'pg',n:'147',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`We still lack a clear account of what the reliable perspective or standpoint is, this standpoint of the 'real above' in nature. But the philosopher's ability to judge correctly seems to have less to do with mere quantity of experience than with the fact that experience has taken him to a certain place: a place where reason, free of pain and limitation, can stand alone, above the restrictions imposed upon thought by merely human life. (Socrates' reference to a 'bewitchment' reminds us of a similar passage in the *Phaedo*, in which the most powerful sources of cognitive 'bewitchment' were said to be the needs and appetites of the body (81B).)`},
{t:'p',x:`We have, then, a fusion of our two familiar contrasts. Intrinsically valuable activities are now divided off both from merely need-relative and from merely instrumental values, both of which are said to lack intrinsic value. (A new point which Socrates adds here is that even the consequences of the instrumental activities in question have, at best, a merely pain-relative and not an intrinsically positive value.) In the latter mixed group, Socrates now argues, belong all of our ordinary appetitive pursuits: eating, drinking, sexual activity. Also, he insists, though without additional argument, the activities associated with the emotional part of the soul, and the enjoyment of anticipating future bodily pleasures (586C, 584C9-11). In the former, intrinsically valuable group we have the pleasures of smell (584B), which are very intense, but neither follow an antecedent pain nor leave pain behind when they depart.³³ But the central example of pure or genuine enjoying is the intellectual activity of the philosopher. (We should never lose sight of the importance of mathematical reasoning and contemplation for Plato as a central case of these pursuits.) Socrates' praise of this activity gives us insight into the features that are, in his view, constitutive of intrinsic value. Both here and in the *Phaedo*'s related discussion of goods of soul and body,³⁴ he stresses three features.`},
{t:'p',x:`(1) Purity: (a) of activity. The activity is chosen itself by itself; it contains no necessary admixture of pain, either as a source of antecedent motivation or as a concomitant experience, by contrast with which the pleasure of the activity is felt as pleasure. So it has its worth by and in itself, without standing in a necessary relation to, being 'mixed up with', something else (584C, 585A-B, 586B-C; cf. *Gorg.* 496C-497D, *Phd.* 66D-E, 60A, 70D). (b) Of objects. The objects of intellect are themselves particularly clear and simple paradigms, unmixed with their contraries, existing themselves by themselves (cf. *Phd.* 67B).`},
{t:'p',x:`(2) Stability: (a) of activity. The activity can continue in the same way, without cessation, abatement or variation. It is thus very different in structure from the ebb and flow of replenishment-activities, which exhibit an internal sequence of changes and minister to contingent need (585C; cf. *Phd.* 79C-80B). (b) Of objects. The objects of intellect are themselves also maximally stable, in fact (in Plato's view) eternal. They never vary or come to be, but are always there and always in the same condition. The objects of the non-philosopher, on the other hand, are the mutable things of this world, 'never the same, and mortal' (585C; cf. *Phd.* 79C, et al.).`},
{t:'pg',n:'148',h:`Plato: goodness without fragility?`},
{t:'p',x:`(3) Truth. The activity of the philosopher leads to a grasp of the real truth about the universe and an ability to give fully adequate accounts, not mere half-truths or conjectures (585C; cf. 533B-C). This last point is important because it tells us that the philosopher's life is superior even when he is not directly contemplating the forms, or doing mathematical and scientific thinking, but is going about his political duties. For even then he will 'know each of the likenesses, what they are and of what, because he has seen the truth concerning fine and just and good things' (520D).`},
{t:'p',x:`The *Republic*, then, develops a theory of value in which no single element predominates, but in which purity, stability, and truth all play a role in the ranking of objects and also of activities that constitute lives. It supports the selection of these marks of value by claiming that human beings who have had the right sort of experience of the available alternatives and who judge from the standpoint of the 'real above' will choose a life that exemplifies these values, and not their opposites. And it argues, further, that the activities that constitute the bulk of most people's lives - eating, drinking, sex - lack these marks of value, possessing a merely specious value because of the way in which they relieve need or distress, and/or the way in which they lead to states of relief. Certain elements of this value-theory - for example Plato's concern for stability and purity of objects - are closely bound up with the *Republic*'s particular theory of truth and of the objects of knowledge. Others, such as the concern with truth *simpliciter* and with stability and purity of activity, look separable from Plato's particular conception of truth and may not even require a realist conception. None of this seems to depend on mere metaphysical prejudice. Constituents of lives, Socrates argues, must be examined for these marks of value. If they lack them, they cannot be called true enjoyings, truly valuable pursuits. The philosopher's life is found to be superior not because of bias, but because it exemplifies values which, Socrates argues, all rational beings with the appropriate experience would pursue.`},
{t:'p',x:`Before we look at the evidence for a similar account of value in the *Philebus*, we have two closely related questions about Plato's account. We have said that the bearers of value are activities that can figure as constituents of lives; but that they have this value both in virtue of what they internally are *qua* activity, and also in virtue of the nature of their objects. Plato does not clearly tell us how these two sets of criteria are to be related: whether, that is, we could have a 'pure' activity directed at 'mixed' or 'impure' objects, a stable activity directed at unstable objects, and, if we could, what we ought to say about the value of such activities. This problem is, in fact, one which enters into the interpretation of the stability-of-activity criterion itself. And this brings us to our second question, which concerns the correct understanding of that criterion. For stability, it seems, can be understood in two rather different ways.³⁵ On the first account, an activity is unstable if it necessarily involves an internal sequence of changes. Because of its internal structure, it cannot continue in the same way indefinitely. On the second account, an activity is unstable if it relies for its occurrence on contingent circumstances in the world that might fail to be realized. These two interpretations give different accounts of the instability of appetitive activity. For example, on`},
{t:'pg',n:'149',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`the first, eating is unstable because its internal structure prevents its indefinite continuation; on the second, it is unstable because it depends upon the presence of food, which might fail to be available. If these two accounts are understood as different accounts of what stability and instability are, they will also be extensionally non-equivalent: for on the first account, smelling a rose will be stable in spite of the transience of roses, whereas on the second it will not. On the second, the activity will not count as stable unless its objects are permanent or highly stable.`},
{t:'p',x:`Plato is clearly interested in both of these causes of instability. (We shall see in Chapter 6 how he explores them for the particular case of sexual desire.) Although his position is difficult to determine with precision, I believe that he would regard these as two complementary and compatible accounts of the causes of instability, rather than as two rival and incompatible accounts of what instability is. (This interpretation may be supported by *Phd.* 79D5-6, where the activity is unstable 'inasmuch as' or 'because' it deals with unstable objects.) Eating and sexual activity are unstable for two reasons: because of their internal structure and because of the nature of their objects. Smelling a rose is stable internally, but its objects can give rise to instability. In fact, however, it is not so badly off in this respect, given that roses are usually readily replaceable and interchangeable. The stability of an activity is thus causally dependent, to some degree, on either the permanence or the ready replaceability of its objects. An activity which has neither source of instability will be better off than one which has the right internal structure but the wrong objects. But this conclusion does not make Plato's defense of philosophy thoroughly dependent on his particular account of the objects of intellect. We can see how the belief that there is a stable truth there to be known in nature, apart from the changing circumstances of human life, would lend force to a Platonic account of activity-value. We can see, too, how a belief in eternal, non-context-dependent paradigmatic objects would tend to support his belief that contemplative activity is maximally stable, unvarying, and context-independent. In fact, the marks that separate true from apparent value bear a striking and non-coincidental resemblance to the marks that separate forms, as objects of knowledge, from other less adequate objects; the *Phaedo* exploits this connection.³⁶ But stability, purity, and truth may be achieved without separated forms. Even an Aristotelian biologist will be able to insist that what he studies are the stable kinds that replicate themselves in the same way in nature. And the *Symposium* will show us that any scientist or mathematician whatever, with or without eternal objects, is bound to be better off than the lover of unique human individuals.`},
{t:'p',x:`The *Philebus* supports and expands this account of value, giving further evidence for our reading of Plato's undertaking. Most of this dialogue is explicitly concerned with the critical assessment of prospective constituents of lives and with the construction of a best life out of the acceptable components. In certain ways the account differs from the ethical theory of the middle dialogues; but many important points remain constant. It is quickly agreed that the standard appetitive pursuits - eating, drinking, getting warm, and 'others countless in number' - are`},
{t:'pg',n:'150',h:`Plato: goodness without fragility?`},
{t:'p',x:`mere 'replenishment' activities, chosen only in order to relieve an antecedent lack (32A-B, 46C-D, cf. 54Eff.). They are revealingly compared, all of them, to itching and scratching (46A, D) and held to be impure because inextricably mixed up with pain. Later they are included in the best life only insofar as they are absolutely necessary conditions of the intrinsically valuable pursuits (62E; this means that the 'violent pleasures' are omitted altogether - cf. 63D-E). A great part of the dialogue is then spent in the examination of some troublesome cases on which the *Republic* had spent little time: the pleasures associated with the emotions and the pleasures of anticipation. Socrates attempts to assimilate even these apparently 'pure' psychological pleasures to the replenishments by arguing that all are, in some way, relative to a contingent deficiency, whose removal would remove all reason for choosing them: they are all really pleasures 'mixed with distress' (50D). If you have not been harmed, you have no reason for the 'pleasures' associated with anger and revenge; if you have no lack, you have no reason for the 'pleasures' of love. If you have no false beliefs about the future, you have no reason for the associated false pleasures of anticipation. (And, falsity aside, we could by this argument rule out all the pleasures of hope: for where there is no deficiency in either power or knowledge, there is no room, conceptually, for hope.³⁷)`},
{t:'p',x:`Finally, Socrates presents us with his characterization of the 'true' or 'pure' pleasures, arguing that they differ from all that have been rejected. First he describes certain pure aesthetic enjoyings - the contemplation of beautiful shapes and tones apart from all interest in their representational or mimetic content. This contemplation, not attended by antecedent distress, may justly be said to be valuable or good 'in virtue of itself' (*kath' hauto*) and not merely 'relatively to something' (*pros ti*). Smells are included too, 'insofar as they do not have distress as a necessary part of them' (51E).`},
{t:'p',x:`Turning now to the pleasure of intellectual activity, Socrates insists that both learning and understanding have intrinsic value. He advances reasons for the judgment that are reminiscent of the *Republic*'s account of the marks of value. (1) They are pure: preceded by no felt lack, accompanied by a felt pleasure (51E). In no way are they necessarily mixed up with pain, for even the loss of knowledge brings no distress to the agent (52A-B). They are therefore compared to samples of the purest, most unmixed white color. (2) They have order and harmony (*emmetria*), whereas the intensely pleasant activities directed at replenishment exhibit disorder and disharmony (*ametria*) (52C). This criterion captures at least part of what the *Republic* meant by stability, viz., the absence of internal ebb and flow; at 59C stability is explicitly listed, along with purity (unmixedness) and truth, as a mark of value, and is said to be causally bound up with the stability of an activity's objects. (3) They stand much better than the bodily pleasures with regard to truth (52D). Although intellectual activities can be, and later are, further subdivided and ranked according to degrees of precision (*akribeia*), truth, and stability,³⁸ all of them clearly possess these marks of value to a high degree, and none of the pleasures connected with the body exhibits them at all.`},
{t:'p',x:`It is important to notice that the *Philebus*, like the *Republic*, speaks of good and`},
{t:'pg',n:'151',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`bad, high and low standpoints of value-judgment. The achievement of the dialogue is to convince the young interlocutor that he must reject a fashionable tendency to point to the natural behavior of untutored animals as a criterion of what is worthwhile in a life. He should put his trust in the 'witnessing' of intellect rather than that of our common animality. Socrates says to an acquiescent Protarchus, at the dialogue's end, that bodily pleasure would not be given first place,`},
{t:'p',x:`> Not even if all the cows and horses and all the beasts in the world spoke for it by their pursuit of pleasure. Although most people, trusting in them as prophets trust their birds, judge that [these] pleasures are the most powerful factors in making a good life for us, and they think that the sexual behavior of beasts is a more authoritative witness than the passion for arguments which have continually prophesied under the inspiration of the philosophic muse. (67B)³⁹`},
{t:'sec',x:'II'},
{t:'p',x:`By this time, we can see Plato's theory of value in its general outlines; we see how it supports the life of the philosopher as against a life devoted primarily to need-relative pursuits. There are certain marks of value which philosophical activity possesses to a particularly high degree and which appetitive activities do not possess at all. Plato has argued that activities possessing these characteristics are the ones that would be selected by a rational being who judges from the appropriate rational standpoint. (He does not tell us whether the marks are jointly necessary conditions of intrinsic value, or individually sufficient; but I think his rankings of lives lend support to the former interpretation.) All this appears to be enough to undermine the 'democratic' conception of enjoying, according to which all enjoyings have an equal claim to inclusion as intrinsic values in the best life (561B).`},
{t:'p',x:`But little has been said so far about how the valuable activities are related to those which are said to lack intrinsic value. We know that a philosopher must eat and drink enough to live. But we do not yet know whether he or she will eat and drink only enough to live, or whether a moderate, even a high, degree of sensual indulgence will be required instrumentally to foster his philosophical growth. We certainly have no reason yet to think that his life will be particularly ascetic.`},
{t:'p',x:`Both the *Republic* and, to an even more marked degree, the *Phaedo* do, however, espouse asceticism for the philosopher. The *Phaedo*, attacking the 'so-called pleasures' of the body (60B, 64D), tells us that the good person will regard these activities with active disdain, 'except insofar as he is absolutely compelled to share them' (64E, cf. 54A, 67A, 83B). He not only does not 'honor' them, he positively 'dishonors' them (64D-E). He 'stands aside from the body insofar as he can' (65A). Four reasons for this denial of the body emerge in what follows. First, the needs of the body take up time. The less time we spend on them, the more time is free to be spent in intrinsically valuable pursuits (66C-D). Second, the bodily pursuits`},
{t:'pg',n:'152',h:`Plato: goodness without fragility?`},
{t:'p',x:`impair not only the quantity, but also the quality of intellectual endeavor. They render it less continuous, less powerful, less regularly able to attain to truth:`},
{t:'p',x:`> [The soul] reasons best, presumably, whenever none of these things bothers it, neither hearing nor sight nor pain, nor any pleasure either, but whenever it comes to be alone by itself as far as possible, disregarding the body, and whenever, having the least possible communion and contact with it, it strives for that which is the case. (65C, cf. 66A, B, D, and *Rep.* 517E, where bodily pleasures and pains disturb the 'better part' and prevent it from attaining truth in dreams)`},
{t:'p',x:`A further reason to dishonor and disregard the bodily feelings is found in the consideration that they are not accurate or clear, even as indices of real physical need. If we listen to our body every time it registers a lack, we will be deluded into eating and drinking far more than we strictly need for continued life and intellection (65B, D, E; 66D, 67A).⁴⁰ The sexual appetite is felt as a very powerful drive; indeed it is clear that Plato views it as the most powerful among the appetites. (The *Republic* speaks of it as their 'chief officer' and as a 'tyrant' in the soul of the person who attends to it - 572E, 573D, E, 574C, 575A.) And yet it is plain that the *Phaedo*'s true philosopher can completely dissociate himself from it with no danger. Finally - what Socrates calls the 'greatest and most extreme of all evils' (83C) - the appetites, whenever we attend to them at all, provide us with a constant very strong incentive to make false judgments about value and worth. They 'bewitch' the soul (81B) into thinking bodily activities more important than contemplation. In this way appetite forces the soul to view everything, as it were, through the walls of a prison which appetite itself has made (82E); the result is that the captive will 'himself be an enthusiastic collaborator in his imprisonment' (82E-83A).`},
{t:'p',x:`Plato has now defended a way of life that is not only philosophical, but also ascetic.⁴¹ The theory of value gave us a preference for a life with a high philosophy content. Now reflection about the appetitive pursuits and their relationship to reasoning leads us to the conclusion that the philosopher ought to dissociate herself from the body and its needs as far as is compatible with continuing life, setting herself 'at odds with it at every point' (67E), 'practicing for death' (i.e. the separation of the soul from the body), admitting even as instrumentally valuable only those pursuits that satisfy what *Republic* VIII and the *Philebus* refer to as 'necessary' desires. Here, finally, we have reached the position of the end of *Republic* IX, where Socrates expresses his disdain for appetitive activity, declaring that each of us should view ourselves as identical with the intellectual soul alone. In the *Phaedo* we see, similarly, that Socrates is confident that everything that is him will survive, unscathed, the death of the body (115C-E) and its desires.`},
{t:'sec',x:'III'},
{t:'p',x:`We now need to look more carefully at the way in which Plato arrives at his list of the marks of value. Any theory of value that has as its consequences a plan`},
{t:'pg',n:'153',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`of life that is so remote from what a normal human being normally pursues and values had better be closely scrutinized. How is so much ordinary value thrown away? From what perspective or standpoint is it that all our eating and drinking look as valueless as scratching an itch?`},
