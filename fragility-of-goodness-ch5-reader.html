{t:'p',x:`One thing is very clear: that this standpoint is nothing like that of the ordinary human being. For from the internal viewpoint of the ordinary human being the central appetitive pursuits are in important ways not like itching and scratching. If an activity possessed no intrinsic value for us, it would be rational for us to accept any substitute that would procure the same desirable results. We do use lawn-mowers, washing-machines, typewriters, thereby giving evidence that we believe the activities of mowing, washing, and handwriting to have merely instrumental value. But this is not the case with eating. We would choose, most of us, to continue to eat food rather than to take a hunger-capsule, presumably because we find eating to be, to some degree at any rate, valuable in itself, perhaps for the pleasure of taste, smell, texture, and sociability involved. Most of us, again, do not pursue sexual activity merely as a source of release from a painful tension; it is connected with other complex ends such as friendship, self-expression, and communication; there are reasons why most of us do not take the option of becoming eunuchs. The *Republic* seriously underestimates the complexity of our appetitive nature when it ignores the aesthetic side of appetitive activity and the complex connections between such activity and other valuable ends. What we find ridiculous about scratching as an activity is not simply its need-relativity. The source of our condemnation lies elsewhere. It is an indication of bodily disease or poor hygiene; it is futile, because it never completely relieves the annoying pain, but usually makes it worse; and it provides a constant very strong distraction, devoid of all positive pleasure, from other important life-activities like work and sleep. What is more, the activity lacks any positive aesthetic side; we cannot imagine an art of it, or connoisseurs of it. It is, finally, socially unacceptable and embarrassing. Eating isn't like that; sex isn't like that. We do wish to be free of itches all our life long; but how many, even abstracting from considerations of health, really wish to be free of the need to eat? In fact, we tend to be critical of persons who do view appetitive pursuits merely instrumentally, eating merely in order to still a hunger, and to praise those who are capable of entering into such activities in a way that endows them with intrinsic value: the gourmet, the connoisseur of wines, the person who can treat a sexual partner as an end in him or herself, rather than as a mere means to a state of null tension.`},
{t:'p',x:`Again, the example that so impresses Callicles, the example of the passive homosexual, looks equally unfair. The reason this person's sexual activity is seen by the interlocutors as unfortunate is, even within their point of view, in large part a social and cultural reason. The internal point of view of a Greek gentleman distinguishes sharply between his own manly sexual pleasures (both heterosexual and homosexual) and those of this passive person. The latter is assumed to be acting under some sort of brute compulsion, in large part because the social and political associations of such activity are so strongly negative. We assume that`},
{t:'pg',n:'154',h:`Plato: goodness without fragility?`},
{t:'p',x:`most people wish to avoid ridicule and criticism; we pity them if they have irresistible sexual needs that put them continually at odds with their fellow human beings. For such reasons an Athenian pities the catamite. But this says nothing about sexual activity in general. From the ordinary internal viewpoint of a Callicles, in fact - as Plato was well aware - the ascetic philosopher will seem just as weird and as laughable as the passive homosexual. (In the comedies of Aristophanes, jokes at the expense of the two types are more or less equally distributed.) Furthermore, we ourselves may, as I do, find Callicles' intuitions about the example objectionable and irrational; if we do, then we will not be disposed to grant Plato his point even about this one case.`},
{t:'p',x:`So if we see Plato's theory of value as an attempt to articulate something like an ordinary human viewpoint concerning the appetites, we must conclude that he has badly failed. He has blurred distinctions that we consider very important, denied intrinsic value where we agree in finding it.`},
{t:'p',x:`But it is also evident that this is not, in fact, what Plato is trying to do. He readily grants that most people do ascribe intrinsic value to the bodily pleasures and to the states that are their objects. The opening of the *Republic* accurately records this fact. What he says is that this is a delusion, resulting from the deficiency of the perspective from which they make their judgments. It is only from the point of view of the 'real above' in nature, i.e. from the viewpoint of the philosopher, who can stand apart from human needs and limitations, that a really appropriate judgment about the value of activities will be made. It is this point of view that he attempts to elucidate.`},
{t:'p',x:`We know, however, from the *Phaedo* and from the *Republic*'s earlier books that the philosopher, to be that, must first be an ascetic, dissociating him or herself from the body's needs. It is, then, from the viewpoint of one who no longer sees his characteristic human needs as genuine parts of himself that Plato rejects the associated activities as valueless, selecting others as intrinsically good. A striking example of this detached and extra-human viewpoint is found in Socrates' condemnation of the appetitive class at the end of Book IX, where he characterizes their activities using words used elsewhere in the Greek language only of the behavior of sub-human animals:`},
{t:'p',x:`> ... Nor have they ever tasted stable and pure pleasure, but, like cattle, always looking downwards and bending over the earth and over their tables, they pasture, grazing and mounting, and, for the sake of getting more of these things they kick and butt one another with iron horns and weapons and kill one another through their insatiability. (586A-B)`},
{t:'p',x:`This may seem grossly unfair. Surely, one might wish to argue, the pursuits of a species must be assessed from within the ways of life and the standing needs of that sort of creature. If you are such that the typical member of your species looks to you like a member of a species different from yours, then you are not the sort of ethical judge we want or need. Value simply is radically anthropocentric, and it should not count against a pursuit that the reasons for choosing it are not evident to a creature who is, or has become, different in nature from those for`},
{t:'pg',n:'155',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`whom it is a good. The view begins to look dangerously circular: appetitive activity is rejected from a point of view that has already purified itself of appetite.`},
{t:'p',x:`But Plato's examples have repeatedly shown us to what extent feeling and need can delude or distract the judgments of reason. The person with perverse sexual desires, for example (since most of us will agree that there are some such cases, if not the one that Plato selects) may think that he is engaging in fine or valuable activity; but from the perspective of the average human being these pursuits appear questionable. Appetite's capacity for distortion and self-justification cannot, Plato thinks, be overestimated. The *Phaedo* spoke of 'bewitchment' and of our willing collaboration in a captivity in which the prison walls are made by appetite; the *Republic* depicted appetite as a foul mud that obscures the soul's vision, so long as it has any contact with it at all (533C-D, cf. Ch. 7). Once we realize how severe an obstacle desire is to true judgment we are, as Plato sees it, led inexorably to the conclusion that really adequate judgments can be made only by getting free and clear of appetitive influence altogether. Each pleasure or pain to which we attend is like a rivet that binds the soul to a dangerous source of delusion and impurity (*Phd.* 83D). Plato assumes that no reflective person wishes to be the dupe and slave of his appetites. Even the ordinary character Cephalus, in *Republic* I, spoke with relief of his escape from the compulsions and the value-distortions caused by sexual desire. The dialogue's ominous political references remind us of other possibilities for the appetite-inspired distortion of central ethical values. The ordinary person believes that ethical judgment is obscured by the ordinary. The only solution, then, seems to be to get ourselves to a point at which we have no pressing human needs at all and can therefore survey all the alternative activities coolly, clearly, without pain or distraction, 'using pure reason itself by itself' (*Phd.* 66A) - so that eating and love-making do eventually look, to our soul's eye, like nothing more interesting than the grazing and copulating of cattle. This would be no solution, clearly, if appetite and emotion had any essential positive contribution to make to understanding or to the good life. Then - as the *Phaedrus* will acknowledge - we might have to engage ourselves with them in spite of their dangers. But Plato believes that he has already argued (in *Republic* IV) for an account of the appetites that rules this out: appetites are 'unqualified desires', brutish and unselective, totally unresponsive to judgments about the good; emotions, though somewhat more educable, tend towards dangerous violence without continual supervision.⁴²`},
{t:'p',x:`We find, then, that the interlocutors' sense, and ours, of the obstacles to true judgment has deep roots in human experience; this experience, which does not itself presuppose Plato's standpoint, supports its choice as the best standpoint. Plato does not expect to convince everyone; but he does expect that his arguments will appeal to reflective self-critical adults who are not themselves philosophers or mathematicians. It is, after all, his brother Glaucon, soldier and gentleman, who in *Republic* VII displays enormous zeal for mathematics as a form of training that will purify the soul of the confusing influence of the ordinary. In the passage that I have placed as the epigraph to this chapter, Socrates tells him not to worry if`},
{t:'pg',n:'156',h:`Plato: goodness without fragility?`},
{t:'p',x:`completely unreflective people think mathematics useless: more thoughtful and perceptive people (not just ascetics or experts, plainly) will recognize the merits of his proposal. If there is any sort of circularity here, then, it is a far richer and more interesting circle than the objector has allowed. Plato is not just preaching to the converted. And this sort of circle, in which ethical content, standpoint of judgment, and a sense of the obstacles to correct judgment are all held together, supporting and illuminating one another, is likely to be found in any complex ethical theory. (In Chapter 10 §V, we shall discuss the Aristotelian analogue.)`},
{t:'p',x:`We can now return to the cryptic transitional moment in *Republic* VI that prepared the way for a move beyond a content-neutral picture of the good. Socrates said there (and the non-philosopher Glaucon agreed) that no imperfect being, *a fortiori* no merely human being, is ever 'good measure' of anything. Anthropocentric 'laziness' is no good basis for an ethical theory. Socrates had already, in the *Protagoras*, replaced 'The human being is the measure of all things' with the uncompromising 'Knowledge [or: science] is the measure of all things' (cf. Ch. 4, pp. 115, 120). Now we learn his considered view about what this requirement comes to: from now on, only the 'perfect' (complete, needless) will be 'good measure' of value for the ideal city: for only from the undistracted viewpoint of perfection can truth be seen. Having agreed as much, the interlocutors move away from their former content-neutral picture of the good life, which rested on a merely human consensus, and strive towards the pure viewpoint of needlessness. Book IX is the result.`},
{t:'p',x:`This distinction between value relative to a limited being and real intrinsic value (here taken to coincide with that which a perfect, non-limited rational being would select) is, we might now say, the most general and most basic form of the contrast which we have been exploring. It is sufficient to explain the value-distinctions of our other passages, and it can also be invoked to explain judgments, like the *Philebus* judgments of aesthetic value, which could not be explained by appeal to instrumentality or pain-relativity alone. Let us digress for a minute to explore that passage.`},
{t:'p',x:`The *Philebus*, as we saw, rejects all representational painting and sculpture, e.g. the forms of animals, and defends the beauty of the pure, simple shapes and colors. Plato's point here seems to be that insofar as it is the representational features of a painting or sculpture that engage our attention, we are responding from the point of view of anthropocentric interests and needs. Imagine a perfect, disembodied, needless god looking at a Praxiteles statue of an athlete. Its judgments of aesthetic value might turn out to coincide with ours; but we feel that this would be a mere coincidence, so different would be the contexts of the judgment in the two cases. We delight in the fine sensitive depiction of the strength and responsiveness of the human form, the way the sculptor has both captured our likeness and expressed what we find marvelous, strong, or admirable in ourselves. The perfect god would not see anything so wonderful about its being a particular type of body. It would be most likely to assess the sculpture as a pure`},
{t:'pg',n:'157',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`form or shape, judging it successful insofar as it exhibited a composition that was, in the abstract, pleasing or delightful. It would look for the pure qualities of form, color, and arrangement, refusing to value, as such, any of the features of the object that link it with our practical interest in our species and our environment. Plato urges us to see, by assuming, insofar as we can, the standpoint of this god, that our human interest in the representational features of painting and sculpture leads to impure judgment, blinding us to the true or pure value that they offer. Similarly, in music, he urges us to purge ourselves of our interest in human meaning, speech, emotion, and to admire the 'smooth, clear sounds, the ones that produce a single pure tone' (51D). Contingent, species-relative value is not intrinsic value. As the same point is put by the formalist critic Hanslick, 'The beautiful is not contingent upon nor in need of any subject introduced from without, but...consists wholly of sounds artistically combined.'⁴³`},
{t:'p',x:`Plato's standpoint of perfection is not immediately available to any creature who wishes to assume it. It is a long and difficult matter to learn to detach ourselves from our human needs and interests, or to get to a point at which we can do so at will. Therefore, if Plato is really committed to a model of rational evaluation utilizing such a standpoint, we would expect him to provide us with a model of education to accompany it.`},
{t:'p',x:`This expectation is confirmed. The *Phaedo* describes an entire life that is a 'practice' for the separation of the soul from the body. And the *Republic* is, for more than half its length, a book about education, i.e., about the strategies for 'turning the soul around' from its natural human way of seeing to the correct way. I shall not even attempt here to offer an account of all the stages in the soul's development as it describes them. But I want to point briefly to a feature of Plato's treatment of poetry in the account of early moral education that has, as far as I know, received very little attention, a feature whose importance we can now appreciate in the light of our interpretation.`},
{t:'p',x:`It is well known that in his purge of poetry in Books II-III, Plato excludes the representation of several of the human emotions most frequently treated by poetic art: grief, passionate love, fear. It is less noticed that these emotions are ruled out by an argument that assumes the standpoint of perfection and asks, from this standpoint, about their value. For the true hero, Socrates argues, or for the god, it is not appropriate to grieve deeply for the death of a mere mortal: no really lofty being will seriously mind the loss of one small portion of the perceptible world. Therefore, since our literature should provide a moral ideal for weaker men, we must not include these and other ungodlike emotions in it (388B-E). In an earlier passage, a similar appeal to what befits the god is used to rule out literature that depicts its lofty or divine heroes as telling falsehoods. Socrates asks his interlocutors what reasons a perfect and needless being could have for telling falsehood; concluding that there are none, he concludes also that the figures who are to be models for us should not be depicted engaging in this activity: 'God is altogether simple and true in deed and word, and neither changes himself nor deceives others' (382E). In this appeal to what befits the god, Socrates both uses`},
{t:'pg',n:'158',h:`Plato: goodness without fragility?`},
{t:'p',x:`a standpoint of perfection to determine an aesthetic/moral value and constructs for the young citizens, in speech, a representation of that standpoint as a moral ideal. We should imitate beings who are completely without merely human needs and interests, in order to cultivate our own potential for objective rationality. Therefore our literature should depict those beings and their deliberations.⁴⁴`},
{t:'sec',x:'IV'},
{t:'p',x:`I have argued that Plato moves beyond Book IV's formal agreement about the shape of rational life plans to provide an independent theory of value that specifies the best content for a rational life. The theory consists, first, of an account of the marks of intrinsic value and of the difference between intrinsic value and merely species-relative value; second, of an epistemology of value, which describes to us the procedures by which genuinely objective judgments of value may be made. The best life will be a life maximally devoted to contemplative, scientific, and aesthetic pursuits, in which all other activities have a merely instrumental value at best.⁴⁵ It is important to stress at this point that the activities chosen by the philosopher are supposed to be valuable intrinsically, not just because the philosopher chooses them. His pursuits are good because his choice responds to real value, not just because he judges from the appropriate standpoint. If his choices were constitutive of value in and of themselves, then he and his choices would begin to look arbitrary.⁴⁶ But Plato believes that this ideal of the conditions of evaluation offers the best route by which mortal beings can get access to the real value that would be there, and be value, whether they existed or not.`},
{t:'p',x:`According to this view, the political life of the philosopher can count as intrinsically valuable on the grounds that it realizes and contemplates stability and harmony in the city; also on the grounds that it is occupied with making precise and true judgments concerning the elusive realities of the empirical world. But it is nonetheless no surprise that the philosophers need to be compelled to take it up, since it possesses the marks of intrinsic value to a lesser degree than does their contemplative life. Plato's account of true value does, then, permit one sort of serious contingent value conflict to arise, as the demands of philosophical contemplation pull against the claims of rulership. To this extent its commitments to singleness and unity appear less whole-hearted than those of the *Protagoras*. But we should not conclude that Plato's intense focus on the stability of individual values has led him to ignore problems arising from their interrelationship. We have already spoken of the way in which Book IV constructed an internally harmonious life ruled by reason. Throughout the *Republic*, and especially in Book V, there is enormous emphasis on the internal unity and conflict-free harmony that will be effected for each individual by the city's education. And we can see why this should be so, if we consider once again the relationship between these two problems. A human being who is weaned from all attachment to internally unstable pursuits such as love, sexual activity, power-seeking, and money-making is automatically at the same time rid of many of the most common grounds of`},
{t:'pg',n:'159',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`value conflict. In part, the superior harmony of the philosopher's life results directly from this reduction in the number of his or her commitments. The pursuit of mathematics and the pursuit of love will not come into conflict for a mathematician who does not care about love or a lover who does not care about mathematics. But the philosopher or mathematician's particular choice of content contributes powerfully, too, to his harmonious condition. He chose these pursuits precisely because they were always available and did not require any special conditions for their exercise. He can think about theorems in all kinds of circumstances; they are always available for his activity, regardless of his political circumstances, regardless of the activities and attachments of other human beings. So how often will he be forced to make a painful choice? The self-sufficiency of individual pursuits leads, then, to a reduction in conflict.`},
{t:'p',x:`The few potential conflicts remaining in this life are solved by an ingenious combination of moral education and political engineering. In Book V, Socrates turns his attention to the family and to private property, two of the most common grounds of serious value conflict. And he announces his radical and notorious solution. The city will not exactly eliminate either ownership or the family: but it will spread these around in common among members of the city. There is no city-family conflict if, for every young citizen, the whole city simply is the family; if any other kind of family tie is unknown to it. Again, there is no conflict between what is 'my own' and what is the city's, if all property is held in common. Plato, unlike Creon, perceives that such radical stratagems cannot simply be imposed upon people who have been brought up another way; he knows that the existing city is not a unity, but a plurality. All of human experience must therefore be transformed, beginning with the baby's experience of the mother's breast. Farmed out to interchangeable wet nurses, prevented from forming special or intimate bonds with particular parental figures, and later with particular sex partners, these citizens will learn in every part of their experience to treat all citizens as 'alike and beloved friends', interchangeable exemplars of the same values.⁴⁷ The *Symposium* appears to carry this one step further, showing us how the good person learns to regard the value of persons as itself fully interchangeable with the value of institutions and sciences. And this further move offers not exactly a solution to the philosopher-ruler's dilemma, but at least a marked mitigation: for if his choice between contemplation and rule is just the choice between loving and contemplating two different sources of the same value, then the choice looks far less acutely painful.`},
{t:'p',x:`These strategies chosen to minimize conflict enhance, at the same time, the stability of single pursuits. For no other type of family attachment, for example, would be as stable, as easily acted on in all kinds of circumstances, as this widespread devotion to an enormous reservoir of citizens, loved for their civic virtue rather than for their personal selves. In this way, Plato, once again solves our two problems together, with a single solution.`},
{t:'p',x:`There remains one sphere of ineliminable non-interchangeability. The connec- tion that each being has with the feelings of his or her own body cannot be`},
{t:'pg',n:'160',h:`Plato: goodness without fragility?`},
{t:'p',x:`generalized or spread around as can other things formerly 'one's own'. No matter what the legislator does, the sensations of this piece of flesh have a connection with me that is altogether different from the connection I have with that other piece of flesh over there. Plato recognizes this as a deep problem. In the related passage in the *Laws* he tells us that teachers of the young will do whatever lies in their power to undermine this special love of something irreducibly one's own:`},
{t:'p',x:`> The notion of the private (*idion*) will have been, by every possible stratagem, completely uprooted from every sphere of life. Everything possible will have been devised to make even what is by nature private, such as eyes and hands, common in some way, in the sense that they will seem to see and hear and act in common. (739C-D)`},
{t:'p',x:`Nature blocks the legislator's full success. The best he can do is to teach us again and again to disregard these special feelings, to remind ourselves that this feeling thing is not really us, this nature not our real nature. That we are single-natured rational souls, only contingently located in that thing. And now we see a further motive for his so teaching. For the body is not only the biggest obstacle to stable life and to true evaluation; it is also the most dangerous source of conflict, and therefore the biggest obstacle to impartial and harmonious civic justice. (Cf. Ch. 6, pp. 181, 196-7; Ch. 7, p. 221; Ch. 12, p. 353).`},
{t:'sec',x:'V'},
{t:'p',x:`I have said that it is not a strong objection to this value-theory that it does not faithfully reflect the ordinary human's intuitive view of her practices and pursuits, since, according to Plato, no ordinary person, especially in a liberal democracy, has had the education that would sufficiently cultivate his or her potential for objective rationality. But it is, of course, still incumbent on Plato to show us, ordinary as we are, that this ideal of rational valuing and this standpoint of perfection are worthwhile goals for a human being to pursue. He must give us some reason to want to attain his ideal, or to think that it is one to whose pursuit we are already in some way committed. We might object, in particular, that the external god's-eye perspective is neither attractive, in that it requires the denigration of so much that we value, nor important, in that it is not relevant to the living of our human lives. Perhaps it is not even available: the world and its value cannot be found and known in isolation from our human interpretations and ways of seeing, shaped as they are by our interests, concerns, and ways of life. Any objectivity about value that is worth talking about, perhaps any about which it is even possible to talk, must be found within the human point of view and not by attempting, vainly, to depart from it.`},
{t:'p',x:`I shall not develop these objections further at this point. They are complex, and a full understanding of them would require, among other things, a detailed examination of Aristotle's ethical views to which we shall turn in Chapter 8. I shall simply say here that Plato has not in fact ignored this sort of objection; and the question of motivation is one to which he has devoted a great deal of`},
{t:'pg',n:'',h:``},
{t:'p',x:`The Republic: true value and the standpoint of perfection 161`},
{t:'p',x:`consideration. His answer has what we might call a negative and a positive strand, the two being intimately connected. On the negative side, Plato believes that he can show us that much that is valued in the internal human viewpoint on the world is, if we reflect seriously, a source of intolerable pain for a rational being. Sufficient motivation for the ascent to the philosopher's perspective is already present to us, in the tumult and disorder of our empirical lives. One central task of the philosopher will be to display the intolerable aspects of our lives to us in an unavoidably clear way, at the same time displaying the philosopher's ascent as a remedy for that torment. I believe (and will argue in Chapter 6) that this is the task undertaken in Plato's *Symposium*; and we can see similar considerations at work in *Republic* I, with its ominous foreshadowing of appetitive violence, and VIII, with its devastating portrayal of the unstable lives of those who would have constituted the bulk of Plato's audience.`},
{t:'p',x:`The positive strand or aspect of Plato's answer to the motivational question is suggested in *Republic* VI. Speaking of the grasp of the truth about the good, a non-perspectival truth that is what it is independent of all human interests, Socrates says, 'This, indeed, is what every soul pursues, and for the sake of this it does everything that it does, divining obscurely what it is' (505E).⁴⁸ Again, in the *Philebus*, Socrates urges us to consider 'whether there is in our souls some natural power of loving the truth and doing everything for the sake of that' (58D4-5, cf. 'the passion for arguments', 67B). Mathematical and philosophical reasoning are forms of value to which we, alone among mortal beings, are deeply drawn, by some kind of fortunate innate endowment (cf. *Epinomis* 978B, *Phaedrus* 250A): our psychology has a natural affinity with the truly good. We find mathematics beautiful and exciting because, by good luck, we fit with real beauty.`},
{t:'p',x:`We might try to see this positive answer as just another way of putting the negative point: we are motivated to seek true, stable value because we cannot live with the pain and instability of our empirical lives. This was Nietzsche's diagnosis of Platonic value-theory. In a fragment entitled 'Psychology of metaphysics', he writes of the motivations underlying the Platonic defense of true value:`},
{t:'p',x:`> It is suffering that inspires these conclusions: fundamentally they are desires that such a world should exist... To imagine another, more valuable world is an expression of hatred for a world that makes one suffer: the ressentiment of metaphysicians is here creative.⁴⁹`},
{t:'p',x:`But this deep and no doubt correct insight into a part of the appeal of Plato's arguments does not do justice to their complexity. Even for Nietzsche this would not have sufficed as an account of Plato's own self-understanding. Plato has argued that the difference between true value and everything else is precisely that it is not simply need-relative, that it is something that a being who had never experienced suffering or lack would still have reason to choose. We are fortunate enough to share with such beings this pure positive motivation, which is, to some extent, independent of our negative motivation. From within our human lives, even disregarding, for the moment, their pain, we have a deep and positive natural`},
{t:'pg',n:'162',h:`Plato: goodness without fragility?`},
{t:'p',x:`desire to get at something more perfect than the merely human. (It is fortunate indeed that we do have this desire; for if we did not we would not have some different good, we would just be cut off from the only good there is.⁵⁰) All of this, Plato would say, is actually a part of the human point of view, since the human being is by nature a being that seeks to transcend, through reason, its merely human limits. What Nietzsche leaves out is that mathematical, scientific, and philosophical reasoning are enormously beautiful and compelling to human souls: and not only to the soul of a mathematical genius like the young Theaetetus, but to the gentleman Glaucon; to Socrates; to every pupil who entered the Academy, over whose door stood (the story goes) the inscription 'Let no one enter here who does not pursue geometry'; to many of us, Plato believes, if we will think hard enough about what we really love. To Epicureans who viewed science and philosophy only as means of assuaging human pain, the Platonist Plutarch replied appropriately that they omit what Plato saw, the joy and pleasure of pure reasoning:`},
{t:'p',x:`> They push the pleasures of mathematics out the door. And yet... the pleasures of geometry and astronomy and harmonics have an intense and manifold lure, in no way less powerful than a love charm; they draw us to them using theorems as their magic spells... No man yet, on having intercourse with the woman he loves, has been so happy that he went out and sacrificed an ox; nor has anyone ever prayed to die on the spot if he could only have his fill of royal meat or cakes. But Eudoxus prayed to be consumed in flames like Phaethon if he could only stand next to the sun and ascertain the shape, size, and composition of the planets; and when Pythagoras discovered his theorem he sacrificed an ox, as Apollodorus records. (That Epicurus Makes a Pleasant Life Impossible, 1093D-1094B, trans. Einarson)⁵¹`},
{t:'p',x:`The blessed life, Plato insists, is also blessedly happy. It is not best because it is happy; it would be best quite apart from its happiness. But how wonderful it is that we pursue the best with such joy.`},
{t:'p',x:`If all this is true of us, Plato could now argue, then it may be not he himself, but these criticisms of his work that misrepresent the internal human viewpoint. What the imaginary objector does, Plato would say, is to simplify and flatten human moral psychology by omitting a longing that is in tension with many of the other things that we are and do. What some of Plato's contemporary interpreters do, as they reconstruct Plato's theory, is to ask, in a similar way, whether something acceptable to contemporary democratic humanism might be salvaged if we reject the unfashionable value-talk of the later books. But in doing this, though they may indeed render Plato's thought more palatable to the people who are, and were, Plato's audience, they conceal Plato's powerful defense of a more unsettling view which, as he is prepared to argue, is both more correct and answers more adequately to our deepest desires, the desires which fortunately link us to the true good. If he is right about the complexity of our nature - and I think he has at least a serious chance of being right - when we simplify and flatten Plato's arguments we are at the same time avoiding part of our own psychological complexity. There are a number of dangers in such a procedure. Some of these`},
{t:'pg',n:'163',h:`The Republic: true value and the standpoint of perfection`},
{t:'p',x:`are historical: we lose sight of some of Plato's views; we cease to understand the force of Aristotle's criticisms of Plato, since Plato will now look very much like Aristotle;⁵² we cease, too, to see why and how the *Phaedo* so deeply moved and influenced Kant. Equally deep are the philosophical dangers: by reducing Plato's position to a more familiar one, we lose the chance to work through and seriously examine a distinctive moral position that powerfully questions our own. But perhaps the deepest danger in a criticism that seeks to soften and humanize Plato is that we may, with its help, be encouraged to cease to see and feel what he saw and powerfully recorded, the humanness of denial and dissatisfaction, the depth of our human longing for something better than what we are. Plato would say that to cease to see and feel these things would be to cease, in some way, to be human. And it is striking that Nietzsche, anti-Platonist though he was, supports Plato's intuitions here. His description of the so-called 'last man' in *Zarathustra* predicts for the future of human morality in European bourgeois democracy the extinction of recognizable humanity, precisely through the extinction of the Platonic longing for self-transcendence. 'The time of the most despicable man is coming,' says Zarathustra, 'he that is no longer able to despise himself.' As one might expect, Zarathustra's audience, much like some of Plato's contemporary critics, ignored the fact that his speech was a praise of the 'great longing' and called out, 'Give us this last man'.⁵³`},
{t:'p',x:`*  *  *`},
{t:'p',x:`In the *Republic*, Plato answered questions about education and motivation by describing an ideal city in which the best possible education for objective rationality could be realized. It was crucial in this city that the 'turning round' of the soul begin 'straight from childhood' (519A), in order that the soul of the young citizen should be freed from the 'leaden weights' of the bodily pleasures that force its vision downward (519B). Plato also concludes, however, that this is a city that will never come into being; and he urges private individuals to aim at the life of the city without its supportive context (591E-592B). In less ideal circumstances, where we begin with adults who already have powerfully fettered souls, the educational and motivational process must be negative as much as positive: it must strike off the lead weights as well as inspiring the soul to look aloft. To commend his account of true non-pain-relative value to democratic readers (ancient or modern), the philosopher, ironically, will need to appeal to their sense of pain and constraint, permitting them to use the pain of the lead weights as a reason for the choice to throw them off. This does not make philosophy itself pain-relative, little more than a convalescence: for it would still be valuable from anywhere in the universe, and to any rational soul at all, regardless of pain. But we must be made conscious of our pain before we can be brought to a point at which we are ready to pursue a way of life that involves giving up, or radically revising, much that we now value.`},
{t:'p',x:`All of our appetites are lead weights. But we can have no doubt about which,`},
{t:'pg',n:'164',h:`Plato: goodness without fragility?`},
{t:'p',x:`for Plato, is the heaviest. Sexual desire, the 'chief officer' of the appetites and 'tyrant' of the soul, is singled out again and again. The job of freeing us from the burden of sexual longing and its associated loves of mutable individual persons will be a complicated and difficult one. The therapeutic philosopher will need here above all to work with negative as well as positive appeals, in order to counter the strength of our interest.⁵⁴`}

  ]
};

/* ---------------- text helpers ---------------- */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
var WORD_RE = /[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ'’\-]*/g;
function wordize(text){
  var out = '', last = 0, m; WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    out += '<span class="w" data-w="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function bodyHtml(t){ return state.dict ? wordize(t) : esc(t); }

var ABBR_RE = /(?:^|[\s(])(?:cf|i\.e|e\.g|etc|Ch|Chs|n|no|nos|vs|Mr|Mrs|Ms|Dr|St|p|pp|esp|Prof|viz|al|ed|eds|trans|fig|vol)\.$/i;
function splitSentences(text){
  var out = [], start = 0, i, j, k;
  for (i = 0; i < text.length; i++) {
    var c = text.charAt(i);
    if (c !== '.' && c !== '!' && c !== '?') continue;
    j = i + 1;

/* Bookmarks and highlights live together under one key.

function probeStorage(){
  try {
    var k = STORE + ':probe';
    window.localStorage.setItem(k, '1');
    var ok = window.localStorage.getItem(k) === '1';
    window.localStorage.removeItem(k);

  var nb = ARTICLE.blocks.length;
  var b = Array.isArray(data && data.b) ? data.b : [];
  var h = Array.isArray(data && data.h) ? data.h : [];
  return {
    b: b.filter(function(n){ return typeof n === 'number' && n >= 0 && n < nb; }),
    h: h.filter(function(x){
         return x && typeof x.b === 'number' && typeof x.s === 'number' &&
                typeof x.a === 'number' && typeof x.z === 'number' &&
                x.z > x.a && DISP[x.b] && typeof DISP[x.b][x.s] === 'string' &&
                x.z <= DISP[x.b][x.s].length;
       }).map(function(x){

/* Cut the sentence at every highlight and italic boundary, then decide the
   wrappers segment by segment. Doing it this way keeps overlapping bands legal:

function segHtml(text, hs, its){
  var cuts = [0, text.length];
  hs.forEach(function(h){ cuts.push(h.a, h.z); });
  its.forEach(function(r){ cuts.push(r[0], r[1]); });
  cuts = cuts.filter(function(v){ return v >= 0 && v <= text.length; })
             .sort(function(a, b){ return a - b; })
             .filter(function(v, i, a){ return i === 0 || v !== a[i - 1]; });

  var out = '';
  for (var i = 0; i < cuts.length - 1; i++) {
    var p = cuts[i], q = cuts[i + 1];
    if (q <= p) continue;
    var color = null;
    for (var j = 0; j < hs.length; j++) if (hs[j].a <= p && hs[j].z >= q) { color = hs[j].c; break; }
    var ital = false;
    for (var k = 0; k < its.length; k++) if (its[k][0] <= p && its[k][1] >= q) { ital = true; break; }
    var piece = bodyHtml(text.slice(p, q));
    if (ital)  piece = '<em>' + piece + '</em>';

/* ---------------- API ---------------- */
function callApi(model, payload){
  var url = API_ROOT + model + ':generateContent?key=' + API_KEY, tries = 0;
  function attempt(){
    tries++;
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
      .catch(function(e){
        throw new Error('Network blocked (' + (e && e.message ? e.message : 'fetch failed') +
          '). Run this inside Gemini Canvas, or set API_KEY at the top of the script.');
      })
      .then(function(res){
        if ((res.status === 429 || res.status >= 500) && tries < 4) {
          return new Promise(function(r){ setTimeout(r, Math.pow(2, tries) * 400); }).then(attempt);
        }
        if (!res.ok) return res.text().then(function(t){
          throw new Error('API ' + res.status + (t ? ' · ' + t.slice(0, 110) : ''));
        });
        return res.json();
      });
  }
  return attempt();
}

/* Walk a role's candidate list until one model answers. Only a "this model is
   gone" style refusal advances the list — a genuine payload error still throws,
   so a real bug is never hidden behind a retry. */
var MODEL_OK = {};
var DEAD_RE = /API 404|no longer available|not found|is not supported|NOT_FOUND/i;
function callModel(role, candidates, payload){
  var list = MODEL_OK[role] ? [MODEL_OK[role]] : candidates.slice();
  var i = 0;
  function tryNext(){
    var model = list[i];
    return callApi(model, payload).then(function(json){
      MODEL_OK[role] = model;
      return json;
    }).catch(function(err){
      if (i < list.length - 1 && DEAD_RE.test(String(err && err.message))) { i++; return tryNext(); }
      throw err;
    });
  }
  return tryNext();
}

/* Collins COBUILD-style lookup.
   Two layers, always: ① the general dictionary entry, ② what it means right here.
   The cache key carries the context, because the same word in a different
   paragraph must not reuse the earlier contextual reading. */
function explain(target, context){
  var key = target.toLowerCase().trim() + '‖' + context.slice(0, 120);
  if (explainCache.has(key)) return explainCache.get(key);

  var prompt =
    'You are a lexicographer writing in the style of the Collins COBUILD English Dictionary,\n' +
    'helping an intermediate learner read a demanding text.\n\n' +
    'HOUSE STYLE — follow all of it:\n' +
    '• Definitions are FULL SENTENCES that show the word in its own grammar, never bare synonyms.\n' +
    '    verb   → "If you abandon a place or person, you leave them permanently."\n' +
    '    noun   → "A vine is a plant that grows up or over things."\n' +
    '    adj    → "If something is fragile, it is easily broken or damaged."\n' +
    '• Keep the wording within the ordinary defining vocabulary — plain, common words only (CEFR A2-B1).\n' +
    '• Write in English only. No other language anywhere in the output.\n\n' +
    'SELECTED TEXT:\n"""' + target.slice(0, 1200) + '"""\n\n' +
    (context ? 'THE PASSAGE IT APPEARS IN:\n"""' + context.slice(0, 1400) + '"""\n\n'
             : 'No surrounding passage was given.\n\n') +
    'Return these fields:\n' +
    'type       — word | phrase | clause | sentence.\n' +
    'headword   — For a word or short phrase, the dictionary base form (grows→grow, keepers→keeper).\n' +
    '             Leave empty for a clause or sentence.\n' +
    'inflection — How the selected form relates to the headword ("3rd person singular", "plural",\n' +
    '             "past participle"). Empty if the selection is already the base form, or not a word.\n' +
    'frequency  — Collins-style band, 5 = among the most common English words, 1 = rare,\n' +
    '             0 = not applicable (clause or sentence). Integer.\n' +
    'grammar    — Collins pattern tag for how it is used HERE: "[VERB noun]", "[usually PASSIVE]",\n' +
    '             "[ADJ noun]", "[V n prep]". Empty if not applicable.\n' +
    'register   — Tone or usage label only if one genuinely applies: formal, informal, literary,\n' +
    '             technical, old-fashioned, disapproval, emphasis. Otherwise empty.\n' +
    'general    — For a word or phrase: the full-sentence COBUILD definition of the sense used here.\n' +
    '             For a clause or sentence: a plain-English paraphrase of the whole thing.\n' +
    '             Max 35 words.\n' +
    'example    — One natural sentence of your own showing typical everyday usage, in the style of a\n' +
    '             corpus citation. It must NOT be copied from the passage above. Empty for a sentence.\n' +
    'contextual — What it actually means in THIS passage: the specific sense, what it refers back to,\n' +
    '             and the writer\'s point in using it. Max 35 words.';

  var p = callModel('text', TEXT_MODELS, {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig:{
      temperature:0.2,
      responseMimeType:'application/json',
      responseSchema:{
        type:'OBJECT',
        properties:{
          type:{type:'STRING'}, headword:{type:'STRING'}, inflection:{type:'STRING'},
          frequency:{type:'INTEGER'}, grammar:{type:'STRING'}, register:{type:'STRING'},
          general:{type:'STRING'}, example:{type:'STRING'}, contextual:{type:'STRING'}
        },
        required:['type','headword','inflection','frequency','grammar','register','general','example','contextual']
      }
    }
  }).then(function(json){
    var raw = '';
    try { raw = json.candidates[0].content.parts[0].text; } catch (e) { raw = ''; }
    if (!raw) throw new Error('Empty response');
    var d = JSON.parse(raw);
    var f = parseInt(d.frequency, 10);
    return {
      type:       d.type       || '',
      headword:   d.headword   || '',
      inflection: d.inflection || '',
      frequency:  (isNaN(f) || f < 0) ? 0 : Math.min(f, 5),
      grammar:    d.grammar    || '',
      register:   d.register   || '',
      general:    d.general    || '',
      example:    d.example    || '',
      contextual: d.contextual || ''
    };
  }).catch(function(err){ explainCache.delete(key); throw err; });

  explainCache.set(key, p);
  return p;
}

  var len = pcm.length, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
  function s(o, str){ for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
  s(0,'RIFF');  v.setUint32(4, 36 + len, true);  s(8,'WAVE');
  s(12,'fmt '); v.setUint32(16, 16, true);       v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);                      v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true);               v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);                     s(36,'data');
  v.setUint32(40, len, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type:'audio/wav' });
}
function fetchAudio(text){
  var key = state.ttsModel + '|' + text;
  if (audioCache.has(key)) return audioCache.get(key);
  var p = callModel('tts-' + state.ttsModel, TTS_MODELS[state.ttsModel], {
    contents:[{ parts:[{ text: TTS_STYLE + text }] }],
    generationConfig:{
      responseModalities:['AUDIO'],
      speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName: VOICE } } }
    }
  }).then(function(json){
    var part;
    try { part = json.candidates[0].content.parts[0].inlineData; } catch (e) { part = null; }
    if (!part || !part.data) throw new Error('No audio returned');
    var rm = /rate=(\d+)/.exec(part.mimeType || '');
    return URL.createObjectURL(pcmToWav(b64ToBytes(part.data), rm ? parseInt(rm[1], 10) : 24000));
  }).catch(function(err){ audioCache.delete(key); throw err; });
  audioCache.set(key, p);
  return p;
}

/* ---------------- playback ---------------- */
function scrollToUnit(u){
  var el = appEl.querySelector('.s[data-b="' + u.b + '"][data-s="' + u.s0 + '"]');
  if (!el) return;
  var r = el.getBoundingClientRect();
  if (r.top < 130 || r.bottom > window.innerHeight - 40) {
    window.scrollTo({ top: window.scrollY + r.top - 180, behavior:'smooth' });
  }
}
function fail(err){
  state.status = 'error'; state.playing = false;
  state.message = String(err && err.message ? err.message : err).slice(0, 90);
  paintPlayer();
}
function playUnit(i){
  if (i < 0) i = 0;
  if (i >= UNITS.length) { audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer(); return; }
  state.mode = 'article'; state.unit = i; state.status = 'loading'; state.playing = true;
  paintPlayer(); paintHighlight();
  fetchAudio(UNITS[i].text).then(function(url){
    if (state.unit !== i || state.mode !== 'article' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){
      state.status = 'playing'; paintPlayer(); scrollToUnit(UNITS[i]);
      if (i + 1 < UNITS.length) fetchAudio(UNITS[i + 1].text).catch(function(){});
    });
  }).catch(fail);
}
function speak(text){
  text = cleanTts(text).slice(0, SEL_MAX);
  if (!text) return;
  audioEl.pause();
  state.mode = 'sel'; state.playing = true; state.status = 'loading';
  paintPlayer(); paintHighlight();
  fetchAudio(text).then(function(url){
    if (state.mode !== 'sel' || !state.playing) return;
    audioEl.src = url;
    return audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); });
  }).catch(fail);
}
function togglePlay(){
  if (state.playing) { audioEl.pause(); state.playing = false; state.status = 'paused'; paintPlayer(); return; }
  if (audioEl.src && audioEl.currentTime > 0 && !audioEl.ended) {
    state.playing = true;
    audioEl.play().then(function(){ state.status = 'playing'; paintPlayer(); })
                  .catch(function(){ state.playing = false; state.status = 'ready'; paintPlayer(); });
    return;
  }
  playUnit(state.unit < 0 ? 0 : state.unit);
}
audioEl.addEventListener('ended', function(){
  if (!state.playing) return;
  if (state.mode === 'sel') { state.playing = false; state.mode = 'article'; state.status = 'ready'; paintPlayer(); paintHighlight(); }
  else playUnit(state.unit + 1);
});

/* ---------------- popovers ---------------- */
function place(el, rect){
  el.style.left = '0px'; el.style.top = '0px';
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  var top  = rect.top - h - 12;
  if (top < 112) top = rect.bottom + 12;
  if (top + h > window.innerHeight - 8) top = Math.max(112, window.innerHeight - h - 8);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function hideSelbar(){ selbar.classList.remove('open'); }
function hideTip(){
  tipEl.classList.remove('open'); state.tip = null;
  if (activeWord) { activeWord.classList.remove('on'); activeWord = null; }
}
function findBlockOf(term){
  var t = term.toLowerCase();
  for (var i = 0; i < ARTICLE.blocks.length; i++) {
    if (blockText(i).toLowerCase().indexOf(t) > -1) return i;
  }
  return -1;
}
function actsHtml(hasFind){
  return '<div class="acts"><button data-action="tip-play">' + esc(UI.listen) + '</button>' +
    (hasFind ? '<button data-action="tip-find">' + esc(UI.findInText) + '</button>' : '') + '</div>';
}
function freqHtml(n){
  if (!n) return '';
  var out = '<span class="freq" title="' + esc(UI.freqLabel) + '">';
  for (var i = 1; i <= 5; i++) out += '<i' + (i <= n ? ' class="on"' : '') + '></i>';
  return out + '</span>';
}

/* headword → inflection → tags → ① dictionary meaning (+ usage example)
   → ② meaning in this passage → actions */
function entryHtml(head, d, hasFind){
  var isLong = d.type === 'clause' || d.type === 'sentence';
  var title  = (!isLong && d.headword) ? d.headword : head;

  var tags = '';
  if (d.type)     tags += '<span class="chip">' + esc(d.type) + '</span>';
  if (d.grammar)  tags += '<span class="chip gram">' + esc(d.grammar) + '</span>';
  if (d.register) tags += '<span class="chip reg">' + esc(d.register) + '</span>';
  tags += freqHtml(d.frequency);

  var h = '<div class="hw">' + esc(title) + '</div>';
  if (!isLong && d.headword && d.headword.toLowerCase() !== head.toLowerCase()) {
    h += '<div class="infl">' + esc(head) + (d.inflection ? ' · ' + esc(d.inflection) : '') + '</div>';
  } else if (d.inflection) {
    h += '<div class="infl">' + esc(d.inflection) + '</div>';
  }
  if (tags) h += '<div class="tags">' + tags + '</div>';

  if (d.general) {
    h += '<div class="sec first"><div class="lbl">' +
         esc(isLong ? UI.dictParaphrase : UI.dictGeneral) + '</div>' +
         '<div class="en">' + esc(d.general) + '</div>' +
         (d.example ? '<div class="ex">' + esc(d.example) + '</div>' : '') + '</div>';
  }
  if (d.contextual) {
    h += '<div class="sec' + (d.general ? '' : ' first') + '"><div class="lbl">' +
         esc(UI.dictContextual) + '</div><div class="why">' + esc(d.contextual) + '</div></div>';
  }
  return h + actsHtml(hasFind);
}

function showTip(target, context, rect, anchorEl){
  if (activeWord && activeWord !== anchorEl) activeWord.classList.remove('on');
  activeWord = anchorEl || null;
  if (activeWord) activeWord.classList.add('on');

  var hit = findBlockOf(target);
  state.tip = { text:target, block:hit, rect:rect };
  anchorY = window.scrollY;

  var head = target.length > 90 ? target.slice(0, 90) + '…' : target;
  tipEl.classList.add('open');
  tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="load">' + esc(UI.explaining) + '</div>';
  place(tipEl, rect);

  /* Prefer the block the reader actually touched. `hit` is only the FIRST
     occurrence in the text, so it is a fallback for search-box lookups. */
  var ctx = context || (hit > -1 ? blockText(hit) : '');

  explain(target, ctx).then(function(d){
    if (!tipEl.classList.contains('open') || !state.tip || state.tip.text !== target) return;
    tipEl.innerHTML = entryHtml(head, d, hit > -1);
    place(tipEl, rect);
  }).catch(function(err){
    if (!tipEl.classList.contains('open') || !state.tip || state.tip.text !== target) return;
    tipEl.innerHTML = '<div class="hw">' + esc(head) + '</div><div class="err">' +
      esc(String(err.message || err).slice(0, 140)) + '</div>' + actsHtml(hit > -1);
    place(tipEl, rect);
  });
}
function flashFind(bi, term){
  var t = term.toLowerCase(), target = null;
  var spans = appEl.querySelectorAll('.s[data-b="' + bi + '"]');
  for (var i = 0; i < spans.length; i++) {
    if (spans[i].textContent.toLowerCase().indexOf(t) > -1) { target = spans[i]; break; }
  }
  if (!target) target = spans[0];
  if (!target) return;
  window.scrollTo({ top: window.scrollY + target.getBoundingClientRect().top - 170, behavior:'smooth' });
  clearTimeout(foundTimer);
  var old = appEl.querySelectorAll('.s.found');
  for (var j = 0; j < old.length; j++) old[j].classList.remove('found');
  target.classList.add('found');
  foundTimer = setTimeout(function(){ target.classList.remove('found'); }, 2200);
}
function evalSelection(){
  var sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelbar(); return; }
  var text = sel.toString().replace(/\s+/g, ' ').trim();
  if (!text) { hideSelbar(); return; }
  var node = sel.anchorNode, el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
  if (!el || !appEl.contains(el)) { hideSelbar(); return; }
  var blk = el.closest ? el.closest('.blk') : null;
  state.sel = { text:text, ctx: blk ? blockText(Number(blk.getAttribute('data-b'))) : '' };
  hideTip();
  anchorY = window.scrollY;
  document.getElementById('selErase').style.display = selectionHasHighlight() ? '' : 'none';
  selbar.classList.add('open');
  place(selbar, sel.getRangeAt(0).getBoundingClientRect());
}

/* ---------------- bookmarks ---------------- */
function topVisibleBlock(){
  var els = appEl.querySelectorAll('.blk');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getBoundingClientRect().bottom > 140) return Number(els[i].getAttribute('data-b'));
  }
  return 0;
}
function addBookmark(){
  var bi = (state.mode === 'article' && state.playing && state.unit >= 0) ? UNITS[state.unit].b : topVisibleBlock();
  if (state.bookmarks.indexOf(bi) === -1) {
    state.bookmarks.push(bi);
    state.bookmarks.sort(function(a, b){ return a - b; });
    saveAll();
  }
  paintPanel();
}
function jumpToBlock(bi){
  var el = appEl.querySelector('.blk[data-b="' + bi + '"]');
  if (el) window.scrollTo({ top: window.scrollY + el.getBoundingClientRect().top - 140, behavior:'smooth' });
}

/* ---------------- events (delegated once) ---------------- */
selbar.addEventListener('mousedown', function(ev){ ev.preventDefault(); }, false);
tipEl.addEventListener('mousedown', function(ev){ ev.preventDefault(); }, false);

document.getElementById('searchForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var term = (qEl.value || '').replace(/\s+/g, ' ').trim();
  if (!term) return;
  hideSelbar(); qEl.blur();
  showTip(term, '', qEl.getBoundingClientRect(), null);
}, false);

document.addEventListener('click', function(ev){
  var t = ev.target, act = t.closest ? t.closest('[data-action]') : null;

  if (!act) {
    var w = t.closest ? t.closest('.w') : null;
    if (w && state.dict && appEl.contains(w)) {
      var blk = w.closest('.blk');
      showTip(w.getAttribute('data-w'), blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
              w.getBoundingClientRect(), w);
      return;
    }
    if (!tipEl.contains(t)) hideTip();
    if (!panelEl.contains(t)) { state.panelOpen = false; paintPanel(); }
    return;
  }

  var a = act.getAttribute('data-action');
  if (a === 'dict') {
    state.dict = !state.dict;
    dictEl.setAttribute('aria-pressed', state.dict ? 'true' : 'false');
    document.body.classList.toggle('dict', state.dict);
    hideTip(); renderArticle();
  }
  else if (a === 'panel')  { state.panelOpen = !state.panelOpen; paintPanel(); }
  else if (a === 'bm-add') { addBookmark(); }
  else if (a === 'bm-del') {
    ev.stopPropagation();
    var di = Number(act.getAttribute('data-i'));
    state.bookmarks = state.bookmarks.filter(function(x){ return x !== di; });
    saveAll(); paintPanel();
  }
  else if (a === 'bm-go') {
    jumpToBlock(Number(act.getAttribute('data-i')));
    state.panelOpen = false; paintPanel();
  }
  else if (a === 'hl')       { highlightSelection(act.getAttribute('data-c')); }
  else if (a === 'hl-erase') { highlightSelection(null); }
  else if (a === 'hl-del') {
    ev.stopPropagation();
    state.highlights.splice(Number(act.getAttribute('data-i')), 1);
    saveAll(); renderArticle(); paintPanel();
  }
  else if (a === 'hl-go') {
    var hx = state.highlights[Number(act.getAttribute('data-i'))];
    if (hx) { state.panelOpen = false; paintPanel(); jumpToBlock(hx.b); }
  }
  else if (a === 'bak')      { state.bakOpen = !state.bakOpen; paintPanel(); }
  else if (a === 'bak-copy') {
    var box = document.getElementById('bakBox');
    box.value = exportText(); box.select(); box.setSelectionRange(0, box.value.length);
    var done = function(){ act.textContent = UI.copied; setTimeout(function(){ act.textContent = UI.copy; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(done, function(){ try { document.execCommand('copy'); done(); } catch (e) {} });
    } else { try { document.execCommand('copy'); done(); } catch (e) {} }
  }
  else if (a === 'bak-restore') {
    var ok = importText(document.getElementById('bakBox').value);
    act.textContent = ok ? UI.restored : UI.badBackup;
    if (ok) { renderArticle(); state.bakOpen = true; setTimeout(paintPanel, 900); }
    else setTimeout(function(){ act.textContent = UI.restore; }, 2000);
  }
  else if (a === 'play') togglePlay();
  else if (a === 'prev') playUnit(state.unit <= 0 ? 0 : state.unit - 1);
  else if (a === 'next') playUnit(state.unit + 1);
  else if (a === 'sel-explain') {
    if (!state.sel) return;
    var r = selbar.getBoundingClientRect(); hideSelbar();
    showTip(state.sel.text, state.sel.ctx, r, null);
  }
  else if (a === 'sel-play')  { hideSelbar(); if (state.sel) speak(state.sel.text); }
  else if (a === 'tip-play')  { if (state.tip) speak(state.tip.text); }
  else if (a === 'tip-find')  {
    if (state.tip && state.tip.block > -1) { var tt = state.tip; hideTip(); flashFind(tt.block, tt.text); }
  }
}, false);

document.addEventListener('change', function(ev){
  var act = ev.target.closest ? ev.target.closest('[data-action]') : null;
  if (!act) return;
  var a = act.getAttribute('data-action');
  if (a === 'model') {
    state.ttsModel = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready'; paintPlayer();
  } else if (a === 'gran') {
    var at = (state.unit >= 0 && UNITS[state.unit]) ? UNITS[state.unit].b : -1;
    state.gran = act.value;
    audioEl.pause(); state.playing = false; state.status = 'ready';
    buildUnits(); state.unit = -1;
    if (at >= 0) for (var i = 0; i < UNITS.length; i++) if (UNITS[i].b === at) { state.unit = i; break; }
    paintPlayer(); paintHighlight();
  }
}, false);

appEl.addEventListener('mouseover', function(ev){
  if (!state.dict || !CAN_HOVER) return;
  var el = ev.target.closest ? ev.target.closest('.w') : null;
  if (!el) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(function(){
    var s = window.getSelection ? window.getSelection() : null;
    if (s && !s.isCollapsed) return;
    var blk = el.closest('.blk');
    showTip(el.getAttribute('data-w'), blk ? blockText(Number(blk.getAttribute('data-b'))) : '',
            el.getBoundingClientRect(), el);
  }, 340);
}, false);
appEl.addEventListener('mouseout', function(){ clearTimeout(hoverTimer); }, false);

document.addEventListener('selectionchange', function(){
  clearTimeout(selTimer);
  selTimer = setTimeout(evalSelection, 280);
}, false);

document.addEventListener('keydown', function(ev){
  if (ev.target && ev.target.id === 'q') {
    if (ev.key === 'Escape') { ev.target.value = ''; ev.target.blur(); hideTip(); }
    return;
  }
  if (ev.key === 'Escape') { hideTip(); hideSelbar(); state.panelOpen = false; paintPanel(); }
}, false);

/* Popovers survive the small scroll a touch drag causes. */
window.addEventListener('scroll', function(){
  if (Math.abs(window.scrollY - anchorY) < SCROLL_TOL) return;
  if (tipEl.classList.contains('open')) hideTip();
  if (selbar.classList.contains('open')) hideSelbar();
}, { passive:true });

window.addEventListener('resize', function(){ hideTip(); hideSelbar(); }, { passive:true });

/* ---------------- boot ---------------- */
function applyStrings(){
  document.title = ARTICLE.title;
  document.getElementById('brand').textContent = ARTICLE.kicker + ' · ' + ARTICLE.title;
  qEl.placeholder = UI.searchPlaceholder;
  document.getElementById('qBtn').setAttribute('aria-label', UI.searchLabel);
  dictEl.textContent = UI.dictionary;
  dictEl.title = UI.dictionaryHint;
  document.getElementById('bmBtn').setAttribute('aria-label', UI.bookmarks);
  document.getElementById('bmBtn').title = UI.bookmarks;
  document.querySelector('[data-action="prev"]').title = UI.prev;
  document.querySelector('[data-action="next"]').title = UI.next;
  document.getElementById('selExplain').textContent = UI.explain;
  document.getElementById('selPlay').textContent = UI.listen;
  document.getElementById('selErase').title = UI.eraseHighlight;
  var dots = selbar.querySelectorAll('[data-action="hl"]');
  for (var i = 0; i < dots.length; i++) dots[i].title = UI.highlight;
  document.getElementById('voicetag').textContent = VOICE;
  document.getElementById('ns').textContent = UI.noscript;
  document.getElementById('granSel').innerHTML =
    '<option value="sent">' + esc(UI.unitSentence) + '</option><option value="para">' + esc(UI.unitParagraph) + '</option>';
  document.getElementById('modelSel').innerHTML =
    '<option value="flash">' + esc(UI.modelFlash) + '</option><option value="pro">' + esc(UI.modelPro) + '</option>';
}

applyStrings();
buildSents();          /* DISP must exist before saved marks are validated */
buildUnits();
STORAGE_OK = probeStorage();
loadAll();
sortHighlights();
renderArticle();
paintPlayer();
paintPanel();

})();
</script>
