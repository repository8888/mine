<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf8; --ink:#1c1b19; --ink-faint:#9c9891; --accent:#8a6f4e;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:96px 24px;}
  h1{font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 40px;}
  ul{list-style:none;margin:0;padding:0;}
  li{margin:0 0 28px;}
  a{color:inherit;text-decoration:none;font-size:22px;line-height:1.3;}
  a:hover{color:var(--accent);}
  .src{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .empty{font-family:var(--sans);font-size:13px;color:var(--ink-faint);}
  @media (max-width:520px){ .wrap{padding:56px 16px;} a{font-size:20px;} }
</style>
</head>
<body>

<div class="wrap">
  <h1>Reading</h1>
  <main id="app">
    <noscript><p class="empty">This page needs JavaScript.</p></noscript>
  </main>
</div>

<script>
'use strict';
(function () {

/* READERS — one object per reader file in this repository, newest first.
     file   : file name (same folder as index.html)
     title  : title shown in the list
     source : author · year (optional) */
var READERS = [
  { file:'tyranny-of-convenience-reader.html', title:'The Tyranny of Convenience', source:'Tim Wu · 2018' }
];

/* ══════════════════ nothing below needs editing ══════════════════ */

var state = { readers: READERS };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function itemHtml(r){
  return '<li><a href="' + esc(encodeURI(r.file)) + '">' + esc(r.title) + '</a>' +
         (r.source ? '<span class="src">' + esc(r.source) + '</span>' : '') + '</li>';
}

function render(){
  document.getElementById('app').innerHTML = state.readers.length
    ? '<ul>' + state.readers.map(itemHtml).join('') + '</ul>'
    : '<p class="empty">No readers yet.</p>';
}

render();

})();
</script>
</body>
</html>
