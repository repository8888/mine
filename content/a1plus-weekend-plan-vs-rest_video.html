            script: [{"id": "v1", "speaker": "Marie", "kor": "Bonjour à tous ! Bienvenue dans « Parlons français facile ». Moi, c'est Marie.", "time": [0.0, 6.22], "eng": "Hello everyone! Welcome to 'Parlons français facile'. I'm Marie.", "ko": "여러분 안녕하세요! <쉬운 프랑스어로 이야기해 봐요>에 오신 걸 환영해요. 저는 마리예요."}, {"id": "v2", "speaker": "Léo", "kor": "Bonjour... Moi, c'est Léo.", "time": [6.25, 11.32], "eng": "Hello... I'm Léo.", "ko": "안녕하세요... 저는 레오예요."}, {"id": "v3", "speaker": "Léo", "kor": "Demain, c'est samedi ! Je suis trop content !", "time": [12.55, 16.82], "eng": "Tomorrow is Saturday! I'm so happy!", "ko": "내일은 토요일이에요! 저 너무 좋아요!"}, {"id": "v4", "speaker": "Marie", "kor": "Moi aussi ! Je vais préparer mon week-end.", "time": [16.85, 20.64], "eng": "Me too! I'm going to plan my weekend.", "ko": "나도! 나는 내 주말을 준비할 거야."}, {"id": "v5", "speaker": "Marie", "kor": "'préparer' means 'to prepare'.", "time": [20.67, 24.02], "eng": "'préparer' means 'to prepare'.", "ko": "'préparer'는 '준비하다'라는 뜻이에요."}, {"id": "v6", "speaker": "Léo", "kor": "Préparer le week-end ? Pourquoi ?", "time": [24.05, 27.24], "eng": "Plan the weekend? Why?", "ko": "주말을 준비한다고? 왜?"}, {"id": "v7", "speaker": "Marie", "kor": "J'ai un super programme !", "time": [27.27, 29.656], "eng": "I have a great schedule!", "ko": "나 엄청 좋은 계획표가 있거든!"}, {"id": "v8", "speaker": "Marie", "kor": "Samedi matin, je vais au café avec une amie.", "time": [29.686, 32.709], "eng": "Saturday morning, I'm going to a café with a friend.", "ko": "토요일 아침에 친구랑 카페에 갈 거야."}, {"id": "v9", "speaker": "Marie", "kor": "Samedi après-midi, je vais au musée.", "time": [32.739, 35.52], "eng": "Saturday afternoon, I'm going to the museum.", "ko": "토요일 오후에는 박물관에 갈 거야."}, {"id": "v10", "speaker": "Marie", "kor": "'un programme' means 'a schedule or plan',", "time": [35.55, 39.739], "eng": "'un programme' means 'a schedule or plan',", "ko": "'un programme'은 '계획표, 일정'이라는 뜻이고,"}, {"id": "v11", "speaker": "Marie", "kor": "and 'le musée' means 'the museum'.", "time": [39.769, 43.34], "eng": "and 'le musée' means 'the museum'.", "ko": "'le musée'는 '박물관'이라는 뜻이에요."}, {"id": "v12", "speaker": "Léo", "kor": "Quoi ?! Tu vas faire tout ça ?", "time": [43.49, 46.769], "eng": "What?! You're going to do all that?", "ko": "뭐?! 너 그걸 다 할 거야?"}, {"id": "v13", "speaker": "Léo", "kor": "Tu es un robot, Marie !", "time": [46.799, 48.884], "eng": "You're a robot, Marie!", "ko": "너 로봇이야, 마리!"}, {"id": "v14", "speaker": "Marie", "kor": "Non, je ne suis pas un robot.", "time": [48.914, 52.918], "eng": "No, I'm not a robot.", "ko": "아니, 나 로봇 아니야."}, {"id": "v15", "speaker": "Marie", "kor": "J'aime sortir le week-end !", "time": [52.948, 55.2], "eng": "I like going out on the weekend!", "ko": "나는 주말에 밖에 나가는 걸 좋아해!"}, {"id": "v16", "speaker": "Marie", "kor": "'sortir' means 'to go out'.", "time": [55.23, 57.55], "eng": "'sortir' means 'to go out'.", "ko": "'sortir'는 '외출하다, 밖에 나가다'라는 뜻이에요."}, {"id": "v17", "speaker": "Léo", "kor": "Moi, je suis fatigué après le travail.", "time": [57.58, 62.163], "eng": "I'm tired after work.", "ko": "나는 일 끝나고 나면 피곤해."}, {"id": "v18", "speaker": "Léo", "kor": "Je ne veux pas sortir !", "time": [62.193, 64.24], "eng": "I don't want to go out!", "ko": "나는 밖에 나가기 싫어!"}, {"id": "v19", "speaker": "Léo", "kor": "'fatigué' means 'tired'.", "time": [64.27, 67.17], "eng": "'fatigué' means 'tired'.", "ko": "'fatigué'는 '피곤한'이라는 뜻이에요."}, {"id": "v20", "speaker": "Marie", "kor": "Alors, tu fais quoi ce week-end ?", "time": [67.2, 69.085], "eng": "So, what are you doing this weekend?", "ko": "그럼 너 이번 주말에 뭐 해?"}, {"id": "v21", "speaker": "Léo", "kor": "Je vais rester à la maison pendant deux jours !", "time": [69.115, 73.185], "eng": "I'm going to stay home for two days!", "ko": "나는 이틀 동안 집에 있을 거야!"}, {"id": "v22", "speaker": "Marie", "kor": "Quoi ?", "time": [73.215, 73.984], "eng": "What?", "ko": "뭐라고?"}, {"id": "v23", "speaker": "Léo", "kor": "C'est un week-end parfait !", "time": [74.014, 76.22], "eng": "It's a perfect weekend!", "ko": "그게 완벽한 주말이지!"}, {"id": "v24", "speaker": "Léo", "kor": "'rester' means 'to stay'.", "time": [76.25, 79.32], "eng": "'rester' means 'to stay'.", "ko": "'rester'는 '머무르다, 남아 있다'라는 뜻이에요."}, {"id": "v25", "speaker": "Marie", "kor": "Deux jours à la maison ?", "time": [79.35, 81.471], "eng": "Two days at home?", "ko": "이틀 동안 집에?"}, {"id": "v26", "speaker": "Marie", "kor": "Tu ne vas pas sortir ?", "time": [81.501, 82.915], "eng": "You're not going to go out?", "ko": "밖에 안 나갈 거야?"}, {"id": "v27", "speaker": "Léo", "kor": "Non ! Vendredi soir, je mets mon pyjama.", "time": [82.945, 87.141], "eng": "No! Friday night, I put on my pajamas.", "ko": "응! 금요일 밤에 잠옷을 입어."}, {"id": "v28", "speaker": "Léo", "kor": "Et lundi matin, je change de vêtements !", "time": [87.171, 90.64], "eng": "And Monday morning, I change clothes!", "ko": "그리고 월요일 아침에 옷을 갈아입어!"}, {"id": "v29", "speaker": "Léo", "kor": "'le pyjama' means 'the pajamas'.", "time": [90.67, 94.46], "eng": "'le pyjama' means 'the pajamas'.", "ko": "'le pyjama'는 '잠옷'이라는 뜻이에요."}, {"id": "v30", "speaker": "Marie", "kor": "Oh là là... Tu ne sors jamais ?", "time": [94.49, 99.16], "eng": "Oh dear... You never go out?", "ko": "어휴... 너 절대 안 나가?"}, {"id": "v31", "speaker": "Léo", "kor": "Mon canapé, c'est mon château !", "time": [99.19, 102.386], "eng": "My sofa is my castle!", "ko": "내 소파가 내 성이야!"}, {"id": "v32", "speaker": "Léo", "kor": "Je veux me reposer sur mon canapé.", "time": [102.416, 105.14], "eng": "I want to rest on my sofa.", "ko": "나는 소파에서 쉬고 싶어."}, {"id": "v33", "speaker": "Léo", "kor": "'le canapé' means 'the sofa',", "time": [105.17, 107.964], "eng": "'le canapé' means 'the sofa',", "ko": "'le canapé'는 '소파'라는 뜻이고,"}, {"id": "v34", "speaker": "Léo", "kor": "and 'se reposer' means 'to rest'.", "time": [107.994, 111.22], "eng": "and 'se reposer' means 'to rest'.", "ko": "'se reposer'는 '쉬다, 휴식하다'라는 뜻이에요."}, {"id": "v35", "speaker": "Marie", "kor": "Léo, tu ne te reposes pas vraiment.", "time": [111.25, 113.986], "eng": "Léo, you're not really resting.", "ko": "레오, 너 진짜 쉬는 게 아니잖아."}, {"id": "v36", "speaker": "Marie", "kor": "Dimanche dernier, tu as regardé des vidéos de chats pendant six heures !", "time": [114.016, 118.533], "eng": "Last Sunday, you watched cat videos for six hours!", "ko": "지난 일요일에 너 6시간 동안 고양이 영상만 봤잖아!"}, {"id": "v37", "speaker": "Léo", "kor": "Euh...", "time": [118.563, 119.679], "eng": "Uh...", "ko": "어..."}, {"id": "v38", "speaker": "Marie", "kor": "Et tu as commandé deux pizzas !", "time": [119.709, 121.98], "eng": "And you ordered two pizzas!", "ko": "그리고 피자 두 판 시켜 먹었잖아!"}, {"id": "v39", "speaker": "Léo", "kor": "Euh... Les chats sont très mignons !", "time": [122.01, 125.044], "eng": "Uh... Cats are very cute!", "ko": "어... 고양이들 엄청 귀엽잖아!"}, {"id": "v40", "speaker": "Léo", "kor": "Et moi, j'aime la pizza !", "time": [125.074, 126.76], "eng": "And I love pizza!", "ko": "그리고 나 피자 좋아해!"}, {"id": "v41", "speaker": "Marie", "kor": "Quand je sors, j'ai beaucoup d'énergie !", "time": [126.79, 129.299], "eng": "When I go out, I have lots of energy!", "ko": "나는 밖에 나가면 에너지가 많이 생겨!"}, {"id": "v42", "speaker": "Marie", "kor": "Je vois mes amis, et je suis contente.", "time": [129.329, 131.5], "eng": "I see my friends, and I'm happy.", "ko": "친구들도 만나고, 기분이 좋아져."}, {"id": "v43", "speaker": "Marie", "kor": "'l'énergie' means 'energy'.", "time": [131.53, 134.9], "eng": "'l'énergie' means 'energy'.", "ko": "'l'énergie'는 '에너지, 힘'이라는 뜻이에요."}, {"id": "v44", "speaker": "Léo", "kor": "Non ! Moi, j'ai de l'énergie quand je dors !", "time": [134.93, 140.369], "eng": "No! I get energy when I sleep!", "ko": "아니야! 나는 잘 때 에너지가 생겨!"}, {"id": "v45", "speaker": "Léo", "kor": "Sortir, c'est trop difficile !", "time": [140.399, 143.36], "eng": "Going out is too hard!", "ko": "밖에 나가는 건 너무 힘들어!"}, {"id": "v46", "speaker": "Marie", "kor": "préparer : to prepare.", "time": [143.39, 147.58], "eng": "préparer : to prepare.", "ko": "préparer : 준비하다"}, {"id": "v47", "speaker": "Marie", "kor": "un programme : a schedule or plan.", "time": [147.61, 151.942], "eng": "un programme : a schedule or plan.", "ko": "un programme : 계획표, 일정"}, {"id": "v48", "speaker": "Marie", "kor": "le musée : the museum.", "time": [151.972, 155.217], "eng": "le musée : the museum.", "ko": "le musée : 박물관"}, {"id": "v49", "speaker": "Marie", "kor": "sortir : to go out.", "time": [155.247, 158.272], "eng": "sortir : to go out.", "ko": "sortir : 외출하다, 밖에 나가다"}, {"id": "v50", "speaker": "Marie", "kor": "l'énergie : energy.", "time": [158.302, 160.76], "eng": "l'énergie : energy.", "ko": "l'énergie : 에너지, 힘"}, {"id": "v51", "speaker": "Léo", "kor": "fatigué : tired.", "time": [160.79, 163.785], "eng": "fatigué : tired.", "ko": "fatigué : 피곤한"}, {"id": "v52", "speaker": "Léo", "kor": "rester : to stay.", "time": [163.815, 166.621], "eng": "rester : to stay.", "ko": "rester : 머무르다, 남아 있다"}, {"id": "v53", "speaker": "Léo", "kor": "le pyjama : pajamas.", "time": [166.651, 169.88], "eng": "le pyjama : pajamas.", "ko": "le pyjama : 잠옷"}, {"id": "v54", "speaker": "Léo", "kor": "le canapé : the sofa.", "time": [169.91, 173.033], "eng": "le canapé : the sofa.", "ko": "le canapé : 소파"}, {"id": "v55", "speaker": "Léo", "kor": "se reposer : to rest.", "time": [173.063, 176.66], "eng": "se reposer : to rest.", "ko": "se reposer : 쉬다, 휴식하다"}, {"id": "v56", "speaker": "Marie", "kor": "Et vous ? Vous préférez sortir, ou rester à la maison ?", "time": [177.25, 182.34], "eng": "And you? Do you prefer going out or staying at home?", "ko": "여러분은 어때요? 밖에 나가는 걸 좋아해요, 아니면 집에 있는 걸 좋아해요?"}, {"id": "v57", "speaker": "Léo", "kor": "Attends ! Samedi matin, je vais sortir !", "time": [182.37, 187.9], "eng": "Wait! Saturday morning, I'm going to go out!", "ko": "잠깐! 토요일 아침에 나 나갈 거야!"}, {"id": "v58", "speaker": "Marie", "kor": "Quoi ? Tu vas sortir ? Pourquoi ?", "time": [187.93, 191.62], "eng": "What? You're going out? Why?", "ko": "뭐? 나간다고? 왜?"}, {"id": "v59", "speaker": "Léo", "kor": "Il y a une nouvelle boulangerie à côté !", "time": [191.65, 194.92], "eng": "There's a new bakery next door!", "ko": "옆에 새 빵집이 생겼거든!"}, {"id": "v60", "speaker": "Marie", "kor": "Sérieux ?", "time": [194.95, 195.889], "eng": "Seriously?", "ko": "진짜?"}, {"id": "v61", "speaker": "Léo", "kor": "Je vais acheter dix croissants !", "time": [195.919, 198.06], "eng": "I'm going to buy ten croissants!", "ko": "크루아상 열 개 살 거야!"}, {"id": "v62", "speaker": "Marie", "kor": "Pff... Bon week-end à tous ! Au revoir !", "time": [198.09, 201.18], "eng": "Pff... Have a great weekend everyone! Goodbye!", "ko": "휴... 다들 좋은 주말 보내세요! 안녕히 계세요!"}, {"id": "v63", "speaker": "Léo", "kor": "Au revoir ! À bientôt !", "time": [201.21, 203.48], "eng": "Goodbye! See you soon!", "ko": "안녕히 계세요! 또 만나요!"}]
        }];
        const VOCAB_VIDEO = [{"term": "Bienvenue dans", "mainDef": "Formule pour accueillir quelqu'un dans un lieu ou une émission.", "variants": ["Bienvenue dans"], "subDefs": [{"subTerm": "bienvenue", "subDef": "Mot pour dire qu'on est content de recevoir quelqu'un."}, {"subTerm": "dans", "subDef": "Préposition qui indique l'intérieur d'un lieu ou d'un programme."}], "examples": [{"kor": "Bienvenue dans notre classe de français !", "eng": "Welcome to our French class!", "ko": "우리 프랑스어 수업에 오신 걸 환영해요!"}], "translations": {"en": {"term": "Welcome to", "mainDef": "Used to welcome someone to a place or show.", "subDefs": [{"term": "bienvenue", "def": "welcome"}, {"term": "dans", "def": "in / into"}]}, "ko": {"term": "~에 오신 걸 환영합니다", "mainDef": "장소나 방송에 손님·청취자를 맞이할 때 쓰는 인사.", "subDefs": [{"term": "bienvenue", "def": "환영"}, {"term": "dans", "def": "~ 안에, ~에"}]}}}, {"term": "trop content", "mainDef": "Très heureux, plein de joie (style familier à l'oral).", "contextDef": "À l'oral, « trop » signifie souvent « très » (sens positif).", "variants": ["trop content", "contente"], "subDefs": [{"subTerm": "trop (oral)", "subDef": "Très / super dans la langue parlée."}, {"subTerm": "content / contente", "subDef": "Masculin : content · Féminin : contente."}], "examples": [{"kor": "Elle est trop contente de voir son amie.", "eng": "She's super happy to see her friend.", "ko": "그녀는 친구를 만나서 엄청 기뻐해요."}], "translations": {"en": {"term": "so happy / super glad", "mainDef": "Very happy (casual spoken French uses 'trop' like 'so').", "contextDef": "In everyday speech, 'trop' often means 'really' rather than 'too much'.", "subDefs": [{"term": "trop (spoken)", "def": "so / super"}, {"term": "content / contente", "def": "happy (m. / f.)"}]}, "ko": {"term": "너무 기쁜, 엄청 좋은", "mainDef": "아주 기분이 좋은 상태(구어에서 trop은 '너무/엄청' 뜻으로 자주 쓰임).", "contextDef": "일상 회화에서 trop은 '지나치게'보다 긍정적인 '엄청'으로 쓰여요.", "subDefs": [{"term": "trop (구어)", "def": "너무, 엄청"}, {"term": "content / contente", "def": "기쁜 (남성 / 여성)"}]}}}, {"term": "préparer", "coreTerm": "préparer", "core": true, "mainDef": "Organiser ou mettre en place quelque chose à l'avance.", "variants": ["Je vais préparer", "préparer", "Préparer"], "subDefs": [{"subTerm": "aller + infinitif", "subDef": "Futur proche : indique une action prévue bientôt (je vais préparer)."}, {"subTerm": "préparer (v.)", "subDef": "Verbe régulier en -er : organiser avant."}], "examples": [{"kor": "Ce soir, je vais préparer le dîner.", "eng": "Tonight, I'm going to make dinner.", "ko": "오늘 저녁에 저녁 식사를 준비할 거예요."}], "translations": {"en": {"term": "to prepare / plan", "mainDef": "To prepare or organize something in advance.", "subDefs": [{"term": "aller + infinitive", "def": "Near future ('going to') for upcoming plans."}, {"term": "préparer (v.)", "def": "Regular -er verb: to prepare."}]}, "ko": {"term": "준비하다", "mainDef": "미리 계획을 세우거나 준비하다.", "subDefs": [{"term": "aller + 동사원형", "def": "근접미래: '~할 것이다' (가까운 계획)."}, {"term": "préparer (동사)", "def": "-er 규칙 동사: 준비하다."}]}}}, {"term": "un programme", "coreTerm": "un programme", "core": true, "mainDef": "Une liste d'activités prévues pour une journée ou un week-end (nom masculin).", "variants": ["un super programme", "un programme", "programme"], "subDefs": [{"subTerm": "un (m.)", "subDef": "Nom masculin même s'il finit par -e."}, {"subTerm": "super", "subDef": "Adjectif familier invariable : génial, très bien."}], "examples": [{"kor": "Nous avons un bon programme pour dimanche.", "eng": "We have a great plan for Sunday.", "ko": "우리는 일요일에 좋은 계획이 있어요."}], "translations": {"en": {"term": "a schedule / plan", "mainDef": "A list of planned activities (masculine noun).", "subDefs": [{"term": "un (m.)", "def": "Masculine noun even though it ends in -e."}, {"term": "super", "def": "Casual adjective: great / awesome."}]}, "ko": {"term": "계획표, 일정", "mainDef": "하루나 주말의 활동을 정리한 일정 (남성명사).", "subDefs": [{"term": "un (남성)", "def": "-e로 끝나지만 남성명사예요."}, {"term": "super", "def": "구어 형용사: 엄청 좋은, 멋진."}]}}}, {"term": "au café / au musée", "coreTerm": "le musée", "core": true, "mainDef": "Lieu où l'on expose des œuvres d'art ou des objets historiques (nom masculin).", "variants": ["au café", "au musée", "le musée"], "subDefs": [{"subTerm": "à + le = au", "subDef": "Contraction obligatoire devant un nom masculin singulier (au café, au musée)."}, {"subTerm": "le musée (m.)", "subDef": "Nom masculin même s'il finit par -ée."}], "examples": [{"kor": "Je vais au musée avec mes amis demain.", "eng": "I'm going to the museum with my friends tomorrow.", "ko": "내일 친구들과 박물관에 갈 거예요."}], "translations": {"en": {"term": "the museum (au = to the)", "mainDef": "A place where art or historical objects are exhibited (masculine noun).", "subDefs": [{"term": "à + le = au", "def": "Always contracts to 'au' before a masculine singular noun."}, {"term": "le musée (m.)", "def": "Masculine noun despite ending in -ée."}]}, "ko": {"term": "박물관 (au = ~에)", "mainDef": "예술 작품이나 유물을 전시하는 곳 (남성명사).", "subDefs": [{"term": "à + le = au", "def": "남성 단수 명사 앞에서 à + le는 반드시 au로 축약돼요."}, {"term": "le musée (남성)", "def": "-ée로 끝나지만 남성명사예요."}]}}}, {"term": "Quoi ?!", "mainDef": "Interjection familière pour exprimer une grande surprise.", "variants": ["Quoi ?!", "Quoi ?"], "examples": [{"kor": "Quoi ?! Tu pars déjà ?", "eng": "What?! You're leaving already?", "ko": "뭐?! 벌써 가려고?"}], "translations": {"en": {"term": "What?!", "mainDef": "Casual reaction showing shock or disbelief."}, "ko": {"term": "뭐?! / 뭐라고?", "mainDef": "깜짝 놀라거나 믿기지 않을 때 쓰는 구어 반응."}}}, {"term": "ne ... pas", "mainDef": "Structure de base pour faire une phrase négative (comme un sandwich autour du verbe).", "variants": ["ne suis pas", "ne veux pas", "ne vas pas", "ne te reposes pas"], "subDefs": [{"subTerm": "ne + verbe + pas", "subDef": "« ne » va avant le verbe, « pas » va juste après le verbe."}], "examples": [{"kor": "Je ne travaille pas samedi.", "eng": "I don't work on Saturday.", "ko": "나는 토요일에 일하지 않아요."}], "translations": {"en": {"term": "not (nega         function renderTextWithVocab(text) {
            if (!text) return '';
            const matches = [];
            VOCAB_TERMS.forEach(({ term, idx }) => {
                let i = 0;
                while ((i = text.indexOf(term, i)) !== -1) {
                    const end = i + term.length;
                    const ov = matches.some(m => (i >= m.start && i < m.end) || (end > m.start && end <= m.end) || (i <= m.start && end >= m.end));
                    if (!ov && vocabStartOK(text, i) && vocabEndOK(text, end)) matches.push({ start: i, end, term, idx });
                    i += 1;
                }
            });
            matches.sort((a, b) => a.start - b.start);
            let out = '', last = 0;
            matches.forEach(mt => {
                if (mt.start > last) out += esc(text.substring(last, mt.start));
                out += `<span class="cursor-pointer border-b border-dotted border-gray-400 text-gray-800 hover:border-black hover:text-black transition-all duration-200 font-medium vk-hl" data-vocab-idx="${mt.idx}">${esc(text.substring(mt.start, mt.end))}</span>`;
                last = mt.end;
            });
            if (last < text.length) out += esc(text.substring(last));
            return out;

        const normFr = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');

                    const end = i + term.length;

                    i += 1;
                }

            return m.filter(x => scope === 'all' || (VOCAB_VIDEO[x.idx] && VOCAB_VIDEO[x.idx].core)).sort((a, b) => a.start - b.start).map((x, j) => ({ k: String(j), start: x.start, end: x.end, idx: x.idx, answer: text.substring(x.start, x.end) }));

        });
        appEl.addEventListener('pointermove', (e) => { if (lineHold.timer && (Math.abs(e.clientX - lineHold.x) > LINE_HOLD_MOVE || Math.abs(e.clientY - lineHold.y) > LINE_HOLD_MOVE)) { lineHoldClear(); lineHold.moved = true; } });
        appEl.addEventListener('pointerup', () => { if (lineHold.timer) { clearTimeout(lineHold.timer); lineHold.timer = null; } lineHoldMark(false); if (lineHold.fired) setTimeout(lineHoldClear, 400); });
        appEl.addEventListener('pointercancel', lineHoldClear);

        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) playLineOnly(curVideo().script[i - 1]); }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = i === -1 ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) playLineOnly(curVideo().script[ni]); }
            else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); }
            else if (e.key === 's' || e.key === 'S') { const order = ['listen', 'words', 'full']; setCap(order[(order.indexOf(learn.cap) + 1) % 3]); }
        });

        appEl.addEventListener('click', (e) => {
            const ecb = e.target.closest('[data-end]'); if (ecb) { if (ecb.dataset.end === 'rewatch') rewatchWithSubs(); else cancelEndCard(); return; }
            const hd = e.target.closest('[data-home-dict]'); if (hd) { dictation.on = true; dictation.scope = 'core'; dictation.ans = {}; dictation.res = {}; dictation.shown = {}; dictation.wrong = {}; learn.layout = 'script'; setTab('video'); return; }
            const vdo = e.target.closest('[data-video-open]'); if (vdo) { if (app.activeTab === 'home') { dictation.on = false; learn.layout = IS_AUDIO_ONLY ? 'script' : 'split'; } setTab('video'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const sl = e.target.closest('[data-setlang]'); if (sl) { app.lang = sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            if (app.langOpen) { app.langOpen = false; buildApp(); return; }

            const tab = app.activeTab;
            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_VIDEO[+vspan.dataset.vocabIdx]; const r = firstRect(vspan); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) closeVocabPopup(); else showVocabPopup(w, r.left + r.width / 2, r.bottom, true); return; }
                const pt = e.target.closest('[data-pane-toggle]');
                if (pt && !IS_AUDIO_ONLY) {
                    let vOn = learn.layout !== 'script', sOn = learn.layout !== 'video';
                    if (pt.dataset.paneToggle === 'video') vOn = !vOn; else sOn = !sOn;
                    if (!vOn && !sOn) return;
                    const nl = (vOn && sOn) ? 'split' : (vOn ? 'video' : 'script');
                    if (dictation.on && nl !== 'script') dictation.on = false;
                    learn.layout = nl;
                    const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML();
                    updatePanes(); rebuildToolbar(); return;
                }
                const rate = e.target.closest('[data-rate]');
                if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                if (e.target.closest('.dict-in')) { e.stopPropagation(); return; }
                const mdb = e.target.closest('[data-md]');
                if (mdb) {
                    if (mdb.dataset.md === 'dict') { dictation.on = true; learn.layout = 'script'; }
                    else { dictation.on = false; learn.layout = IS_AUDIO_ONLY ? 'script' : 'split'; }
                    const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML();
                    updatePanes(); rebuildToolbar(); return;
                }
                const dsc = e.target.closest('[data-dict-scope]');
                if (dsc) { dictation.scope = dsc.dataset.dictScope; dictation.ans = {}; dictation.res = {}; dictation.shown = {}; dictation.wrong = {}; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); refreshScriptHead(); return; }
                if (e.target.closest('[data-dict-reset]')) { dictation.ans = {}; dictation.res = {}; dictation.shown = {}; dictation.wrong = {}; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); refreshScriptHead(); return; }
                const dck = e.target.closest('[data-dict-check]'); if (dck) { e.stopPropagation(); dictCheck(dck.dataset.dictCheck); return; }
                const dsh = e.target.closest('[data-dict-show]'); if (dsh) { e.stopPropagation(); dictation.shown[dsh.dataset.dictShow] = true; replaceLine(dsh.dataset.dictShow); refreshScriptHead(); return; }
                const lp = e.target.closest('[data-line-play]');
                if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) { clearSeg(); learn.player.pauseVideo(); } } else playLineOnly(line); return; }
                const lt = e.target.closest('[data-action^="line-trans-"]');
                if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const capBtn = e.target.closest('[data-cap]'); if (capBtn) { setCap(capBtn.dataset.cap); return; }
                if (e.target.closest('[data-cap-action]')) { learn.revealed = {}; learn.tries = {}; setCap(learn.cap); return; }
                const seekLine = e.target.closest('[data-line-seek]');
                if (seekLine) {
                    const lid = seekLine.dataset.lineId;
                    if (dictation.on) { playLineOnly(curVideo().script.find(l => l.id === lid)); return; }
                    if (lid && learn.cap !== 'full' && !learn.revealed[lid]) {
                        if (learn.tries[lid]) { learn.revealed[lid] = true; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); refreshScriptHead(); return; }
                        learn.tries[lid] = 1; replaceLine(lid); playLineOnly(curVideo().script.find(l => l.id === lid)); return;
                    }
                    if (learn.player) { if ((lineHold.fired && lineHold.id === lid) || lineHold.moved) { lineHoldClear(); return; } playLineOnly(curVideo().script.find(l => l.id === lid)); }
                    return;
                }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_VIDEO[i], i); return; }
                const a = e.target.closest('[data-action]');
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind' && learn.player) { learn.player.seekTo(Math.max(0, learn.currentTime - 1.5)); learn.currentTime = learn.player.getCurrentTime(); updateSeekUI(); }
                    else if (act === 'forward' && learn.player) { learn.player.seekTo(Math.min(learn.duration || 9999, learn.currentTime + 1.5)); learn.currentTime = learn.player.getCurrentTime(); updateSeekUI(); }
                    else if (act === 'play' && learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'vocab') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                if (a.dataset.action === 'vocab-core-all' || a.dataset.action === 'vocab-core-only') { vocabState.coreOnly = a.dataset.action === 'vocab-core-only'; paint(); return; }
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; const si = qs('#vocab-search', viewRoot()); if (si) { si.value = ''; si.focus(); } refreshVocabGrid(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const defS = app.lang !== 'fr' || vocabState.globalTrans; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : defS; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_ALL[i], i, !cur); }
                else if (a.dataset.action === 'vocab-ex') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; vocabState.itemEx[i] = !vocabState.itemEx[i]; const defS = app.lang !== 'fr' || vocabState.globalTrans; card.outerHTML = vocabItemHTML(VOCAB_ALL[i], i, vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : defS); }
                return;
            }
            if (tab === 'quiz') {
                if (e.target.closest('[data-action="quiz-retry"]')) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return;
                const qid = +qEl.dataset.qid, st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]');
                if (opt) { const idx = +opt.dataset.opt, o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q && q.dataset.q === 'hint') { st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                if (e.target.closest('[data-action="q-trans"]')) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action="discuss-qtrans"]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); if (!qEl) return;
                const id = +qEl.dataset.did; discussState[id].showTrans = !discussState[id].showTrans; rerenderDiscussItem(id);
            }
        });

        appEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing && e.target.matches && e.target.matches('.dict-in')) {
                e.preventDefault(); dictation.ans[e.target.dataset.dict] = e.target.value; dictCheck(e.target.dataset.dict.split('|')[0]);
            }
        });
        appEl.addEventListener('input', (e) => {
            if (e.target.matches && e.target.matches('.dict-in')) { dictation.ans[e.target.dataset.dict] = e.target.value; return; }
            if (e.target.id === 'seek' && learn.player) { const t = parseFloat(e.target.value); learn.player.seekTo(t); learn.currentTime = t; updateSeekUI(); return; }
            if (app.activeTab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; refreshVocabGrid(); }
        });
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'video') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_VIDEO[+span.dataset.vocabIdx]; if (!w) return;
            const r = firstRect(span); showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'video') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });

        buildApp();
    })();

</script>
</body>
</html>
